<script id="v51-upgrades-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };

  // =========================================================================
  // [1 & 2] Remove Level Banner & Keep ONLY Wellness in Goal Subtools
  // =========================================================================
  function cleanLevelsAndCompanionTools() {
    document.getElementById('v36LevelBanner')?.remove();
    const wellness = document.getElementById('v36WellnessSection');
    if (wellness) {
      wellness.style.display = 'grid';
    }
  }

  // =========================================================================
  // [3] Bilingual Daily Summary Card (Arabic & English Canvas + Copy Text)
  // =========================================================================
  function openBilingualDailySummaryModal() {
    document.getElementById('v43DailySummaryOverlay')?.remove();
    const today = new Date().toISOString().slice(0, 10);
    const allGoals = safeGet('khatwati-goals-v1', []).filter(g => g.period === 'daily');
    const doneGoals = allGoals.filter(g => (g.records?.[today] || 0) >= g.target).length;
    const goalPct = allGoals.length ? Math.round((doneGoals / allGoals.length) * 100) : 0;

    const books = safeGet('khatwati-books-v1', []);
    let pagesToday = 0;
    books.forEach(b => (b.history || []).filter(h => h.date === today).forEach(h => { if (h.delta > 0) pagesToday += h.delta; }));

    const studyPlans = safeGet('khatwati-study-v1', []);
    let studyMinsToday = 0;
    studyPlans.forEach(p => (p.studyHistory || []).filter(s => s.date === today).forEach(s => { studyMinsToday += (s.minutes || 0); }));

    const wellness = safeGet('khatwati-wellness-v1', {})[today] || { water: 0 };
    const ayahText = document.getElementById('v37QuoteText')?.textContent?.trim() || '﴿ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾';
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--green').trim() || '#28664c';

    document.body.insertAdjacentHTML('beforeend', `
      <div class="overlay show" id="v43DailySummaryOverlay">
        <div class="dialog" style="max-width:410px;text-align:center">
          <div class="dialog-head">
            <h3>📸 ${tx('بطاقة ملخص يومك للآيفون', 'Your Daily Summary Card')}</h3>
            <button type="button" class="close" id="v43CloseSummaryModal">×</button>
          </div>
          <div class="v43-story-canvas-wrap">
            <canvas id="v43StoryCanvas" width="720" height="1080"></canvas>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button type="button" class="btn" id="v43DownloadStoryBtn" style="flex:1">📥 ${tx('حفظ كصورة', 'Save Image')}</button>
            <button type="button" class="btn secondary" id="v43CopySummaryTextBtn" style="flex:1">📋 ${tx('نسخ النص', 'Copy Text')}</button>
          </div>
        </div>
      </div>
    `);

    const canvas = document.getElementById('v43StoryCanvas');
    const ctx = canvas.getContext('2d');
    const grad = ctx.createLinearGradient(0, 0, 720, 1080);
    grad.addColorStop(0, accent);
    grad.addColorStop(1, '#12261e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 720, 1080);

    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(48, 60, 624, 960, 36);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 36px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(tx('✳ خطوتي | ملخص إنجاز اليوم', '✳ Khatwati | Daily Summary'), 360, 145);

    ctx.font = '24px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(today, 360, 192);

    ctx.beginPath();
    ctx.arc(360, 340, 95, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 58px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(`${goalPct}%`, 360, 355);
    ctx.font = '22px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(tx(`الأهداف المكتملة (${doneGoals}/${allGoals.length})`, `Completed Goals (${doneGoals}/${allGoals.length})`), 360, 475);

    const metrics = [
      [`📚 ${pagesToday}`, tx('صفحة مقروءة', 'Pages Read')],
      [`✍️ ${studyMinsToday}`, tx('دقيقة دراسة', 'Study Mins')],
      [`💧 ${wellness.water || 0}/8`, tx('أكواب ماء', 'Water Cups')]
    ];
    metrics.forEach((m, i) => {
      const bx = 76 + i * 194;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.roundRect(bx, 525, 180, 130, 22);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText(m[0], bx + 90, 585);
      ctx.font = '20px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(m[1], bx + 90, 628);
    });

    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.roundRect(76, 700, 568, 220, 24);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 22px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(tx('📖 آية اليوم', '📖 Daily Ayah'), 360, 748);
    ctx.font = '24px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    const shortAyah = ayahText.length > 65 ? ayahText.slice(0, 65) + '...' : ayahText;
    ctx.fillText(shortAyah, 360, 815);

    ctx.font = '19px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.68)';
    ctx.fillText(tx('تطبيق خطوتي — رفيقك اليومي للأهداف والدراسة', 'Khatwati — Your Daily Goals & Study Companion'), 360, 975);

    document.getElementById('v43CloseSummaryModal').onclick = () => document.getElementById('v43DailySummaryOverlay')?.remove();
    document.getElementById('v43DownloadStoryBtn').onclick = () => {
      const a = document.createElement('a');
      a.download = `khatwati-summary-${today}.png`;
      a.href = canvas.toDataURL('image/png');
      a.click();
      window.khatwatiNotice(tx('تم حفظ بطاقة ملخص اليوم كصورة ✓', 'Daily Summary saved as image ✓'));
    };
    document.getElementById('v43CopySummaryTextBtn').onclick = () => {
      const txt = isEn()
        ? `📋 Khatwati Daily Summary (${today}):\n✅ Goals: ${doneGoals}/${allGoals.length} (${goalPct}%)\n📚 Reading: ${pagesToday} pages\n✍️ Study: ${studyMinsToday} mins\n💧 Water: ${wellness.water || 0}/8 cups`
        : `📋 ملخص إنجاز اليوم من خطوتي (${today}):\n✅ الأهداف: ${doneGoals}/${allGoals.length} (${goalPct}%)\n📚 القراءة: ${pagesToday} صفحة\n✍️ الدراسة: ${studyMinsToday} دقيقة\n💧 الماء: ${wellness.water || 0}/8 أكواب`;
      try { navigator.clipboard.writeText(txt); } catch {}
      window.khatwatiNotice(tx('تم نسخ نص الملخص ✓', 'Summary text copied ✓'));
    };
  }

  function wireBilingualSummaryButton() {
    const btn = document.getElementById('v43OpenDailySummaryBtn');
    if (btn) {
      btn.onclick = openBilingualDailySummaryModal;
      btn.innerHTML = `📸 ${tx('ملخص يومي', 'Daily Summary')}`;
    }
  }

  // =========================================================================
  // [5 & 6] Screen Wake Lock + Desk Clock Mode (🖥️) + Scene Theme & Stopwatch Shading Fix
  // =========================================================================
  let wakeLockSentinel = null;
  let wakeLockEnabled = true;

  async function requestKhatwatiWakeLock() {
    if (!wakeLockEnabled) return;
    try {
      if ('wakeLock' in navigator && !wakeLockSentinel) {
        wakeLockSentinel = await navigator.wakeLock.request('screen');
        wakeLockSentinel.addEventListener('release', () => { wakeLockSentinel = null; });
      }
    } catch {}
  }

  async function releaseKhatwatiWakeLock() {
    try {
      if (wakeLockSentinel) {
        await wakeLockSentinel.release();
        wakeLockSentinel = null;
      }
    } catch {}
  }

  // Override v46PaintCountdowns so when mode === 'stopwatch', progressive shading is NEVER applied!
  const origPaintCountdowns = window.v46PaintCountdowns;
  window.v46PaintCountdowns = function() {
    const mode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
    const t = safeGet('khatwati-study-timer-v1', null);
    if (mode === 'stopwatch' || t?.mode === 'stopwatch') {
      const toggleBtn = document.getElementById('studyTimerToggle');
      if (toggleBtn) {
        toggleBtn.classList.remove('v46-shaded-btn', 'v46-timer-running');
        toggleBtn.style.removeProperty('--v46-fill');
      }
      const faceEl = document.getElementById('studyTimerFace');
      if (faceEl) {
        faceEl.style.setProperty('--study-progress', '0deg');
      }
      document.querySelectorAll('.study-session-open').forEach(btn => {
        btn.classList.remove('v46-shaded-btn', 'v46-timer-running');
        btn.style.removeProperty('--v46-fill');
      });
      return;
    }
    if (typeof origPaintCountdowns === 'function') {
      origPaintCountdowns();
    }
  };

  function upgradeStudyStudioV51() {
    const overlay = document.getElementById('studyTimerOverlay');
    if (!overlay) {
      releaseKhatwatiWakeLock();
      return;
    }
    const dialog = overlay.querySelector('.study-timer-dialog');
    if (!dialog) return;

    const currentMode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
    dialog.dataset.timerMode = currentMode;

    const savedScene = LS.getItem('khatwati-study-scene') || 'sage';
    if (!dialog.dataset.scene) {
      dialog.dataset.scene = savedScene;
      overlay.dataset.scene = savedScene;
    }

    dialog.querySelectorAll('[data-study-scene]').forEach(btn => {
      if (btn.dataset.v51SceneBound === 'true') return;
      btn.dataset.v51SceneBound = 'true';
      btn.addEventListener('click', e => {
        e.stopPropagation();
        const sc = btn.dataset.studyScene || 'sage';
        dialog.dataset.scene = sc;
        overlay.dataset.scene = sc;
        try { LS.setItem('khatwati-study-scene', sc); } catch {}
        dialog.querySelectorAll('[data-study-scene]').forEach(b => {
          const isAct = b.dataset.studyScene === sc;
          b.classList.toggle('active', isAct);
          b.setAttribute('aria-pressed', String(isAct));
        });
      }, true);
    });

    dialog.querySelectorAll('[data-v50-mode]').forEach(btn => {
      if (btn.dataset.v51ModeBound === 'true') return;
      btn.dataset.v51ModeBound = 'true';
      btn.addEventListener('click', () => {
        const m = btn.dataset.v50Mode || 'countdown';
        dialog.dataset.timerMode = m;
        if (m === 'stopwatch') {
          window.v46PaintCountdowns();
        }
      });
    });

    if (!dialog.querySelector('#v51StudioToolsBar')) {
      const scenesBar = dialog.querySelector('.study-scenes');
      if (scenesBar) {
        scenesBar.insertAdjacentHTML('afterend', `
          <div class="v51-studio-top-tools" id="v51StudioToolsBar">
            <button type="button" class="v51-studio-chip active" id="v51WakeLockBtn" title="${tx('منع انطفاء شاشة الآيفون والآيباد أثناء الدراسة', 'Keep screen awake while studying')}">
              🔆 ${tx('منع انطفاء الشاشة: مفعّل', 'Keep Awake: ON')}
            </button>
            <button type="button" class="v51-studio-chip" id="v51DeskClockBtn" title="${tx('تكبير المؤقت لملء الشاشة كساعة مكتبية', 'Fullscreen Desk Clock / StandBy Mode')}">
              🖥️ ${tx('وضع الساعة المكتبية', 'Desk Clock Mode')}
            </button>
          </div>
        `);

        requestKhatwatiWakeLock();

        const wakeBtn = document.getElementById('v51WakeLockBtn');
        wakeBtn.onclick = () => {
          wakeLockEnabled = !wakeLockEnabled;
          wakeBtn.classList.toggle('active', wakeLockEnabled);
          wakeBtn.innerHTML = wakeLockEnabled
            ? `🔆 ${tx('منع انطفاء الشاشة: مفعّل', 'Keep Awake: ON')}`
            : `🔅 ${tx('منع انطفاء الشاشة: متوقف', 'Keep Awake: OFF')}`;
          if (wakeLockEnabled) {
            requestKhatwatiWakeLock();
            window.khatwatiNotice(tx('🔆 ستبقى شاشة الجهاز مضاءة طوال جلسة الدراسة', '🔆 Screen will stay awake during your study session'));
          } else {
            releaseKhatwatiWakeLock();
          }
        };

        const deskBtn = document.getElementById('v51DeskClockBtn');
        deskBtn.onclick = () => {
          const isDesk = overlay.classList.toggle('v51-desk-clock-mode');
          deskBtn.classList.toggle('active', isDesk);
          deskBtn.innerHTML = isDesk
            ? `↩ ${tx('الوضع العادي', 'Standard View')}`
            : `🖥️ ${tx('وضع الساعة المكتبية', 'Desk Clock Mode')}`;
          if (isDesk) {
            requestKhatwatiWakeLock();
            try { overlay.requestFullscreen?.(); } catch {}
          } else {
            try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch {}
          }
        };
      }
    }
  }

  function syncAllV51() {
    cleanLevelsAndCompanionTools();
    wireBilingualSummaryButton();
    upgradeStudyStudioV51();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV51);

  syncAllV51();
})();
</script>

<script id="v52-complete-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };
  const escHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const KhatwatiV52 = window.KhatwatiV52 = {};

  // =========================================================================
  // [4 & 5] 3-Mode Dark Theme (Light ☀️ / Dark 🌙 / Auto System 📱)
  // =========================================================================
  const THEME_MODE_KEY = 'khatwati-theme-mode-v52'; // 'light' | 'dark' | 'auto'
  const darkMediaQuery = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;

  KhatwatiV52.getThemeMode = function() {
    const saved = LS.getItem(THEME_MODE_KEY);
    if (saved === 'light' || saved === 'dark' || saved === 'auto') return saved;
    return LS.getItem('khatwati-dark-mode') === 'true' ? 'dark' : 'light';
  };

  KhatwatiV52.applyThemeMode = function(mode) {
    const m = ['light', 'dark', 'auto'].includes(mode) ? mode : KhatwatiV52.getThemeMode();
    try { LS.setItem(THEME_MODE_KEY, m); } catch {}
    let shouldBeDark = false;
    if (m === 'dark') {
      shouldBeDark = true;
    } else if (m === 'auto') {
      shouldBeDark = !!(darkMediaQuery && darkMediaQuery.matches);
    }
    document.body.classList.toggle('dark-mode', shouldBeDark);
    try { LS.setItem('khatwati-dark-mode', shouldBeDark ? 'true' : 'false'); } catch {}
  };

  if (darkMediaQuery && typeof darkMediaQuery.addEventListener === 'function') {
    darkMediaQuery.addEventListener('change', () => {
      if (KhatwatiV52.getThemeMode() === 'auto') {
        KhatwatiV52.applyThemeMode('auto');
      }
    });
  }
  KhatwatiV52.applyThemeMode(KhatwatiV52.getThemeMode());

  // =========================================================================
  // [7] Smart Notifications System (Web Notifications + Service Worker + Audio Chime + In-App Alert)
  // =========================================================================
  const NOTIF_PREF_KEY = 'khatwati-reminder-v1';

  KhatwatiV52.playNotificationChime = function() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, ctx.currentTime + i * 0.14);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.14 + 0.35);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(ctx.currentTime + i * 0.14);
        osc.stop(ctx.currentTime + i * 0.14 + 0.36);
      });
    } catch {}
  };

  KhatwatiV52.sendSmartNotification = async function(title, body) {
    KhatwatiV52.playNotificationChime();
    if (window.khatwatiNotice) {
      window.khatwatiNotice(`🔔 ${title}: ${body}`);
    }
    try {
      if ('Notification' in window) {
        if (Notification.permission === 'default') {
          await Notification.requestPermission();
        }
        if (Notification.permission === 'granted') {
          if ('serviceWorker' in navigator) {
            const reg = await navigator.serviceWorker.ready.catch(() => null);
            if (reg && typeof reg.showNotification === 'function') {
              await reg.showNotification(title, { body, icon: 'icon.svg', badge: 'icon.svg' });
              return true;
            }
          }
          new Notification(title, { body, icon: 'icon.svg' });
          return true;
        }
      }
    } catch {}
    return false;
  };

  KhatwatiV52.requestAndEnableNotifications = async function() {
    const prefs = safeGet(NOTIF_PREF_KEY, { enabled: false, time: '20:00' });
    prefs.enabled = true;
    if (!prefs.time) prefs.time = '20:00';
    safeSet(NOTIF_PREF_KEY, prefs);

    let perm = 'unsupported';
    try {
      if ('Notification' in window) {
        perm = await Notification.requestPermission();
      }
    } catch {}

    const toggleEl = document.getElementById('reminderToggle');
    if (toggleEl) toggleEl.checked = true;

    await KhatwatiV52.sendSmartNotification(
      tx('خطوتي | الإشعارات مفعّلة 🔔', 'Khatwati | Notifications Active 🔔'),
      tx(`سيصلك تذكيرك اليومي الساعة ${prefs.time}`, `Daily reminder set for ${prefs.time}`)
    );
    return perm;
  };

  setInterval(() => {
    const prefs = safeGet(NOTIF_PREF_KEY, { enabled: false, time: '20:00' });
    if (!prefs.enabled || !prefs.time) return;
    const now = new Date();
    const hhmm = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
    const todayKey = now.toISOString().slice(0, 10);
    if (hhmm === prefs.time && prefs.lastFiredDate !== todayKey) {
      prefs.lastFiredDate = todayKey;
      safeSet(NOTIF_PREF_KEY, prefs);
      KhatwatiV52.sendSmartNotification(
        tx('تذكير خطوتي اليومي 🌱', 'Khatwati Daily Reminder 🌱'),
        tx('خذ لحظة لإتمام أهدافك وجلسة دراستك اليوم!', 'Take a moment to complete your goals and study session today!')
      );
    }
  }, 25000);

  // =========================================================================
  // [4, 5, 7] Upgraded Settings Panel (⚙️) with Dark Mode (Light/Dark/Auto),

  if (window.KhatwatiV50) {

      const hasPin = !!LS.getItem(PIN_KEY);
      const tMode = KhatwatiV52.getThemeMode();
      const syncCfg = safeGet('khatwati-cloud-sync-v1', {});
      const notifPrefs = safeGet(NOTIF_PREF_KEY, { enabled: false, time: '20:00' });

      panel.innerHTML = `
        <div class="section-head" style="margin-bottom:8px">

          <button type="button" class="v35-pill" id="v50BackToGoalsFromSettings">↩ ${tx('العودة للأهداف', 'Back to Goals')}</button>
        </div>
        <p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">
          ${tx('كل إعدادات المظهر (فاتح/داكن/تلقائي)، الإشعارات، القفل، والمزامنة المباشرة في مكان واحد:', 'All appearance modes (Light/Dark/Auto), notifications, lock, and live sync in one place:')}
        </p>
        <div class="v50-settings-grid">
          <div class="v50-setting-row">
            <div>
              <strong>🎨 ${tx('الوضع الداكن والمظهر', 'Dark Mode & Appearance')}</strong>
              <small>${tx('اختر فاتح، داكن، أو تلقائي حسب نظام الموبايل/الآيباد', 'Choose Light, Dark, or Auto based on device settings')}</small>
            </div>
            <div style="display:flex;gap:5px;flex-wrap:wrap">
              <button type="button" class="v35-pill ${tMode === 'light' ? 'active' : ''}" data-v52-tmode="light">☀️ ${tx('فاتح', 'Light')}</button>
              <button type="button" class="v35-pill ${tMode === 'dark' ? 'active' : ''}" data-v52-tmode="dark">🌙 ${tx('داكن', 'Dark')}</button>
              <button type="button" class="v35-pill ${tMode === 'auto' ? 'active' : ''}" data-v52-tmode="auto">📱 ${tx('تلقائي', 'Auto')}</button>
              <button type="button" class="v35-pill" id="v50OpenThemesBtn">🎨 ${tx('الألوان', 'Colors')}</button>
            </div>
          </div>

          <div class="v50-setting-row">
            <div>
              <strong>🔔 ${tx('الإشعارات والتنبيه اليومي', 'Notifications & Daily Reminder')}</strong>
              <small>${notifPrefs.enabled ? tx(`مفعّل يومياً الساعة ${notifPrefs.time || '20:00'}`, `Active daily at ${notifPrefs.time || '20:00'}`) : tx('فعّل الإشعارات لتذكيرك بأهدافك وجلسات الدراسة', 'Enable notifications for daily goal & study alerts')}</small>
            </div>
            <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
              <input type="time" id="v52NotifTimeInput" value="${escHtml(notifPrefs.time || '20:00')}" style="padding:4px 8px;border-radius:9px;border:1px solid var(--line);background:var(--white);color:var(--ink)">
              <button type="button" class="v35-pill ${notifPrefs.enabled ? 'active' : ''}" id="v52ToggleNotifBtn">
                ${notifPrefs.enabled ? tx('🔔 مفعّل', '🔔 Enabled') : tx('🔕 تفعيل الإشعارات', '🔕 Enable Alerts')}
              </button>
              <button type="button" class="v35-pill" id="v52TestNotifBtn">📣 ${tx('تجربة', 'Test')}</button>
            </div>
          </div>

          <div class="v50-setting-row">
            <div>
              <strong>🌐 ${tx('لغة التطبيق وحجم الخط', 'Language & Font Scale')}</strong>
              <small>${tx('تغيير لغة الواجهة وتكبير أو تصغير النصوص', 'Switch language or adjust UI text size')}</small>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <button type="button" class="v35-pill" id="v50ToggleLangBtn">🌐 ${isEn() ? 'Switch to Arabic' : 'English'}</button>
              <button type="button" class="v35-pill" id="v50ScaleDownBtn">A-</button>
              <button type="button" class="v35-pill" id="v50ScaleUpBtn">A+</button>
            </div>
          </div>

          <div class="v50-setting-row">
            <div>
              <strong>🔒 ${tx('قفل التطبيق (لوحة أرقام الآيفون)', 'iOS Passcode App Lock')}</strong>
              <small>${hasPin ? tx('القفل مفعّل حالياً (٤ أرقام)', 'Passcode lock is active (4 digits)') : tx('حماية أهدافك وملاحظاتك برمز دخول', 'Protect your app with a 4-digit passcode')}</small>
            </div>
            <button type="button" class="v35-pill ${hasPin ? 'active' : ''}" id="v50ManagePinBtn">
              ${hasPin ? tx('🔒 قفل الآن / تعديل', '🔒 Lock / Edit PIN') : tx('🔓 تعيين رمز قفل', '🔓 Set Passcode')}
            </button>
          </div>

          <div class="v50-setting-row">
            <div>
              <strong>🟢 ⚡ ${tx('المزامنة المباشرة (Live Sync)', 'Direct Live Sync')}</strong>
              <small>${tx('رمز قناتك المباشرة:', 'Live channel code:')} <code style="font-weight:700">${escHtml(syncCfg.syncCode || tx('تلقائي', 'Auto'))}</code></small>
            </div>
            <button type="button" class="v35-pill active" id="v50OpenSyncSettingsBtn">⚡ ${tx('إعدادات المزامنة', 'Sync Settings')}</button>
          </div>
        </div>
      `;

      document.getElementById('v50BackToGoalsFromSettings').onclick = () => {
        document.querySelector('.view-btn[data-view="goals"]')?.click();
      };
      panel.querySelectorAll('[data-v52-tmode]').forEach(btn => {
        btn.onclick = () => {
          KhatwatiV52.applyThemeMode(btn.dataset.v52Tmode);

        };

      document.getElementById('v50OpenThemesBtn').onclick = () => {

      };

          safeSet(NOTIF_PREF_KEY, p);

        );

      };

      document.getElementById('v50ScaleUpBtn').onclick = () => document.getElementById('sizeUp')?.click();

      window.scrollTo({ top: 0, behavior: 'instant' });

  // =========================================================================
  // [2 & 8] Rock-Solid Stopwatch Pause/Resume/Reset + Auto Landscape Fullscreen
  // =========================================================================
  const SW_STATE_KEY = 'khatwati-stopwatch-v52';
  let swTickTimer = null;

  function getSwState() {
    return safeGet(SW_STATE_KEY, { running: false, accMs: 0, startedAt: null });
  }
  function setSwState(st) {
    safeSet(SW_STATE_KEY, st);
  }
  function getSwElapsedMs(st) {
    const base = Number(st.accMs) || 0;
    if (!st.running || !st.startedAt) return base;
    return base + Math.max(0, Date.now() - Number(st.startedAt));
  }

  function formatSwMs(ms) {
    const totalSec = Math.floor(ms / 1000);
    const hrs = Math.floor(totalSec / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    if (hrs > 0) {
      return `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }
    return `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
  }

  KhatwatiV52.paintStopwatchUI = function() {
    const mode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
    if (mode !== 'stopwatch') return;
    const st = getSwState();
    const elapsedMs = getSwElapsedMs(st);
    const valEl = document.getElementById('studyTimerValue');
    if (valEl) {
      valEl.textContent = formatSwMs(elapsedMs);
    }
    const faceEl = document.getElementById('studyTimerFace');
    if (faceEl) {
      faceEl.style.setProperty('--study-progress', '0deg');
    }
    const toggleBtn = document.getElementById('studyTimerToggle');
    if (toggleBtn) {
      toggleBtn.classList.remove('v46-shaded-btn', 'v46-timer-running');
      toggleBtn.style.removeProperty('--v46-fill');
      if (st.running) {
        toggleBtn.textContent = tx('⏸ إيقاف مؤقت', '⏸ Pause');
      } else if (elapsedMs > 0) {
        toggleBtn.textContent = tx('▶ استئناف', '▶ Resume');
      } else {
        toggleBtn.textContent = tx('▶ ابدأ', '▶ Start');
      }
    }
    const statusEl = document.getElementById('studyTimerStatus');
    if (statusEl) {
      if (st.running) {
        statusEl.textContent = tx('⏱️ المؤقت التصاعدي يعمل الآن... اضغط إيقاف مؤقت بأي لحظة.', '⏱️ Stopwatch running... Tap Pause anytime.');
      } else if (elapsedMs > 0) {
        statusEl.textContent = tx('⏸ المؤقت متوقف مؤقتاً — اضغط استئناف للمتابعة.', '⏸ Stopwatch paused — tap Resume to continue.');
      } else {
        statusEl.textContent = tx('وقت مفتوح لمادتك، ابدأ عندما تكون مستعداً.', 'Open count-up session. Start when ready.');
      }
    }
  };

  function startSwTicker() {
    clearInterval(swTickTimer);
    swTickTimer = setInterval(KhatwatiV52.paintStopwatchUI, 250);
  }

  function wireStudyTimerV52() {
    const overlay = document.getElementById('studyTimerOverlay');
    if (!overlay) {
      clearInterval(swTickTimer);
      return;
    }
    const dialog = overlay.querySelector('.study-timer-dialog');
    if (!dialog) return;

    const toggleBtn = document.getElementById('studyTimerToggle');
    const stopBtn = document.getElementById('studyTimerStop');
    const actionsRow = dialog.querySelector('.study-timer-actions');

    if (actionsRow && !document.getElementById('v52StudyResetBtn')) {
      const resetBtn = document.createElement('button');
      resetBtn.type = 'button';
      resetBtn.id = 'v52StudyResetBtn';
      resetBtn.className = 'btn secondary';
      resetBtn.style.flex = '0 0 auto';
      resetBtn.style.padding = '0 14px';
      resetBtn.title = tx('تصفير المؤقت والبدء من جديد', 'Reset timer to zero');
      resetBtn.textContent = `🔄 ${tx('تصفير', 'Reset')}`;
      resetBtn.onclick = () => {
        const mode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
        if (mode === 'stopwatch') {
          clearInterval(swTickTimer);
          setSwState({ running: false, accMs: 0, startedAt: null });
          KhatwatiV52.paintStopwatchUI();
        } else {
          const mins = Math.max(1, Number(document.getElementById('v50CustomMinInput')?.value || LS.getItem('khatwati-study-duration-v1')) || 25);
          LS.removeItem('khatwati-study-timer-v1');
          const valEl = document.getElementById('studyTimerValue');
          if (valEl) valEl.textContent = `${String(mins).padStart(2,'0')}:00`;
          const faceEl = document.getElementById('studyTimerFace');
          if (faceEl) faceEl.style.setProperty('--study-progress', '0deg');
          if (toggleBtn) {
            toggleBtn.classList.remove('v46-timer-running');
            toggleBtn.style.setProperty('--v46-fill', '0%');
            toggleBtn.textContent = tx('ابدأ', 'Start');
          }
        }
        window.khatwatiNotice(tx('🔄 تم تصفير المؤقت والبدء من جديد', '🔄 Timer reset'));
      };
      actionsRow.appendChild(resetBtn);
    }

    if (toggleBtn && toggleBtn.dataset.v52Bound !== 'true') {
      toggleBtn.dataset.v52Bound = 'true';
      const origOnclick = toggleBtn.onclick;
      toggleBtn.onclick = null;

      toggleBtn.addEventListener('click', e => {
        const mode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
        if (mode === 'stopwatch') {
          e.stopImmediatePropagation();
          e.preventDefault();
          const st = getSwState();
          if (st.running) {
            st.accMs = getSwElapsedMs(st);
            st.running = false;
            st.startedAt = null;
            setSwState(st);
            clearInterval(swTickTimer);
          } else {
            st.accMs = Number(st.accMs) || 0;
            st.startedAt = Date.now();
            st.running = true;
            setSwState(st);
            startSwTicker();
          }
          KhatwatiV52.paintStopwatchUI();
          return;
        }
        if (typeof origOnclick === 'function') {
          origOnclick.call(toggleBtn, e);
        }
      }, true);
    }

    if (stopBtn && stopBtn.dataset.v52Bound !== 'true') {
      stopBtn.dataset.v52Bound = 'true';
      stopBtn.addEventListener('click', e => {
        const mode = LS.getItem('khatwati-study-timer-mode-v50') || 'countdown';
        if (mode !== 'stopwatch') return;
        e.stopImmediatePropagation();
        e.preventDefault();
        clearInterval(swTickTimer);
        const st = getSwState();
        const elapsedMs = getSwElapsedMs(st);
        const minsLogged = Math.max(1, Math.round(elapsedMs / 60000));
        setSwState({ running: false, accMs: 0, startedAt: null });
        LS.removeItem('khatwati-study-timer-v1');

        const planId = dialog.dataset.planId;
        const plans = safeGet('khatwati-study-v1', []);
        const p = plans.find(x => x.id === planId) || plans[0];
        if (p) {
          p.studyHistory = Array.isArray(p.studyHistory) ? p.studyHistory : [];
          p.studyHistory.push({ date: new Date().toISOString().slice(0, 10), minutes: minsLogged });
          safeSet('khatwati-study-v1', plans);
        }
        overlay.remove();
        if (window.khatwatiCelebrate) window.khatwatiCelebrate();
        window.khatwatiNotice(tx(`🎉 عاشت ايدك! تم تسجيل ${minsLogged} دقيقة دراسة بالمؤقت التصاعدي`, `🎉 Logged ${minsLogged} min of study!`));
      }, true);
    }

    dialog.querySelectorAll('[data-v50-mode]').forEach(btn => {
      if (btn.dataset.v52ModeBound === 'true') return;
      btn.dataset.v52ModeBound = 'true';
      btn.addEventListener('click', () => {
        const m = btn.dataset.v50Mode || 'countdown';
        dialog.dataset.timerMode = m;
        if (m === 'stopwatch') {
          LS.removeItem('khatwati-study-timer-v1');
          KhatwatiV52.paintStopwatchUI();
        } else {
          clearInterval(swTickTimer);
        }
      });
    });

    if ((LS.getItem('khatwati-study-timer-mode-v50') || 'countdown') === 'stopwatch') {
      const st = getSwState();
      if (st.running) startSwTicker();
      KhatwatiV52.paintStopwatchUI();
    }
  }

  function syncOrientationFullscreen() {
    const overlay = document.getElementById('studyTimerOverlay');
    if (!overlay) return;
    const isLandscape = window.innerWidth > window.innerHeight && window.innerHeight < 820;
    const deskBtn = document.getElementById('v51DeskClockBtn');
    if (isLandscape) {
      overlay.classList.add('v51-desk-clock-mode');
      if (deskBtn) {
        deskBtn.classList.add('active');
        deskBtn.innerHTML = `↩ ${tx('الوضع العادي', 'Standard View')}`;
      }
    }
  }
  window.addEventListener('resize', syncOrientationFullscreen);
  window.addEventListener('orientationchange', syncOrientationFullscreen);

  // =========================================================================
  // [3] Upgraded Weekly Study Schedule (#v37TimetableCard) — Auto-Save on Input,
  //     Today Highlight, Completion Checkmarks, and Auto-Fill from Subjects!
  // =========================================================================
  const TT_KEY = 'khatwati-timetable-v1';
  const TT_DONE_KEY = 'khatwati-timetable-done-v52';
  const WEEK_DAYS_V52 = [
    { k: 'sat', dow: 6, ar: 'السبت', en: 'Saturday' },
    { k: 'sun', dow: 0, ar: 'الأحد', en: 'Sunday' },
    { k: 'mon', dow: 1, ar: 'الاثنين', en: 'Monday' },
    { k: 'tue', dow: 2, ar: 'الثلاثاء', en: 'Tuesday' },
    { k: 'wed', dow: 3, ar: 'الأربعاء', en: 'Wednesday' },
    { k: 'thu', dow: 4, ar: 'الخميس', en: 'Thursday' },
    { k: 'fri', dow: 5, ar: 'الجمعة', en: 'Friday' }
  ];

  KhatwatiV52.renderUpgradedTimetable = function(forceRebuild = false) {
    const allCards = document.querySelectorAll('#v37TimetableCard');
    if (allCards.length > 1) {
      for (let i = 1; i < allCards.length; i++) allCards[i].remove();
    }
    const card = document.getElementById('v37TimetableCard');
    if (!card) return;

    if (!forceRebuild && card.dataset.v52Built === 'true' && card.dataset.v52Lang === (isEn() ? 'en' : 'ar')) {
      return;
    }
    card.dataset.v52Built = 'true';
    card.dataset.v52Lang = isEn() ? 'en' : 'ar';

    const schedule = safeGet(TT_KEY, {});
    const doneMap = safeGet(TT_DONE_KEY, {});
    const todayDow = new Date().getDay();

    card.innerHTML = `
      <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px">
        <h3 style="margin:0">📅 ${tx('جدول الدراسة الأسبوعي', 'Weekly Study Schedule')}</h3>
        <span class="v35-tag" id="v52TtSavedBadge">✓ ${tx('حفظ تلقائي فوري', 'Auto-saved')}</span>
      </div>
      <p style="margin:0 0 10px;font-size:12px;color:var(--muted)">
        ${tx('اكتب مواد كل يوم أو وزّع خطط دراستك تلقائياً، وأشّر ✓ عند إتمام مراجعة اليوم:', 'Type subjects for each day or auto-fill from your study plans, and check ✓ when done:')}
      </p>
      <div class="v52-tt-toolbar">
        <button type="button" class="v35-pill active" id="v52AutoFillTtBtn">✨ ${tx('توزيع موادي تلقائياً', 'Auto-Fill My Subjects')}</button>
        <button type="button" class="v35-pill" id="v52SaveTtBtn">💾 ${tx('حفظ الجدول', 'Save Schedule')}</button>
        <button type="button" class="v35-pill" id="v52ClearTtBtn">🗑️ ${tx('تفريغ', 'Clear')}</button>
      </div>
      <div id="v52TtDaysList">
        ${WEEK_DAYS_V52.map(d => {
          const isToday = d.dow === todayDow;
          const isDone = !!doneMap[d.k];
          return `
            <div class="v52-tt-row ${isToday ? 'is-today' : ''} ${isDone ? 'is-done' : ''}" data-tt-row="${d.k}">
              <button type="button" class="v52-tt-check ${isDone ? 'checked' : ''}" data-tt-check="${d.k}" title="${tx('تمت مراجعة هذا اليوم', 'Mark day complete')}">✓</button>
              <div class="v52-tt-day-label">
                <span>${isEn() ? d.en : d.ar}</span>
                ${isToday ? `<small>🌟 ${tx('اليوم', 'Today')}</small>` : ''}
              </div>
              <input type="text" class="v37-tt-input" data-tt-day="${d.k}" value="${escHtml(schedule[d.k] || '')}" placeholder="${tx('مواد أو فصول هذا اليوم...', 'Subjects or chapters for this day...')}">
            </div>
          `;
        }).join('')}
      </div>
    `;

    const badge = document.getElementById('v52TtSavedBadge');
    card.querySelectorAll('[data-tt-day]').forEach(inp => {
      inp.oninput = () => {
        const cur = safeGet(TT_KEY, {});
        cur[inp.dataset.ttDay] = inp.value;
        safeSet(TT_KEY, cur);
        if (badge) badge.textContent = `✓ ${tx('تم الحفظ تلقائياً', 'Saved')}`;
      };
    });

    card.querySelectorAll('[data-tt-check]').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.ttCheck;
        const dm = safeGet(TT_DONE_KEY, {});
        dm[k] = !dm[k];
        safeSet(TT_DONE_KEY, dm);
        btn.classList.toggle('checked', !!dm[k]);
        btn.closest('.v52-tt-row')?.classList.toggle('is-done', !!dm[k]);
      };
    });

    document.getElementById('v52SaveTtBtn').onclick = () => {
      const cur = safeGet(TT_KEY, {});
      card.querySelectorAll('[data-tt-day]').forEach(inp => {
        cur[inp.dataset.ttDay] = inp.value.trim();
      });
      safeSet(TT_KEY, cur);
      window.khatwatiNotice(tx('📅 تم حفظ جدول الدراسة الأسبوعي بنجاح ✓', '📅 Weekly Study Schedule saved ✓'));
    };

    document.getElementById('v52AutoFillTtBtn').onclick = () => {
      const plans = safeGet('khatwati-study-v1', []);
      if (!plans.length) {
        window.khatwatiNotice(tx('أضف خطة دراسة أولاً ليتم توزيعها على أيام الأسبوع 📚', 'Add a study plan first to auto-fill your week 📚'));
        return;
      }
      const cur = safeGet(TT_KEY, {});
      WEEK_DAYS_V52.forEach((d, idx) => {
        if (d.k === 'fri' && plans.length > 1) {
          cur[d.k] = tx('مراجعة شاملة + استراحة', 'Weekly Review & Rest');
        } else {
          const p1 = plans[idx % plans.length];
          const p2 = plans.length > 1 ? plans[(idx + 1) % plans.length] : null;
          cur[d.k] = p2 && p2.id !== p1.id ? `${p1.name} + ${p2.name}` : p1.name;
        }
      });
      safeSet(TT_KEY, cur);
      KhatwatiV52.renderUpgradedTimetable(true);
      window.khatwatiNotice(tx('✨ تم توزيع موادك الدراسية على أيام الأسبوع تلقائياً!', '✨ Subjects distributed across the week!'));
    };

    document.getElementById('v52ClearTtBtn').onclick = () => {
      safeSet(TT_KEY, {});
      safeSet(TT_DONE_KEY, {});
      KhatwatiV52.renderUpgradedTimetable(true);
      window.khatwatiNotice(tx('🗑️ تم تفريغ الجدول الأسبوعي', '🗑️ Weekly schedule cleared'));
    };
  };

  function syncAllV52() {
    KhatwatiV52.applyThemeMode(KhatwatiV52.getThemeMode());
    KhatwatiV52.renderUpgradedTimetable(false);
    wireStudyTimerV52();
    syncOrientationFullscreen();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV52);

  document.addEventListener('click', e => {
    if (e.target?.closest?.('[data-study-session]')) {
      setTimeout(() => {
        if (window.khatwatiRunSyncNow) window.khatwatiRunSyncNow();
        wireStudyTimerV52();
        syncOrientationFullscreen();
      }, 20);
    }
  });

  syncAllV52();
})();
</script>
</body></html>
