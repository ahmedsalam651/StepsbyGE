  function getAyahState() {
    const today = dateStr();
    const s = safeGet(AYAH_STATE_KEY, null);
    if (!s) {
      const initialIdx = new Date().getDate() % DAILY_AYAHS_CURATED.length;
      const initObj = { idx: initialIdx, lastDate: today, readTodayCount: 0, totalRead: 0 };
      safeSet(AYAH_STATE_KEY, initObj);
      return initObj;
    }
    if (s.lastDate !== today) {
      s.idx = ((Number(s.idx) || 0) + 1) % DAILY_AYAHS_CURATED.length;
      s.lastDate = today;
      s.readTodayCount = 0;
      safeSet(AYAH_STATE_KEY, s);
    }
    return s;
  }

  // 1. Render the single Daily Ayah card on the Goals screen (Always Arabic text!)
  function renderDailyAyahBanner() {
    const banner = document.getElementById('v37DailyQuoteBanner');
    if (!banner) return;
    const state = getAyahState();
    const item = DAILY_AYAHS_CURATED[state.idx % DAILY_AYAHS_CURATED.length];

    banner.innerHTML = `
      <div class="v41-ayah-header">
        <span class="v41-ayah-badge">📖 ${tx('آية اليوم', 'Daily Ayah')}${state.readTodayCount > 0 ? ` · ✓ ${state.readTodayCount} ${tx('اليوم', 'today')}` : ''}</span>
        <span class="v41-ayah-surah-tag">${item.ref}</span>
      </div>
      <div class="v41-ayah-arabic-box" id="v37QuoteText" lang="ar" dir="rtl">
        ﴿ ${item.text} ﴾
      </div>
      <div class="v41-ayah-footer">
        <div class="v41-ayah-main-btns">
          <button type="button" class="v41-read-btn" id="v41MarkAyahReadBtn">
            ✓ ${tx('قرأتها (الآية التالية)', 'Read (Next Ayah)')}
          </button>
          <button type="button" class="v41-continue-btn" id="v40OpenQuranBtn">
            📖 ${tx('أكمل السورة', 'Continue Surah')}
          </button>
        </div>
        <div class="v37-quote-actions">
          <button type="button" class="iconbtn" id="v37NextQuoteBtn" title="${tx('آية أخرى', 'Next Ayah')}" aria-label="${tx('آية أخرى', 'Next Ayah')}">🔄</button>
          <button type="button" class="iconbtn" id="v37CopyQuoteBtn" title="${tx('نسخ الآية', 'Copy Ayah')}" aria-label="${tx('نسخ الآية', 'Copy Ayah')}">📋</button>
        </div>
      </div>
    `;

    // Button 1: "قرأتها" -> marks as read & automatically transitions to the next Ayah!
    document.getElementById('v41MarkAyahReadBtn').onclick = () => {
      const box = document.getElementById('v37QuoteText');
      if (box) {
        box.style.opacity = '0.2';
        box.style.transform = 'translateY(-4px)';
      }
      setTimeout(() => {
        const s = getAyahState();
        s.idx = ((Number(s.idx) || 0) + 1) % DAILY_AYAHS_CURATED.length;
        s.readTodayCount = (Number(s.readTodayCount) || 0) + 1;
        s.totalRead = (Number(s.totalRead) || 0) + 1;
        safeSet(AYAH_STATE_KEY, s);
        renderDailyAyahBanner();
        window.khatwatiNotice(tx('تقبّل الله! انتقلنا تلقائياً إلى الآية التالية 🌱', 'Accepted! Automatically moved to the next Ayah 🌱'));
      }, 170);
    };

    // Button 2: "أكمل السورة" -> opens the dedicated full Quran tab directly at this Surah & Ayah!
    document.getElementById('v40OpenQuranBtn').onclick = () => {
      openFullQuranTab(item.surah, item.ayah);
    };

    // Next & Copy buttons
    document.getElementById('v37NextQuoteBtn').onclick = () => {
      const s = getAyahState();
      s.idx = ((Number(s.idx) || 0) + 1) % DAILY_AYAHS_CURATED.length;
      safeSet(AYAH_STATE_KEY, s);
      renderDailyAyahBanner();
    };
    document.getElementById('v37CopyQuoteBtn').onclick = () => {
      window.khatwatiCopyFallback(`﴿ ${item.text} ﴾ [${item.ref}]`, tx('تم نسخ الآية الكريمة 📋', 'Ayah copied 📋'));
    };
  }

  // 2. Create Dedicated Full Quran Tab (#quranSection) & Move #v40QuranCard out of #goalSection into #quranSection!
  function ensureQuranTabExists() {
    const nav = document.querySelector('.view-switch');
    const studyBtn = nav?.querySelector('[data-view="study"]');
    if (nav && !nav.querySelector('[data-view="quran"]')) {
      const btnHtml = `<button class="view-btn" data-view="quran" data-icon="📖" aria-label="${tx('القرآن', 'Quran')}">${tx('القرآن', 'Quran')}</button>`;
      if (studyBtn) studyBtn.insertAdjacentHTML('beforebegin', btnHtml);
      else nav.insertAdjacentHTML('beforeend', btnHtml);
    } else if (nav) {
      const qBtn = nav.querySelector('[data-view="quran"]');
      if (qBtn) {
        qBtn.textContent = tx('القرآن', 'Quran');
        qBtn.dataset.icon = '📖';
        qBtn.setAttribute('aria-label', qBtn.textContent);
      }
    }

    const mainApp = document.querySelector('main.app');
    if (mainApp && !document.getElementById('quranSection')) {
      const booksSec = document.getElementById('booksSection');
      if (booksSec) {
        booksSec.insertAdjacentHTML('afterend', `<section id="quranSection" hidden></section>`);
      }
    }

    const quranSec = document.getElementById('quranSection');
    if (!quranSec) return;

    if (!document.getElementById('v41SurahReaderCard')) {
      quranSec.insertAdjacentHTML('afterbegin', `<div id="v41SurahReaderCard"></div>`);
    }

    // Move #v40QuranCard (Khatma tracker) from #goalSection into #quranSection so #goalSection is 100% clean!
    const khatmaCard = document.getElementById('v40QuranCard');
    if (khatmaCard && khatmaCard.parentElement !== quranSec) {
      quranSec.appendChild(khatmaCard);
    }
  }

  function toArabicDigits(n) {
    return String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
  }

              `).join('')}
            </select>
          </div>
          <span class="v35-tag" dir="rtl" lang="ar">${surahData.type} · ${toArabicDigits(surahData.verses.length)} آيات</span>
        </div>

        <div class="v41-surah-title-banner" lang="ar" dir="rtl">
          <h3>${surahData.name}</h3>
          <span>سورة رقم ${toArabicDigits(surahData.number)} · ${surahData.type}</span>
        </div>

        ${surahData.bismillah ? `<div class="v41-bismillah-line" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : ''}

        <div class="v41-verses-container" lang="ar" dir="rtl">
          ${surahData.verses.map((vText, idx) => {
            const vNum = idx + 1;
            const isHighlighted = vNum === highlightedAyahNum;
            return `
              <div class="v41-verse-row ${isHighlighted ? 'highlighted' : ''}" id="v41AyahRow-${vNum}" data-ayah-num="${vNum}">
                ${isHighlighted ? `<div class="v41-verse-pointer">👈 الآية المقترحة — أكمل التلاوة من هنا</div><br>` : ''}
                <span>${vText}</span>
                <span class="v41-verse-num-badge">﴿${toArabicDigits(vNum)}﴾</span>
              </div>
            `;
          }).join('')}
        </div>

        <div class="v41-surah-nav-footer">
          <button type="button" class="v35-pill" id="v41CompleteSurahBtn">✓ ${tx('أتممت قراءة السورة', 'Completed Surah')}</button>
          <button type="button" class="v35-pill" id="v41NextSurahBtn">${tx('السورة التالية ◀', 'Next Surah ▶')}</button>
        </div>
      </article>
    `;

    document.getElementById('v41BackToGoalsBtn').onclick = () => {
      document.querySelector('.view-btn[data-view="goals"]')?.click();
    };

    document.getElementById('v41SurahSelect').onchange = e => {
      currentSurahNum = Number(e.target.value) || 94;
      highlightedAyahNum = 1;
      renderFullSurahReader();
    };

    container.querySelectorAll('.v41-verse-row').forEach(row => {
      row.onclick = () => {
        highlightedAyahNum = Number(row.dataset.ayahNum) || 1;
        renderFullSurahReader();
      };
    });

    document.getElementById('v41CompleteSurahBtn').onclick = () => {
      if (window.khatwatiCelebrate) window.khatwatiCelebrate();
      window.khatwatiNotice('تقبّل الله طاعتك! أتممت تلاوة ' + surahData.name + ' 🌟');
    };

    document.getElementById('v41NextSurahBtn').onclick = () => {
      const idx = surahListEntries.findIndex(x => x.number === surahData.number);
      const nextObj = surahListEntries[(idx + 1) % surahListEntries.length];
      currentSurahNum = nextObj.number;
      highlightedAyahNum = 1;
      renderFullSurahReader();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    };
  }

  window.openFullQuranTab = function openFullQuranTab(surahNum, ayahNum) {
    ensureQuranTabExists();
    if (surahNum && FULL_SURAHS[surahNum]) {
      currentSurahNum = surahNum;
      highlightedAyahNum = ayahNum || 1;
    }

    document.body.dataset.activeView = 'quran';
    document.querySelectorAll('.view-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.view === 'quran');
    });

    const hero = document.querySelector('.hero');
    const summary = document.querySelector('.summary');
    const tabs = document.querySelector('.tabs');
    if (hero) hero.hidden = true;
    if (summary) summary.hidden = true;
    if (tabs) tabs.hidden = true;

    ['goalSection', 'booksSection', 'weeklySection', 'studySection'].forEach(id => {
      const el = document.getElementById(id);
      if (el) el.hidden = true;
    });

    const quranSec = document.getElementById('quranSection');
    if (quranSec) quranSec.hidden = false;

    renderFullSurahReader();

    setTimeout(() => {
      const targetRow = document.getElementById('v41AyahRow-' + highlightedAyahNum);
      if (targetRow) {
        targetRow.scrollIntoView({ behavior: 'smooth', block: 'center' });
      } else {
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }, 80);
  }

  // Handle view-switch clicks so switching to/from 'quran' tab works seamlessly
  document.addEventListener('click', e => {
    const viewBtn = e.target.closest('.view-btn');
    if (!viewBtn) return;
    if (viewBtn.dataset.view === 'quran') {
      e.preventDefault();
      e.stopPropagation();
      const s = getAyahState();
      const curItem = DAILY_AYAHS_CURATED[s.idx % DAILY_AYAHS_CURATED.length];
      openFullQuranTab(currentSurahNum || curItem.surah, highlightedAyahNum || curItem.ayah);
    } else {
      const quranSec = document.getElementById('quranSection');
      if (quranSec) quranSec.hidden = true;
    }
  }, true);

  function syncAllV41() {
    ensureQuranTabExists();
    renderDailyAyahBanner();
    if (document.body.dataset.activeView === 'quran') {
      renderFullSurahReader();
    }
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(() => {
    ensureQuranTabExists();
    if (!document.getElementById('v41MarkAyahReadBtn')) {
      renderDailyAyahBanner();
    }
  });

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        syncAllV41();
      }, 210);
    }
  });

  syncAllV41();
})();
</script>

        'قُلْ يَا أَيُّهَا الْكَافِرُونَ',
        'لَا أَعْبُدُ مَا تَعْبُدُونَ',
        'وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ',
        'وَلَا أَنَا عَابِدٌ مَّا عَبَدتُّم',
        'وَلَا أَنتُمْ عَابِدُونَ مَا أَعْبُدُ',
        'لَكُمْ دِينُكُمْ وَلِيَ دِينِ'
      ]
    }
  };
  if (window.KhatwatiFullSurahs) {
    Object.entries(EXTRA_SURAHS_V42).forEach(([k, v]) => {
      if (Number(k) !== 109) v.isPartial = true;
      window.KhatwatiFullSurahs[k] = v;
    });
  }

  // 1. Ensure Quran icon in .view-switch is ALWAYS '🕌' and Weekly label fits cleanly
  function fixNavButtons() {
    const qBtn = document.querySelector('.view-switch .view-btn[data-view="quran"]');
    if (qBtn) {
      qBtn.dataset.icon = '🕌';
      qBtn.textContent = tx('القرآن', 'Quran');
      qBtn.setAttribute('aria-label', qBtn.textContent);
    }
    const wBtn = document.querySelector('.view-switch .view-btn[data-view="weekly"]');
    if (wBtn) {
      wBtn.dataset.icon = '📊';
      wBtn.textContent = tx('الملخص', 'Summary');
      wBtn.setAttribute('aria-label', wBtn.textContent);
    }
  }

  // 2. Add "هدف ليوم واحد فقط" (One-day goal) & "ربط تلقائي مع القراءة/الدراسة/القرآن" inside #goalForm
  function injectV42GoalFormOptions() {
    const form = document.getElementById('goalForm');
    if (!form || document.getElementById('v42GoalExtraOptions')) return;

    const metaRow = document.getElementById('v35GoalMetaRow') || form.querySelector('.row');
    if (!metaRow) return;

    metaRow.insertAdjacentHTML('afterend', `
      <div class="row" id="v42GoalExtraOptions" style="margin-top:4px">
        <div>
          <label for="v42GoalScope" id="v42GoalScopeLabel">${tx('نوع استمرار الهدف', 'Goal Duration')}</label>
          <select class="field" id="v42GoalScope">
            <option value="recurring">${tx('🔄 مستمر (يتجدد تلقائياً)', '🔄 Recurring')}</option>
            <option value="once_today">${tx('📌 ليوم واحد فقط (اليوم)', '📌 Today only (One-time)')}</option>
            <option value="once_tomorrow">${tx('⏭️ ليوم واحد فقط (باجر)', '⏭️ Tomorrow only (One-time)')}</option>
          </select>
        </div>
        <div>
          <label for="v42GoalLink" id="v42GoalLinkLabel">${tx('ربط تلقائي مع الأقسام', 'Auto-sync with')}</label>
          <select class="field" id="v42GoalLink">
            <option value="none">${tx('بدون ربط تلقائي', 'No auto-sync')}</option>
            <option value="reading">${tx('📚 تقدم القراءة (الصفحات)', '📚 Reading progress')}</option>
            <option value="study">${tx('✍️ الدراسة (الوحدات/الجلسات)', '✍️ Study progress')}</option>
            <option value="quran">${tx('📖 القرآن (الآيات/السور)', '📖 Quran recitation')}</option>
          </select>
        </div>
      </div>
    `);
  }

  function updateV42FormLabels() {
    const sLbl = document.getElementById('v42GoalScopeLabel');
    const lLbl = document.getElementById('v42GoalLinkLabel');
    const sSel = document.getElementById('v42GoalScope');
    const lSel = document.getElementById('v42GoalLink');
    if (sLbl) sLbl.textContent = tx('نوع استمرار الهدف', 'Goal Duration');
    if (lLbl) lLbl.textContent = tx('ربط تلقائي مع الأقسام', 'Auto-sync with');
    if (sSel && sSel.options.length === 3) {
      sSel.options[0].textContent = tx('🔄 مستمر (يتجدد تلقائياً)', '🔄 Recurring');
      sSel.options[1].textContent = tx('📌 ليوم واحد فقط (اليوم)', '📌 Today only (One-time)');
      sSel.options[2].textContent = tx('⏭️ ليوم واحد فقط (باجر)', '⏭️ Tomorrow only (One-time)');
    }
    if (lSel && lSel.options.length === 4) {
      lSel.options[0].textContent = tx('بدون ربط تلقائي', 'No auto-sync');
      lSel.options[1].textContent = tx('📚 تقدم القراءة (الصفحات)', '📚 Reading progress');
      lSel.options[2].textContent = tx('✍️ الدراسة (الوحدات/الجلسات)', '✍️ Study progress');
      lSel.options[3].textContent = tx('📖 القرآن (الآيات/السور)', '📖 Quran recitation');
    }
  }

  // Hook window.openForm to populate v42 fields
  const prevOpenFormV42 = window.openForm;
  if (typeof prevOpenFormV42 === 'function') {
    window.openForm = function(g = null) {
      injectV42GoalFormOptions();
      updateV42FormLabels();
      prevOpenFormV42(g);
      const meta = safeGet(META_KEY, {});
      const id = g?.id || '';
      const m = meta[id] || {};
      const scopeSel = document.getElementById('v42GoalScope');
      const linkSel = document.getElementById('v42GoalLink');
      if (scopeSel) {
        if (m.onceDate === tomorrowStr()) scopeSel.value = 'once_tomorrow';
        else if (m.onceDate) scopeSel.value = 'once_today';
        else scopeSel.value = 'recurring';
      }
      if (linkSel) {
        linkSel.value = m.linkedTo || 'none';
      }
    };
  }

  // Save v42 fields on goalForm submit
  const goalForm = document.getElementById('goalForm');
  if (goalForm) {
    goalForm.addEventListener('submit', () => {
      const scopeVal = document.getElementById('v42GoalScope')?.value || 'recurring';
      const linkVal = document.getElementById('v42GoalLink')?.value || 'none';
      setTimeout(() => {
        try {
          const allGoals = safeGet('khatwati-goals-v1', []);
          const idInput = document.getElementById('goalId')?.value;
          const targetGoal = idInput ? allGoals.find(x => x.id === idInput) : allGoals[allGoals.length - 1];
          if (targetGoal) {
            const meta = safeGet(META_KEY, {});
            const curMeta = meta[targetGoal.id] || { category: 'habit', priority: 'normal' };
            if (scopeVal === 'once_today') curMeta.onceDate = dateStr();
            else if (scopeVal === 'once_tomorrow') curMeta.onceDate = tomorrowStr();
            else delete curMeta.onceDate;
            curMeta.linkedTo = linkVal;
            meta[targetGoal.id] = curMeta;
            safeSet(META_KEY, meta);
            enhanceAndSortGoalsV42();
          }
        } catch {}
      }, 45);
    });
  }

  // 3. Move / Postpone Goal to Tomorrow ("نقل الهدف لليوم التالي") & Auto-Sorting Goals
  window.v42PostponeGoalToTomorrow = function(goalId) {
    const meta = safeGet(META_KEY, {});
    const m = meta[goalId] || { category: 'habit', priority: 'normal' };
    const tmrw = tomorrowStr();
    m.postponedTo = tmrw;
    if (m.onceDate) m.onceDate = tmrw;
    meta[goalId] = m;
    safeSet(META_KEY, meta);
    enhanceAndSortGoalsV42();
    window.khatwatiNotice(tx('⏭️ تم ترحيل الهدف إلى باجر (اليوم التالي)', '⏭️ Goal moved to tomorrow'));
  };

  window.v42TogglePinGoal = function(goalId) {
    const meta = safeGet(META_KEY, {});
    const m = meta[goalId] || { category: 'habit', priority: 'normal' };
    m.pinned = !m.pinned;
    meta[goalId] = m;
    safeSet(META_KEY, meta);
    enhanceAndSortGoalsV42();
    window.khatwatiNotice(m.pinned ? tx('📌 تم تثبيت الهدف بأعلى القائمة', '📌 Goal pinned to top') : tx('تم إلغاء تثبيت الهدف', 'Goal unpinned'));
  };

  function installCarryOverBanner() {
    const goalSection = document.getElementById('goalSection');
    const goalList = document.getElementById('goalList');
    if (!goalSection || !goalList) return;

    const allGoals = safeGet('khatwati-goals-v1', []);
    const meta = safeGet(META_KEY, {});
    const today = dateStr();
    const yest = yesterdayStr();

    const unfinishedOneTimeFromYesterday = allGoals.filter(g => {
      const m = meta[g.id];
      return m?.onceDate && m.onceDate <= yest && (g.records?.[m.onceDate] || 0) < g.target;
    });

    const remainingToday = allGoals.filter(g => {
      if (g.period !== 'daily') return false;
      const m = meta[g.id] || {};
      if (m.postponedTo && m.postponedTo > today) return false;
      if (m.onceDate && m.onceDate !== today) return false;
      return (g.records?.[today] || 0) < g.target;
    });

    let bar = document.getElementById('v42CarryOverBar');
    if (!remainingToday.length && !unfinishedOneTimeFromYesterday.length) {
      bar?.remove();
      return;
    }
    if (!bar) {
      goalList.insertAdjacentHTML('beforebegin', `<div class="v42-carry-bar" id="v42CarryOverBar"></div>`);
      bar = document.getElementById('v42CarryOverBar');
    }
    bar.innerHTML = `
      <span>⚡ ${tx(`عندك ${remainingToday.length} أهداف متبقية اليوم — المرتبة بالأعلى هي غير المكتملة`, `${remainingToday.length} goals remaining today — incomplete shown first`)}</span>
      <div style="display:flex;gap:6px">
        ${unfinishedOneTimeFromYesterday.length ? `<button type="button" class="v35-pill active" id="v42BringYesterdayBtn">🔄 ${tx('نقل أهداف أمس غير المكتملة لليوم', 'Bring yesterday’s unfinished goals')}</button>` : ''}
        <button type="button" class="v35-pill" id="v42PostponeAllRemainingBtn">⏭️ ${tx('ترحيل المتبقي لباجر', 'Move remaining to tomorrow')}</button>
      </div>
    `;
    const bringBtn = document.getElementById('v42BringYesterdayBtn');
    if (bringBtn) {
      bringBtn.onclick = () => {
        const mStore = safeGet(META_KEY, {});
        unfinishedOneTimeFromYesterday.forEach(g => {
          if (mStore[g.id]) mStore[g.id].onceDate = today;
        });
        safeSet(META_KEY, mStore);
        enhanceAndSortGoalsV42();
        window.khatwatiNotice(tx('تم نقل أهداف أمس غير المكتملة إلى اليوم ✨', 'Moved yesterday’s unfinished goals to today ✨'));
      };
    }
    const postBtn = document.getElementById('v42PostponeAllRemainingBtn');
    if (postBtn) {
      postBtn.onclick = () => {
        const mStore = safeGet(META_KEY, {});
        const tmrw = tomorrowStr();
        remainingToday.forEach(g => {
          mStore[g.id] = mStore[g.id] || {};
          mStore[g.id].postponedTo = tmrw;
          if (mStore[g.id].onceDate === today) mStore[g.id].onceDate = tmrw;
        });
        safeSet(META_KEY, mStore);
        enhanceAndSortGoalsV42();
        window.khatwatiNotice(tx('⏭️ تم ترحيل الأهداف المتبقية إلى باجر', '⏭️ Remaining goals moved to tomorrow'));
      };
    }
  }

  function enhanceAndSortGoalsV42() {
    const goalList = document.getElementById('goalList');
    if (!goalList) return;
    const meta = safeGet(META_KEY, {});
    const today = dateStr();
    const tmrw = tomorrowStr();

    const cards = Array.from(goalList.querySelectorAll('.goal'));
    if (!cards.length) return;

    cards.forEach(card => {
      const id = card.dataset.goalId || card.querySelector('.goal-actions button[onclick*="editGoal"]')?.getAttribute('onclick')?.match(/editGoal\('([^']+)'\)/)?.[1];
      if (!id) return;
      card.dataset.goalId = id;
      const m = meta[id] || {};
      const isDone = card.classList.contains('done');
      const isPostponed = m.postponedTo === tmrw || m.onceDate === tmrw;
      const isExpiredOnce = m.onceDate && m.onceDate < today && isDone;

      if (isExpiredOnce) {
        card.style.display = 'none';
        return;
      }

      card.classList.toggle('v42-pinned', !!m.pinned);
      card.classList.toggle('v42-postponed', isPostponed && !isDone);

      // Add Badges for One-Time, Auto-Linked, and Postponed
      const badgeBox = card.querySelector('.v35-goal-badges');
      if (badgeBox) {
        badgeBox.querySelectorAll('.v42-extra-badge').forEach(b => b.remove());
        if (m.pinned) {
          badgeBox.insertAdjacentHTML('afterbegin', `<span class="v35-tag v42-extra-badge">📌 ${tx('مثبت', 'Pinned')}</span>`);
        }
        if (m.onceDate) {
          const isTmrw = m.onceDate === tmrw;
          badgeBox.insertAdjacentHTML('beforeend', `<span class="v35-tag once-tag v42-extra-badge">📌 ${isTmrw ? tx('ليوم واحد (باجر)', 'One-time (Tomorrow)') : tx('ليوم واحد فقط', 'Today only')}</span>`);
        }
        if (m.linkedTo && m.linkedTo !== 'none') {
          const linkLabels = {
            reading: tx('🔗 مرتبط بالقراءة', '🔗 Linked to Reading'),
            study: tx('🔗 مرتبط بالدراسة', '🔗 Linked to Study'),
            quran: tx('🔗 مرتبط بالقرآن', '🔗 Linked to Quran')
          };
          badgeBox.insertAdjacentHTML('beforeend', `<span class="v35-tag linked-tag v42-extra-badge">${linkLabels[m.linkedTo] || ''}</span>`);
        }
        if (isPostponed && !isDone) {
          badgeBox.insertAdjacentHTML('beforeend', `<span class="v35-tag postponed-tag v42-extra-badge">⏭️ ${tx('مؤجل لباجر', 'Moved to tomorrow')}</span>`);
        }
      }

      // Add Pin & Move-to-Tomorrow buttons in .goal-actions
      const actions = card.querySelector('.goal-actions');
      if (actions) {
        if (!actions.querySelector('.v42-pin-btn')) {
          const pinBtn = document.createElement('button');
          pinBtn.type = 'button';
          pinBtn.className = 'iconbtn v42-pin-btn';
          pinBtn.title = tx('تثبيت بالأعلى', 'Pin to top');
          pinBtn.setAttribute('aria-label', pinBtn.title);
          pinBtn.textContent = '📌';
          pinBtn.onclick = () => window.v42TogglePinGoal(id);
          actions.prepend(pinBtn);
        }
        let nextDayBtn = actions.querySelector('.v42-nextday-btn');
        if (!isDone && !isPostponed) {
          if (!nextDayBtn) {
            nextDayBtn = document.createElement('button');
            nextDayBtn.type = 'button';
            nextDayBtn.className = 'iconbtn v42-nextday-btn';
            nextDayBtn.title = tx('نقل لليوم التالي (باجر)', 'Move to tomorrow');
            nextDayBtn.setAttribute('aria-label', nextDayBtn.title);
            nextDayBtn.textContent = '⏭️';
            nextDayBtn.onclick = () => window.v42PostponeGoalToTomorrow(id);
            actions.prepend(nextDayBtn);
          }
        } else if (nextDayBtn) {
          nextDayBtn.remove();
        }
      }
    });

    // Sort cards inside #goalList:
    // 1. Incomplete & scheduled today (Pinned -> High Priority -> Medium -> Normal)
    // 2. Postponed to tomorrow / Rest day today
    // 3. Completed goals ('done') at the bottom
    const prioWeight = { high: 3, med: 2, normal: 1 };
    const sorted = [...cards].sort((a, b) => {
      const idA = a.dataset.goalId, idB = b.dataset.goalId;
      const mA = meta[idA] || {}, mB = meta[idB] || {};
      const doneA = a.classList.contains('done') ? 1 : 0;
      const doneB = b.classList.contains('done') ? 1 : 0;
      if (doneA !== doneB) return doneA - doneB;

      const postA = (a.classList.contains('v42-postponed') || a.classList.contains('v39-rest-day')) ? 1 : 0;
      const postB = (b.classList.contains('v42-postponed') || b.classList.contains('v39-rest-day')) ? 1 : 0;
      if (postA !== postB) return postA - postB;

      const pinA = mA.pinned ? 1 : 0;
      const pinB = mB.pinned ? 1 : 0;
      if (pinA !== pinB) return pinB - pinA;

      const pA = prioWeight[mA.priority || 'normal'] || 1;
      const pB = prioWeight[mB.priority || 'normal'] || 1;
      return pB - pA;
    });

    const currentOrder = Array.from(goalList.querySelectorAll('.goal'));
    const orderChanged = sorted.some((c, idx) => c !== currentOrder[idx]);
    if (orderChanged) {
      sorted.forEach(c => goalList.appendChild(c));
    }
    installCarryOverBanner();
  }

  // 4. Smart Auto-Sync between Reading, Study, Quran & Daily Goals
  window.v42TriggerLinkedGoals = function(sourceType, amount = 1) {
    if (amount <= 0) return;
    const allGoals = safeGet('khatwati-goals-v1', []);
    const meta = safeGet(META_KEY, {});
    const today = dateStr();
    let syncedNames = [];

    const patterns = {
      reading: /قراء|قريت|كتاب|صفح|فصل|read|book|page|chapter/i,
      study: /دراس|مذاكر|مراجع|امتحان|محاضر|درس|فصل|study|exam|lesson|review/i,
      quran: /قرآن|قران|آية|ايه|سورة|ورد|ختم|تلاو|quran|ayah|surah|wird/i
    };

    allGoals.forEach(g => {
      if (g.period !== 'daily') return;
      const m = meta[g.id] || {};
      const isExplicitlyLinked = m.linkedTo === sourceType;
      const isKeywordMatched = (!m.linkedTo || m.linkedTo === 'none') && (
        (sourceType === 'study' && m.category === 'study') ||
        (patterns[sourceType] && patterns[sourceType].test(g.name))
      );

      if (isExplicitlyLinked || isKeywordMatched) {
        g.records = g.records || {};
        const before = g.records[today] || 0;
        if (before < g.target) {
          g.records[today] = Math.min(g.target, before + amount);
          syncedNames.push(g.name);
        }
      }
    });

    if (syncedNames.length > 0) {
      safeSet('khatwati-goals-v1', allGoals);
      try {
        if (typeof goals !== 'undefined' && Array.isArray(goals)) {
          allGoals.forEach(updated => {
            const target = goals.find(x => x.id === updated.id);
            if (target) target.records = updated.records;
          });
        }
        if (typeof render === 'function') render();
      } catch {}
      setTimeout(() => {
        window.khatwatiNotice(tx(`🔗 تم تحديث هدفك المرتبط تلقائياً: ${syncedNames.join('، ')}`, `🔗 Auto-updated linked goal: ${syncedNames.join(', ')}`));
      }, 350);
    }
  };

  // Hook Reading (window.bookStep) to auto-sync with Reading/Study goals!
  const origBookStepV42 = window.bookStep;
  if (typeof origBookStepV42 === 'function') {
    window.bookStep = function(id, delta) {
      origBookStepV42(id, delta);
      if (delta > 0) {
        window.v42TriggerLinkedGoals('reading', delta);
      }
    };
  }

  // Hook Study steps & Quran actions to auto-sync with linked goals!
  document.addEventListener('click', e => {
    const studyStepBtn = e.target.closest('[data-study-step]');
    if (studyStepBtn && Number(studyStepBtn.dataset.studyStep) > 0) {
      setTimeout(() => window.v42TriggerLinkedGoals('study', Number(studyStepBtn.dataset.studyStep)), 120);
    }
    if (e.target.id === 'v41MarkAyahReadBtn' || e.target.id === 'v41CompleteSurahBtn' || e.target.id === 'v40PagePlus1' || e.target.id === 'v40PagePlusWird') {
      setTimeout(() => window.v42TriggerLinkedGoals('quran', 1), 120);
    }
  });

  // 5. Instant Arabic Verse & Surah Search inside Quran Tab
  function normalizeArabic(str) {
    return String(str || '')
      .replace(/[\u064B-\u065F\u0670\u06D6-\u06ED]/g, '')
      .replace(/[أإآٱ]/g, 'ا')
      .replace(/ة/g, 'ه')
      .replace(/ى/g, 'ي')
      .trim();
  }

  function installQuranSearchInTab() {
    const readerCard = document.querySelector('#v41SurahReaderCard .v41-quran-reader-card');
    if (!readerCard || document.getElementById('v42QuranSearchWrap')) return;

    const toolbar = readerCard.querySelector('.v41-reader-toolbar');
    if (!toolbar) return;

    toolbar.insertAdjacentHTML('beforebegin', `
      <div id="v42QuranSearchWrap">
        <div class="v42-quran-search-box">
          <input type="search" id="v42QuranSearchInput" class="v42-quran-search-input" placeholder="🔍 ابحث عن آية أو كلمة أو اسم سورة في المصحف..." aria-label="ابحث في المصحف">
        </div>
        <div id="v42QuranSearchResults" class="v42-search-results" style="display:none"></div>
      </div>
    `);

    const input = document.getElementById('v42QuranSearchInput');
    const resultsBox = document.getElementById('v42QuranSearchResults');

    input.addEventListener('input', () => {
      const q = normalizeArabic(input.value);
      if (!q || q.length < 2) {
        resultsBox.style.display = 'none';
        resultsBox.innerHTML = '';
        return;
      }

      const matches = [];
      const surahDict = window.KhatwatiFullSurahs || {};
      Object.values(surahDict).forEach(s => {
        (s.verses || []).forEach((vText, idx) => {
          if (normalizeArabic(s.name).includes(q) || normalizeArabic(vText).includes(q)) {
            matches.push({ surahNum: s.number, surahName: s.name, ayah: idx + 1, text: vText });
          }
        });
      });

      resultsBox.style.display = 'grid';
      if (!matches.length) {
        resultsBox.innerHTML = `<div style="font-size:13px;color:var(--muted);text-align:center;padding:8px">لم يتم العثور على آية مطابقة لـ «${input.value}»</div>`;
        return;
      }

      resultsBox.innerHTML = matches.slice(0, 18).map((m, i) => `
        <div class="v42-search-item" data-match-idx="${i}">
          <strong>📖 ${m.surahName} · الآية ${m.ayah}</strong>
          <p lang="ar" dir="rtl">﴿ ${m.text} ﴾</p>
        </div>
      `).join('');

      resultsBox.querySelectorAll('.v42-search-item').forEach(itemEl => {
        itemEl.onclick = () => {
          const m = matches[Number(itemEl.dataset.matchIdx)];
          if (!m) return;
          resultsBox.style.display = 'none';
          input.value = '';
          if (typeof window.openFullQuranTab === 'function') {
            window.openFullQuranTab(m.surahNum, m.ayah);
          }
        };
      });
    });
  }

  function syncAllV42() {
    fixNavButtons();
    injectV42GoalFormOptions();
    updateV42FormLabels();
    enhanceAndSortGoalsV42();
    installQuranSearchInTab();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV42);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v42CarryOverBar')?.remove();
        syncAllV42();
      }, 220);
    }
  });

  syncAllV42();
})();
</script>
<style id="v43-upgrade-styles">
/* Khatwati v43:
   1) Easy 114-Surah Loader & Offline Cache

  if (window.KhatwatiFullSurahs) {

  async function fetchAndCacheSurah(surahNum) {
    if (window.KhatwatiFullSurahs && window.KhatwatiFullSurahs[surahNum]?.verses?.length > 0 && !window.KhatwatiFullSurahs[surahNum].isPartial) {
      return window.KhatwatiFullSurahs[surahNum];
    }
    const meta = ALL_114_NAMES.find(x => x[0] === surahNum) || [surahNum, 'سورة ' + surahNum, 'مكية'];
    try {
      const res = await fetch(`https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/${surahNum}.json`);
      if (res.ok) {
        const data = await res.json();
        const verses = (data.verses || []).map(v => v.text);
        if (verses.length) {
          const obj = { number: surahNum, name: 'سورة ' + (data.name || meta[1]), type: meta[2], bismillah: surahNum !== 1 && surahNum !== 9, verses };
          window.KhatwatiFullSurahs[surahNum] = obj;
          const cache = safeGet(SURAH_CACHE_KEY, {});
          cache[surahNum] = obj;
          safeSet(SURAH_CACHE_KEY, cache);
          return obj;
        }
      }
    } catch {}
    try {
      const res2 = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
      if (res2.ok) {
        const data2 = await res2.json();
        const verses = (data2?.data?.ayahs || []).map(a => a.text);
        if (verses.length) {
          const obj = { number: surahNum, name: data2.data.name || ('سورة ' + meta[1]), type: meta[2], bismillah: surahNum !== 1 && surahNum !== 9, verses };
          window.KhatwatiFullSurahs[surahNum] = obj;
          const cache = safeGet(SURAH_CACHE_KEY, {});
          cache[surahNum] = obj;
          safeSet(SURAH_CACHE_KEY, cache);
          return obj;
        }
      }
    } catch {}
    return window.KhatwatiFullSurahs?.[surahNum] || null;
  }

  function upgradeSurahSelectorToAll114() {
    const sel = document.getElementById('v41SurahSelect');
    if (!sel || sel.dataset.v43All114 === 'true') return;
    sel.dataset.v43All114 = 'true';
    const currentVal = Number(sel.value) || 94;
    const toAr = n => String(n).replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);

    sel.innerHTML = ALL_114_NAMES.map(([num, name, type]) => {
      const isReady = !!(window.KhatwatiFullSurahs && window.KhatwatiFullSurahs[num]);
      return `<option value="${num}" ${num === currentVal ? 'selected' : ''}>${toAr(num)}. سورة ${name} (${type})${isReady ? ' ✓' : ''}</option>`;
    }).join('');

    sel.onchange = async e => {
      const num = Number(e.target.value) || 94;
      if (!window.KhatwatiFullSurahs?.[num]) {
        window.khatwatiNotice('⏳ جاري تحميل سورة ' + (ALL_114_NAMES.find(x => x[0] === num)?.[1] || '') + ' وحفظها بجهازك...');
        await fetchAndCacheSurah(num);
      }
      if (typeof window.openFullQuranTab === 'function') {
        window.openFullQuranTab(num, 1);
      }
    };
  }

  // 2 & 3. Touch Swipe Actions on Goals + Direct Number Input for Large Goals
  // =========================================================================
  function enhanceGoalsWithSwipeAndDirectInput() {
    const allGoals = safeGet('khatwati-goals-v1', []);

    document.querySelectorAll('#goalList .goal').forEach(card => {
      const id = card.dataset.goalId || card.querySelector('.goal-actions button[onclick*="editGoal"]')?.getAttribute('onclick')?.match(/editGoal\('([^']+)'\)/)?.[1];
      if (!id) return;
      const g = allGoals.find(x => x.id === id);
      if (!g) return;

      // Direct Number Input & Quick +5/+10 Chips for goals with target > 1
      const countEl = card.querySelector('.count');
      const progWrap = card.querySelector('.goal-progress');
      if (countEl && g.target > 1 && !countEl.classList.contains('v43-clickable-count')) {
        countEl.classList.add('v43-clickable-count');
        countEl.title = tx('اضغط لإدخال الرقم مباشرة', 'Tap to enter exact count');
        countEl.innerHTML = `<span>${countEl.textContent}</span> <small>✎</small>`;
        countEl.onclick = e => {
          e.stopPropagation();
          const curVal = (typeof count === 'function') ? count(g) : 0;
          window.khatwatiPrompt(
            tx(`إدخال مباشر لهدف «${g.name}» (من ${g.target}):`, `Enter current progress for "${g.name}" (out of ${g.target}):`),
            String(curVal),
            val => {
              const num = Math.max(0, Math.min(g.target, parseInt(val, 10)));
              if (Number.isNaN(num)) return;
              const delta = num - curVal;
              if (delta !== 0 && typeof window.step === 'function') {
                window.v43PushUndoSnapshot('تحديث تقدم الهدف', 'Goal progress updated');
                window.step(id, delta);
                window.khatwatiToastWithUndo(tx(`تم تحديث التقدم إلى ${num} / ${g.target} ✓`, `Updated to ${num} / ${g.target} ✓`));
              }
            }
          );
        };
      }

      if (progWrap && g.target >= 5 && !progWrap.querySelector('.v43-quick-steps')) {
        const qDiv = document.createElement('div');
        qDiv.className = 'v43-quick-steps';
        const step1 = g.target >= 20 ? 5 : 2;
        const step2 = g.target >= 20 ? 10 : 5;
        qDiv.innerHTML = `
          <button type="button" class="v43-qstep-btn" data-qstep="${step1}">+${step1}</button>
          ${g.target >= 10 ? `<button type="button" class="v43-qstep-btn" data-qstep="${step2}">+${step2}</button>` : ''}
        `;
        qDiv.querySelectorAll('[data-qstep]').forEach(btn => {
          btn.onclick = e => {
            e.stopPropagation();
            const d = Number(btn.dataset.qstep);
            if (typeof window.step === 'function') {
              window.v43PushUndoSnapshot('زيادة سريعة للهدف', 'Quick step');
              window.step(id, d);
              window.khatwatiToastWithUndo(tx(`تمت إضافة +${d} للهدف ⚡`, `Added +${d} to goal ⚡`));
            }
          };
        });
        progWrap.appendChild(qDiv);
      }

      // Add Archive button on Goal actions
      const actions = card.querySelector('.goal-actions');
      if (actions && !actions.querySelector('.v43-archive-goal-btn')) {
        const archBtn = document.createElement('button');
        archBtn.type = 'button';
        archBtn.className = 'iconbtn v43-archive-goal-btn';
        archBtn.title = tx('نقل للأرشيف', 'Archive goal');
        archBtn.setAttribute('aria-label', archBtn.title);
        archBtn.textContent = '📦';
        archBtn.onclick = () => window.v43ArchiveItem('goal', id);
        actions.appendChild(archBtn);
      }

      // Touch Swipe Gestures on Goal Card (Right swipe = +1 Done, Left swipe = Postpone to tomorrow)
      if (!card.dataset.v43SwipeReady) {
        card.dataset.v43SwipeReady = 'true';
        const badge = document.createElement('span');
        badge.className = 'v43-swipe-hint-badge';
        card.appendChild(badge);

        let startX = 0, startY = 0, currentDX = 0, touching = false;
        card.addEventListener('touchstart', e => {
          const tgt = e.target && e.target.nodeType === 1 ? e.target : e.target?.parentElement;
          if (!tgt || tgt.closest('button, .goal-actions, .check, .count, .v37-subtasks-box, input, select, a')) return;
          const t = e.touches[0];
          startX = t.clientX;
          startY = t.clientY;
          currentDX = 0;
          touching = true;
        }, { passive: true });

        card.addEventListener('touchmove', e => {
          if (!touching) return;
          const t = e.touches[0];
          const dx = t.clientX - startX;
          const dy = t.clientY - startY;
          if (Math.abs(dy) > Math.abs(dx)) return;
          currentDX = dx;
          if (Math.abs(dx) > 18) {
            const clamped = Math.max(-75, Math.min(75, dx));
            card.style.transform = `translateX(${clamped}px)`;
            if (dx > 35) {
              card.classList.add('swiping-done');
              card.classList.remove('swiping-postpone');
              badge.textContent = tx('✓ +1 إنجاز', '✓ +1 Done');
            } else if (dx < -35) {
              card.classList.add('swiping-postpone');
              card.classList.remove('swiping-done');
              badge.textContent = tx('⏭️ تأجيل لباجر', '⏭️ Tomorrow');
            } else {
              card.classList.remove('swiping-done', 'swiping-postpone');
            }
          }
        }, { passive: true });

        const endSwipe = () => {
          if (!touching) return;
          touching = false;
          card.style.transform = '';
          card.classList.remove('swiping-done', 'swiping-postpone');
          if (currentDX > 58) {
            window.v43PushUndoSnapshot('تسجيل خطوة بالسحب', 'Swipe step');
            if (typeof window.step === 'function') window.step(id, 1);
            window.khatwatiToastWithUndo(tx('✓ تم تسجيل التقدم بالسحب', '✓ Progress logged via swipe'));
          } else if (currentDX < -58) {
            if (typeof window.v42PostponeGoalToTomorrow === 'function') {
              window.v42PostponeGoalToTomorrow(id);
            }
          }
          currentDX = 0;
        };
        card.addEventListener('touchend', endSwipe);
        card.addEventListener('touchcancel', endSwipe);
      }
    });
  }

  // 5. Archive System for Completed Goals, Books & Study Plans (📦 الأرشيف)

  const ARCHIVE_KEY = 'khatwati-archive-v1';

  window.v43ArchiveItem = function(type, id) {
    window.v43PushUndoSnapshot('أرشفة عنصر', 'Archived item');
    const arch = safeGet(ARCHIVE_KEY, { goals: [], books: [], study: [] });
    if (type === 'goal') {
      const list = safeGet('khatwati-goals-v1', []);
      const item = list.find(x => x.id === id);
      if (!item) return;
      arch.goals = [item, ...(arch.goals || [])];
      const next = list.filter(x => x.id !== id);
      safeSet('khatwati-goals-v1', next);
      try { if (typeof goals !== 'undefined') goals = next; if (typeof render === 'function') render(); } catch {}
    } else if (type === 'book') {
      const list = safeGet('khatwati-books-v1', []);
      const item = list.find(x => x.id === id);
      if (!item) return;
      arch.books = [item, ...(arch.books || [])];
      const next = list.filter(x => x.id !== id);
      safeSet('khatwati-books-v1', next);
      try { if (typeof books !== 'undefined') books = next; if (typeof drawBooks === 'function') drawBooks(); } catch {}
    } else if (type === 'study') {
      const list = safeGet('khatwati-study-v1', []);
      const item = list.find(x => x.id === id);
      if (!item) return;
      arch.study = [item, ...(arch.study || [])];
      const next = list.filter(x => x.id !== id);
      safeSet('khatwati-study-v1', next);
      location.reload();
      return;
    }
    safeSet(ARCHIVE_KEY, arch);
    renderArchiveDrawers();
    window.khatwatiToastWithUndo(tx('📦 تم النقل إلى قائمة الأرشيف', '📦 Moved to Archive'));
  };

  window.v43RestoreArchived = function(type, id) {
    const arch = safeGet(ARCHIVE_KEY, { goals: [], books: [], study: [] });
    if (type === 'goal') {
      const item = (arch.goals || []).find(x => x.id === id);
      if (!item) return;
      arch.goals = arch.goals.filter(x => x.id !== id);

    } else if (type === 'book') {

      if (!item) return;
      arch.books = arch.books.filter(x => x.id !== id);
      const list = safeGet('khatwati-books-v1', []);

        b.className = 'iconbtn v43-arch-book';
        b.title = tx('نقل للأرشيف', 'Archive book');
        b.textContent = '📦';
        b.onclick = () => window.v43ArchiveItem('book', id);
        actions.prepend(b);
      }

    document.querySelectorAll('#studySection .study-plan').forEach(card => {
      const actions = card.querySelector('.study-actions');

      if (actions && id && !actions.querySelector('.v43-arch-study')) {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'iconbtn v43-arch-study';
        b.title = tx('نقل للأرشيف', 'Archive study plan');
        b.textContent = '📦';
        b.onclick = () => window.v43ArchiveItem('study', id);
        actions.appendChild(b);

  }

  function renderArchiveDrawers() {
    const arch = safeGet(ARCHIVE_KEY, { goals: [], books: [], study: [] });

    // Goals Archive Drawer
    const goalList = document.getElementById('goalList');
    if (goalList) {
      let gDrawer = document.getElementById('v43GoalsArchiveDrawer');
      if ((arch.goals || []).length > 0) {
        if (!gDrawer) {
          goalList.insertAdjacentHTML('afterend', `<details class="v43-archive-details" id="v43GoalsArchiveDrawer"></details>`);
          gDrawer = document.getElementById('v43GoalsArchiveDrawer');
        }
        gDrawer.innerHTML = `
          <summary><span>📦 ${tx('أرشيف الأهداف المحفوظة', 'Archived Goals')} (${arch.goals.length})</span><span>▼</span></summary>
          <div class="v43-archive-list">
            ${arch.goals.map(g => `
              <div class="v43-archive-item">
                <span><strong>${escHtml(g.name)}</strong></span>
                <button type="button" class="v35-pill" onclick="window.v43RestoreArchived('goal','${g.id}')">↩ ${tx('استعادة', 'Restore')}</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (gDrawer) gDrawer.remove();
    }

    // Books Archive Drawer
    const bookList = document.getElementById('bookList');
    if (bookList) {
      let bDrawer = document.getElementById('v43BooksArchiveDrawer');
      if ((arch.books || []).length > 0) {
        if (!bDrawer) {
          bookList.insertAdjacentHTML('afterend', `<details class="v43-archive-details" id="v43BooksArchiveDrawer"></details>`);
          bDrawer = document.getElementById('v43BooksArchiveDrawer');
        }
        bDrawer.innerHTML = `
          <summary><span>📦 ${tx('أرشيف الكتب المكتملة', 'Archived Books')} (${arch.books.length})</span><span>▼</span></summary>
          <div class="v43-archive-list">
            ${arch.books.map(b => `
              <div class="v43-archive-item">
                <span>📚 <strong>${escHtml(b.title)}</strong> <small style="color:var(--muted)">(${b.current}/${b.total})</small></span>
                <button type="button" class="v35-pill" onclick="window.v43RestoreArchived('book','${b.id}')">↩ ${tx('استعادة', 'Restore')}</button>
              </div>
            `).join('')}
          </div>
        `;
      } else if (bDrawer) bDrawer.remove();
    }
  }

  // =========================================================================
  // 6. Daily Summary & Shareable iPhone Story Card (📸 ملخص يومي)
  // =========================================================================
  function installDailySummaryBar() {
    const summaryEl = document.getElementById('summary');
    if (!summaryEl || document.getElementById('v43DailySummaryBar')) return;

    summaryEl.insertAdjacentHTML('afterend', `
      <div class="v43-daily-summary-bar" id="v43DailySummaryBar">
        <div style="font-size:12.5px;font-weight:600;color:var(--ink)" id="v43SmartDailyDigest"></div>
        <button type="button" class="v35-pill active" id="v43OpenDailySummaryBtn" style="white-space:nowrap">
          📸 ${tx('ملخص يومي', 'Daily Summary')}
        </button>
      </div>
    `);
    document.getElementById('v43OpenDailySummaryBtn').onclick = openDailySummaryModal;
    updateDailyDigestText();
  }

  function getDailyStatsSnapshot() {
    const today = dateStr();
    const allGoals = safeGet('khatwati-goals-v1', []).filter(g => g.period === 'daily');
    const doneGoals = allGoals.filter(g => (g.records?.[today] || 0) >= g.target).length;
    const goalPct = allGoals.length ? Math.round((doneGoals / allGoals.length) * 100) : 0;

    const books = safeGet('khatwati-books-v1', []);
    let pagesToday = 0;
    books.forEach(b => (b.history || []).filter(h => h.date === today).forEach(h => { if (h.delta > 0) pagesToday += h.delta; }));

    const studyPlans = safeGet('khatwati-study-v1', []);
    let studyMinsToday = 0;
    studyPlans.forEach(p => (p.studyHistory || []).filter(s => s.date === today).forEach(s => { studyMinsToday += (s.minutes || 0); }));

    const wellness = safeGet('khatwati-wellness-v1', {})[today] || { water: 0 };
    const ayahText = document.getElementById('v37QuoteText')?.textContent?.trim() || '﴿ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾';

    return { today, totalGoals: allGoals.length, doneGoals, goalPct, pagesToday, studyMinsToday, water: wellness.water || 0, ayahText };
  }

  function updateDailyDigestText() {
    const el = document.getElementById('v43SmartDailyDigest');
    if (!el) return;
    const s = getDailyStatsSnapshot();
    el.innerHTML = `📋 ${tx('حصاد اليوم:', 'Today’s digest:')} <strong>${s.doneGoals}/${s.totalGoals}</strong> ${tx('أهداف', 'goals')} · <strong>${s.pagesToday}</strong> ${tx('صفحة', 'pages')} · <strong>${s.studyMinsToday}</strong> ${tx('د دراسة', 'm study')}`;
  }

  function openDailySummaryModal() {
    document.getElementById('v43DailySummaryOverlay')?.remove();
    const s = getDailyStatsSnapshot();
    const accent = getComputedStyle(document.documentElement).getPropertyValue('--green').trim() || '#28664c';

    document.body.insertAdjacentHTML('beforeend', `
      <div class="overlay show" id="v43DailySummaryOverlay">
        <div class="dialog" style="max-width:410px;text-align:center">
          <div class="dialog-head">
            <h3>📸 ${tx('بطاقة ملخص يومك للآيفون', 'Your Daily Summary Card')}</h3>
            <button type="button" class="close" id="v43CloseSummaryModal">×</button>
          </div>
          <div class="v43-story-canvas-wrap">
            <canvas id="v43StoryCanvas" width="720" height="1080"></canvas>
          </div>
          <div style="display:flex;gap:8px;margin-top:12px">
            <button type="button" class="btn" id="v43DownloadStoryBtn" style="flex:1">📥 ${tx('حفظ كصورة', 'Save Image')}</button>
            <button type="button" class="btn secondary" id="v43CopySummaryTextBtn" style="flex:1">📋 ${tx('نسخ النص', 'Copy Text')}</button>
          </div>
        </div>
      </div>
    `);

    const canvas = document.getElementById('v43StoryCanvas');
    const ctx = canvas.getContext('2d');
    // Draw sleek Story Card
    const grad = ctx.createLinearGradient(0, 0, 720, 1080);
    grad.addColorStop(0, accent);
    grad.addColorStop(1, '#12261e');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 720, 1080);

    // Inner glass card
    ctx.fillStyle = 'rgba(255,255,255,0.12)';
    ctx.beginPath();
    ctx.roundRect(48, 60, 624, 960, 36);
    ctx.fill();

    ctx.fillStyle = '#ffffff';
    ctx.textAlign = 'center';
    ctx.font = 'bold 38px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText('✳ خطوتي | ملخص إنجاز اليوم', 360, 145);

    ctx.font = '24px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.82)';
    ctx.fillText(s.today, 360, 192);

    // Big circle for Goal %
    ctx.beginPath();
    ctx.arc(360, 340, 95, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.16)';
    ctx.fill();
    ctx.lineWidth = 12;
    ctx.strokeStyle = '#ffffff';
    ctx.stroke();

    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 58px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(`${s.goalPct}%`, 360, 355);
    ctx.font = '22px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText(`الأهداف المكتملة (${s.doneGoals}/${s.totalGoals})`, 360, 475);

    // 3 Metric boxes
    const metrics = [
      [`📚 ${s.pagesToday}`, 'صفحة مقروءة'],
      [`✍️ ${s.studyMinsToday}`, 'دقيقة دراسة'],
      [`💧 ${s.water}/8`, 'أكواب ماء']
    ];
    metrics.forEach((m, i) => {
      const bx = 76 + i * 194;
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.beginPath();
      ctx.roundRect(bx, 525, 180, 130, 22);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 32px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillText(m[0], bx + 90, 585);
      ctx.font = '20px "IBM Plex Sans Arabic", Tahoma, sans-serif';
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.fillText(m[1], bx + 90, 628);
    });

    // Daily Ayah box
    ctx.fillStyle = 'rgba(255,255,255,0.14)';
    ctx.beginPath();
    ctx.roundRect(76, 700, 568, 220, 24);
    ctx.fill();
    ctx.fillStyle = '#ffffff';
    ctx.font = 'bold 23px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillText('📖 آية اليوم', 360, 750);
    ctx.font = '24px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    const shortAyah = s.ayahText.length > 68 ? s.ayahText.slice(0, 68) + '...' : s.ayahText;
    ctx.fillText(shortAyah, 360, 825);

    ctx.font = '20px "IBM Plex Sans Arabic", Tahoma, sans-serif';
    ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText('إنجازاتك تبدأ بخطوة 🌱', 360, 980);

    document.getElementById('v43CloseSummaryModal').onclick = () => document.getElementById('v43DailySummaryOverlay')?.remove();
    document.getElementById('v43DailySummaryOverlay').onclick = e => { if (e.target.id === 'v43DailySummaryOverlay') e.currentTarget.remove(); };

    document.getElementById('v43DownloadStoryBtn').onclick = () => {
      canvas.toBlob(blob => {
        if (!blob) return;
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `khatwati-daily-${s.today}.png`;
        a.click();
        URL.revokeObjectURL(url);
        window.khatwatiNotice(tx('📸 تم تنزيل صورة ملخص يومك بنجاح!', '📸 Daily summary image saved!'));
      });
    };

    document.getElementById('v43CopySummaryTextBtn').onclick = () => {
      const txt = `✳ ملخص يومي من خطوتي (${s.today})\n🎯 الأهداف: ${s.doneGoals}/${s.totalGoals} (${s.goalPct}%)\n📚 القراءة: ${s.pagesToday} صفحة\n✍️ الدراسة: ${s.studyMinsToday} دقيقة\n💧 الماء: ${s.water}/8 أكواب\n📖 ${s.ayahText}`;
      window.khatwatiCopyFallback(txt, tx('📋 تم نسخ الملخص اليومي', '📋 Daily summary copied'));
    };
  }

  // =========================================================================
  // 7. Study Session Pro Upgrade (غرفة الدراسة المتطورة)
  // =========================================================================
  const STUDY_NOTES_KEY = 'khatwati-study-notes-v1';

  function upgradeStudySessionOverlay() {
    const dialog = document.querySelector('#studyTimerOverlay .study-timer-dialog');
    if (!dialog || dialog.dataset.v43Upgraded === 'true') return;
    dialog.dataset.v43Upgraded = 'true';

    const planId = dialog.dataset.planId;
    const plans = safeGet('khatwati-study-v1', []);
    const plan = plans.find(p => p.id === planId);

    // Add 4th scene: Midnight Focus (🌌 ليلي عميق)
    const scenesBar = dialog.querySelector('.study-scenes');
    if (scenesBar && !scenesBar.querySelector('[data-study-scene="midnight"]')) {
      const midBtn = document.createElement('button');
      midBtn.type = 'button';
      midBtn.dataset.studyScene = 'midnight';
      midBtn.title = tx('ليلي عميق', 'Midnight focus');
      midBtn.setAttribute('aria-label', midBtn.title);
      midBtn.textContent = '🌌';
      midBtn.onclick = () => {
        dialog.dataset.scene = 'midnight';
        document.getElementById('studyTimerOverlay').dataset.scene = 'midnight';
        safeSet('khatwati-study-scene', 'midnight');
        scenesBar.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === midBtn));
      };
      scenesBar.appendChild(midBtn);
    }

    // Add Smart Pomodoro Duration Presets right below #studySessionDuration
    const durInput = document.getElementById('studySessionDuration');
    if (durInput && !dialog.querySelector('.v43-study-presets')) {
      const presets = [
        [25, tx('🍅 25 د بومودورو', '🍅 25m Pomodoro')],
        [45, tx('⚡ 45 د عميق', '⚡ 45m Deep')],
        [60, tx('🚀 60 د مكثف', '🚀 60m Intensive')],
        [5, tx('☕ 5 د استراحة', '☕ 5m Break')]
      ];
      durInput.insertAdjacentHTML('afterend', `
        <div class="v43-study-presets">
          ${presets.map(([m, label]) => `<button type="button" class="v43-preset-chip ${Number(durInput.value)===m?'active':''}" data-preset-min="${m}">${label}</button>`).join('')}
        </div>
      `);
      dialog.querySelectorAll('[data-preset-min]').forEach(btn => {
        btn.onclick = () => {
          if (durInput.disabled) {
            window.khatwatiNotice(tx('أوقف الجلسة مؤقتاً لتغيير المدة', 'Pause session to change duration'));
            return;
          }
          const mins = Number(btn.dataset.presetMin);
          durInput.value = String(mins);
          durInput.dispatchEvent(new Event('change'));
          dialog.querySelectorAll('[data-preset-min]').forEach(b => b.classList.toggle('active', b === btn));
        };
      });
    }

    // Add Live Unit Progress Logger + Session Notes Scratchpad inside the Study Room!
    const actionsRow = dialog.querySelector('.study-timer-actions');
    if (actionsRow && plan && !dialog.querySelector('.v43-study-live-panel')) {
      const notesStore = safeGet(STUDY_NOTES_KEY, {});
      actionsRow.insertAdjacentHTML('afterend', `
        <div class="v43-study-live-panel" id="v43StudyLivePanel">
          <div class="v43-study-live-row">
            <div>
              <strong style="font-size:13px;display:block" id="v43LiveUnitLabel"></strong>
              <small style="font-size:11px;opacity:.8">${tx('سجّل الوحدات اللي تنجزها أثناء الجلسة مباشرة:', 'Log completed units right inside your session:')}</small>
            </div>
            <div style="display:flex;gap:6px;align-items:center">
              <button type="button" class="v43-preset-chip" id="v43LiveUnitMinus">−</button>
              <button type="button" class="v43-preset-chip active" id="v43LiveUnitPlus">＋ ${tx('أنجزت وحدة', '+1 Unit')}</button>
            </div>
          </div>
          <textarea class="v43-study-note-area" id="v43StudySessionNote" rows="2" placeholder="${tx('📝 دوّن ملاحظاتك، القوانين، أو رقم الصفحة هنا أثناء الدراسة (تنحفظ تلقائياً)...', '📝 Jot down session notes, formulas, or page numbers here (auto-saves)...')}">${escHtml(notesStore[planId] || '')}</textarea>
        </div>
      `);

      const paintLivePlan = () => {
        const latestPlans = safeGet('khatwati-study-v1', []);
        const curPlan = latestPlans.find(x => x.id === planId) || plan;
        const pct = curPlan.total ? Math.min(100, Math.round((curPlan.current / curPlan.total) * 100)) : 0;
        const lbl = document.getElementById('v43LiveUnitLabel');
        if (lbl) lbl.textContent = `📊 ${tx('إنجاز المادة:', 'Progress:')} ${curPlan.current} / ${curPlan.total} (${pct}%)`;
      };
      paintLivePlan();

      const stepLiveUnit = delta => {
        const stepBtn = document.querySelector(`#studySection [data-study-step="${delta > 0 ? 1 : -1}"][data-id="${planId}"]`);
        if (stepBtn) {
          stepBtn.click();
          setTimeout(paintLivePlan, 80);
          if (delta > 0) window.khatwatiNotice(tx('👏 أحسنت! تم تحديث تقدم المادة مباشرة', '👏 Subject progress updated!'));
        }
      };

      document.getElementById('v43LiveUnitMinus').onclick = () => stepLiveUnit(-1);
      document.getElementById('v43LiveUnitPlus').onclick = () => stepLiveUnit(1);

      const noteArea = document.getElementById('v43StudySessionNote');
      noteArea.addEventListener('input', () => {
        const s = safeGet(STUDY_NOTES_KEY, {});
        s[planId] = noteArea.value;
        safeSet(STUDY_NOTES_KEY, s);
      });
    }
  }

  function syncAllV43() {
    upgradeSurahSelectorToAll114();
    enhanceGoalsWithSwipeAndDirectInput();
    decorateBookAndStudyArchiveButtons();
    renderArchiveDrawers();
    installDailySummaryBar();
    updateDailyDigestText();
    upgradeStudySessionOverlay();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV43);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v43DailySummaryBar')?.remove();
        syncAllV43();
      }, 230);
    }
  });

  syncAllV43();
})();
</script>

<script id="v44-iphone-fixes-script">
(function(){
  // 1. Controlled, Non-Thrashing UI Sync Scheduler (Zero background CPU loop!)
  let isSyncing = false;
  let syncTimeout = null;

  window.khatwatiScheduleSync = function(delay = 12) {
    if (isSyncing) return;
    clearTimeout(syncTimeout);
    syncTimeout = setTimeout(() => {
      if (isSyncing) return;
      isSyncing = true;
      try {
        (window._khatwatiSyncFns || []).forEach(fn => {
          try { fn(); } catch (err) { console.warn(err); }
        });
      } finally {
        setTimeout(() => { isSyncing = false; }, 25);
      }
    }, delay);
  };

  // Hook core render & view functions so UI enhancements run cleanly ONCE after state changes
  if (typeof window.render === 'function') {
    const baseRender = window.render;
    window.render = function() {
      baseRender.apply(this, arguments);
      window.khatwatiScheduleSync(8);
    };
  }
  if (typeof window.drawBooks === 'function') {
    const baseDrawBooks = window.drawBooks;
    window.drawBooks = function() {
      baseDrawBooks.apply(this, arguments);
      window.khatwatiScheduleSync(8);
    };
  }
  if (typeof window.switchView === 'function') {
    const baseSwitchView = window.switchView;

    try {
      (window._khatwatiSyncFns || []).forEach(fn => {

      });
    } finally {
      inSync = false;
    }
  };

  window.khatwatiScheduleSync = function(delay = 0) {
    if (delay <= 0) {
      window.khatwatiRunSyncNow();
    } else {
      setTimeout(window.khatwatiRunSyncNow, delay);
    }
  };

  // Wrap window.render so khatwatiRunSyncNow runs synchronously every single time goals re-render!
  if (typeof window.render === 'function') {
    const prevRender = window.render;
    window.render = function() {
      prevRender.apply(this, arguments);
      window.khatwatiRunSyncNow();
    };

  // 2. Proactively clear old Service Worker caches so iPhone Safari always runs the latest version
  if ('caches' in window) {

          caches.delete(k).catch(() => {});
        }
      });
    }).catch(() => {});
  }

  window.khatwatiRunSyncNow();
})();

        'الرَّحْمَٰنُ','عَلَّمَ الْقُرْآنَ','خَلَقَ الْإِنسَانَ','عَلَّمَهُ الْبَيَانَ','الشَّمْسُ وَالْقَمَرُ بِحُسْبَانٍ','وَالنَّجْمُ وَالشَّجَرُ يَسْجُدَانِ','وَالسَّمَاءَ رَفَعَهَا وَوَضَعَ الْمِيزَانَ','أَلَّا تَطْغَوْا فِي الْمِيزَانِ','وَأَقِيمُوا الْوَزْنَ بِالْقِسْطِ وَلَا تُخْسِرُوا الْمِيزَانَ','وَالْأَرْضَ وَضَعَهَا لِلْأَنَامِ','فِيهَا فَاكِهَةٌ وَالنَّخْلُ ذَاتُ الْأَكْمَامِ','وَالْحَبُّ ذُو الْعَصْفِ وَالرَّيْحَانُ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','خَلَقَ الْإِنسَانَ مِن صَلْصَالٍ كَالْفَخَّارِ','وَخَلَقَ الْجَانَّ مِن مَّارِجٍ مِّن نَّارٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','رَبُّ الْمَشْرِقَيْنِ وَرَبُّ الْمَغْرِبَيْنِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','مَرَجَ الْبَحْرَيْنِ يَلْتَقِيَانِ','بَيْنَهُمَا بَرْزَخٌ لَّا يَبْغِيَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','يَخْرُجُ مِنْهُمَا اللُّؤْلُؤُ وَالْمَرْجَانُ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','وَلَهُ الْجَوَارِ الْمُنشَآتُ فِي الْبَحْرِ كَالْأَعْلَامِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','كُلُّ مَنْ عَلَيْهَا فَانٍ','وَيَبْقَىٰ وَجْهُ رَبِّكَ ذُو الْجَلَالِ وَالْإِكْرَامِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','يَسْأَلُهُ مَن فِي السَّمَاوَاتِ وَالْأَرْضِ ۚ كُلَّ يَوْمٍ هُوَ فِي شَأْنٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','سَنَفْرُغُ لَكُمْ أَيُّهَ الثَّقَلَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','يَا مَعْشَرَ الْجِنِّ وَالْإِنسِ إِنِ اسْتَطَعْتُمْ أَن تَنفُذُوا مِنْ أَقْطَارِ السَّمَاوَاتِ وَالْأَرْضِ فَانفُذُوا ۚ لَا تَنفُذُونَ إِلَّا بِسُلْطَانٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','يُرْسَلُ عَلَيْكُمَا شُوَاظٌ مِّن نَّارٍ وَنُحَاسٌ فَلَا تَنتَصِرَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فَإِذَا انشَقَّتِ السَّمَاءُ فَكَانَتْ وَرْدَةً كَالدِّهَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فَيَوْمَئِذٍ لَّا يُسْأَلُ عَن ذَنبِهِ إِنسٌ وَلَا جَانٌّ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','يُعْرَفُ الْمُجْرِمُونَ بِسِيمَاهُمْ فَيُؤْخَذُ بِالنَّوَاصِي وَالْأَقْدَامِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','هَٰذِهِ جَهَنَّمُ الَّتِي يُكَذِّبُ بِهَا الْمُجْرِمُونَ','يَطُوفُونَ بَيْنَهَا وَبَيْنَ حَمِيمٍ آنٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','وَلِمَنْ خَافَ مَقَامَ رَبِّهِ جَنَّتَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','ذَوَاتَا أَفْنَانٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِمَا عَيْنَانِ تَجْرِيَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِمَا مِن كُلِّ فَاكِهَةٍ زَوْجَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','مُتَّكِئِينَ عَلَىٰ فُرُشٍ بَطَائِنُهَا مِنْ إِسْتَبْرَقٍ ۚ وَجَنَى الْجَنَّتَيْنِ دَانٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِنَّ قَاصِرَاتُ الطَّرْفِ لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','كَأَنَّهُنَّ الْيَاقُوتُ وَالْمَرْجَانُ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','هَلْ جَزَاءُ الْإِحْسَانِ إِلَّا الْإِحْسَانُ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','وَمِن دُونِهِمَا جَنَّتَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','مُدْهَامَّتَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِمَا عَيْنَانِ نَضَّاخَتَانِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِمَا فَاكِهَةٌ وَنَخْلٌ وَرُمَّانٌ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','فِيهِنَّ خَيْرَاتٌ حِسَانٌ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','حُورٌ مَّقْصُورَاتٌ فِي الْخِيَامِ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','لَمْ يَطْمِثْهُنَّ إِنسٌ قَبْلَهُمْ وَلَا جَانٌّ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','مُتَّكِئِينَ عَلَىٰ رَفْرَفٍ خُضْرٍ وَعَبْقَرِيٍّ حِسَانٍ','فَبِأَيِّ آلَاءِ رَبِّكُمَا تُكَذِّبَانِ','تَبَارَكَ اسْمُ رَبِّكَ ذِي الْجَلَالِ وَالْإِكْرَامِ'
      ]
    },
    67: {
      number: 67,
      name: 'سورة الملك',
      type: 'مكية',
      bismillah: true,
      isPartial: false,
      verses: [
        'تَبَارَكَ الَّذِي بِيَدِهِ الْمُلْكُ وَهُوَ عَلَىٰ كُلِّ شَيْءٍ قَدِيرٌ',
        'الَّذِي خَلَقَ الْمَوْتَ وَالْحَيَاةَ لِيَبْلُوَكُمْ أَيُّكُمْ أَحْسَنُ عَمَلًا ۚ وَهُوَ الْعَزِيزُ الْغَفُورُ',
        'الَّذِي خَلَقَ سَبْعَ سَمَاوَاتٍ طِبَاقًا ۖ مَّا تَرَىٰ فِي خَلْقِ الرَّحْمَٰنِ مِن تَفَاوُتٍ ۖ فَارْجِعِ الْبَصَرَ هَلْ تَرَىٰ مِن فُطُورٍ',
        'ثُمَّ ارْجِعِ الْبَصَرَ كَرَّتَيْنِ يَنقَلِبْ إِلَيْكَ الْبَصَرُ خَاسِئًا وَهُوَ حَسِيرٌ',
        'وَلَقَدْ زَيَّنَّا السَّمَاءَ الدُّنْيَا بِمَصَابِيحَ وَجَعَلْنَاهَا رُجُومًا لِّلشَّيَاطِينِ ۖ وَأَعْتَدْنَا لَهُمْ عَذَابَ السَّعِيرِ',
        'وَلِلَّذِينَ كَفَرُوا بِرَبِّهِمْ عَذَابُ جَهَنَّمَ ۖ وَبِئْسَ الْمَصِيرُ',
        'إِذَا أُلْقُوا فِيهَا سَمِعُوا لَهَا شَهِيقًا وَهِيَ تَفُورُ',
        'تَكَادُ تَمَيَّزُ مِنَ الْغَيْظِ ۖ كُلَّمَا أُلْقِيَ فِيهَا فَوْجٌ سَأَلَهُمْ خَزَنَتُهَا أَلَمْ يَأْتِكُمْ نَذِيرٌ',
        'قَالُوا بَلَىٰ قَدْ جَاءَنَا نَذِيرٌ فَكَذَّبْنَا وَقُلْنَا مَا نَزَّلَ اللَّهُ مِن شَيْءٍ إِنْ أَنتُمْ إِلَّا فِي ضَلَالٍ كَبِيرٍ',
        'وَقَالُوا لَوْ كُنَّا نَسْمَعُ أَوْ نَعْقِلُ مَا كُنَّا فِي أَصْحَابِ السَّعِيرِ',
        'فَاعْتَرَفُوا بِذَنبِهِمْ فَسُحْقًا لِّأَصْحَابِ السَّعِيرِ',
        'إِنَّ الَّذِينَ يَخْشَوْنَ رَبَّهُم بِالْغَيْبِ لَهُم مَّغْفِرَةٌ وَأَجْرٌ كَرِيمٌ',
        'وَأَسِرُّوا قَوْلَكُمْ أَوِ اجْهَرُوا بِهِ ۖ إِنَّهُ عَلِيمٌ بِذَاتِ الصُّدُورِ',
        'أَلَا يَعْلَمُ مَنْ خَلَقَ وَهُوَ اللَّطِيفُ الْخَبِيرُ',
        'هُوَ الَّذِي جَعَلَ لَكُمُ الْأَرْضَ ذَلُولًا فَامْشُوا فِي مَنَاكِبِهَا وَكُلُوا مِن رِّزْقِهِ ۖ وَإِلَيْهِ النُّشُورُ',
        'أَأَمِنتُم مَّن فِي السَّمَاءِ أَن يَخْسِفَ بِكُمُ الْأَرْضَ فَإِذَا هِيَ تَمُورُ',
        'أَمْ أَمِنتُم مَّن فِي السَّمَاءِ أَن يُرْسِلَ عَلَيْكُمْ حَاصِبًا ۖ فَسَتَعْلَمُونَ كَيْفَ نَذِيرِ',
        'وَلَقَدْ كَذَّبَ الَّذِينَ مِن قَبْلِهِمْ فَكَيْفَ كَانَ نَكِيرِ',
        'أَوَلَمْ يَرَوْا إِلَى الطَّيْرِ فَوْقَهُمْ صَافَّاتٍ وَيَقْبِضْنَ ۚ مَا يُمْسِكُهُنَّ إِلَّا الرَّحْمَٰنُ ۚ إِنَّهُ بِكُلِّ شَيْءٍ بَصِيرٌ',
        'أَمَّنْ هَٰذَا الَّذِي هُوَ جُندٌ لَّكُمْ يَنصُرُكُم مِّن دُونِ الرَّحْمَٰنِ ۚ إِنِ الْكَافِرُونَ إِلَّا فِي غُرُورٍ',
        'أَمَّنْ هَٰذَا الَّذِي يَرْزُقُكُمْ إِنْ أَمْسَكَ رِزْقَهُ ۚ بَل لَّجُّوا فِي عُتُوٍّ وَنُفُورٍ',
        'أَفَمَن يَمْشِي مُكِبًّا عَلَىٰ وَجْهِهِ أَهْدَىٰ أَمَّن يَمْشِي سَوِيًّا عَلَىٰ صِرَاطٍ مُّسْتَقِيمٍ',
        'قُلْ هُوَ الَّذِي أَنشَأَكُمْ وَجَعَلَ لَكُمُ السَّمْعَ وَالْأَبْصَارَ وَالْأَفْئِدَةَ ۖ قَلِيلًا مَّا تَشْكُرُونَ',
        'قُلْ هُوَ الَّذِي ذَرَأَكُمْ فِي الْأَرْضِ وَإِلَيْهِ تُحْشَرُونَ',
        'وَيَقُولُونَ مَتَىٰ هَٰذَا الْوَعْدُ إِن كُنتُمْ صَادِقِينَ',
        'قُلْ إِنَّمَا الْعِلْمُ عِندَ اللَّهِ وَإِنَّمَا أَنَا نَذِيرٌ مُّبِينٌ',
        'فَلَمَّا رَأَوْهُ زُلْفَةً سِيئَتْ وُجُوهُ الَّذِينَ كَفَرُوا وَقِيلَ هَٰذَا الَّذِي كُنتُم بِهِ تَدَّعُونَ',
        'قُلْ أَرَأَيْتُمْ إِنْ أَهْلَكَنِيَ اللَّهُ وَمَن مَّعِيَ أَوْ رَحِمَنَا فَمَن يُجِيرُ الْكَافِرِينَ مِنْ عَذَابٍ أَلِيمٍ',
        'قُلْ هُوَ الرَّحْمَٰنُ آمَنَّا بِهِ وَعَلَيْهِ تَوَكَّلْنَا ۖ فَسَتَعْلَمُونَ مَنْ هُوَ فِي ضَلَالٍ مُّبِينٍ',
        'قُلْ أَرَأَيْتُمْ إِنْ أَصْبَحَ مَاؤُكُمْ غَوْرًا فَمَن يَأْتِيكُم بِمَاءٍ مَّعِينٍ'
      ]
    },

  function isSurahComplete(num) {
    const meta = ALL_114_META.find(x => x[0] === num);
    const entry = window.KhatwatiFullSurahs?.[num];
    if (!meta || !entry || !Array.isArray(entry.verses) || entry.isPartial) return false;
    return entry.verses.length >= meta[3];
  }

  async function ensureCompleteSurahLoaded(surahNum) {
    if (isSurahComplete(surahNum)) return window.KhatwatiFullSurahs[surahNum];
    const meta = ALL_114_META.find(x => x[0] === surahNum) || [surahNum, 'سورة ' + surahNum, 'مكية', 0];

    const saveLoadedSurah = verses => {
      const cleanVerses = verses.map((v, idx) => {
        let t = String(v || '').trim();
        if (idx === 0 && surahNum !== 1 && surahNum !== 9) {
          t = t.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '').trim();
        }
        return t;
      });
      const obj = {
        number: surahNum,
        name: 'سورة ' + meta[1],
        type: meta[2],
        bismillah: surahNum !== 1 && surahNum !== 9,
        verses: cleanVerses,
        isPartial: false
      };
      window.KhatwatiFullSurahs[surahNum] = obj;
      const cache = safeGet(SURAH_CACHE_V2, {});
      cache[surahNum] = obj;
      safeSet(SURAH_CACHE_V2, cache);
      return obj;
    };

    try {
      const r1 = await fetch(`https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/${surahNum}.json`);
      if (r1.ok) {
        const d1 = await r1.json();
        if (Array.isArray(d1.verses) && d1.verses.length >= meta[3]) {
          return saveLoadedSurah(d1.verses.map(v => v.text));
        }
      }
    } catch {}

    try {
      const r2 = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
      if (r2.ok) {
        const d2 = await r2.json();
        const ayahs = d2?.data?.ayahs || [];
        if (ayahs.length >= meta[3]) {
          return saveLoadedSurah(ayahs.map(a => a.text));
        }
      }
    } catch {}

    return window.KhatwatiFullSurahs?.[surahNum] || null;
  }

  const paintAllShadedCountdownsAndButtons = window.v46PaintCountdowns = function() {

      const t = safeGet('khatwati-study-timer-v1', null);
      const toggleBtn = document.getElementById('studyTimerToggle');
      if (toggleBtn) {
        toggleBtn.classList.add('v46-shaded-btn');
        if (t && t.plannedMinutes) {
          const totalSec = Math.max(1, Number(t.plannedMinutes) * 60);
          const remSec = t.running && Number.isFinite(t.endAt)
            ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000))
            : Math.max(0, Number(t.remainingSec) || 0);
          const pct = Math.min(100, Math.max(0, Math.round(((totalSec - remSec) / totalSec) * 100)));
          toggleBtn.classList.add('v46-timer-running');
          toggleBtn.style.setProperty('--v46-fill', pct + '%');
          const baseText = t.running ? tx('⏸ إيقاف مؤقت', '⏸ Pause') : tx('▶ استئناف', '▶ Resume');
          toggleBtn.textContent = `${baseText} · ${pct}%`;
        } else {
          toggleBtn.classList.remove('v46-timer-running');
          toggleBtn.style.setProperty('--v46-fill', '0%');
        }
      }

      document.querySelectorAll('.study-session-open').forEach(btn => {
        btn.classList.add('v46-shaded-btn');
        const pid = btn.dataset.studySession;
        if (t && t.planId === pid && t.plannedMinutes) {
          const totalSec = Math.max(1, Number(t.plannedMinutes) * 60);
          const remSec = t.running && Number.isFinite(t.endAt)
            ? Math.max(0, Math.ceil((t.endAt - Date.now()) / 1000))
            : Math.max(0, Number(t.remainingSec) || 0);
          const pct = Math.min(100, Math.max(0, Math.round(((totalSec - remSec) / totalSec) * 100)));
          btn.classList.add('v46-timer-running');
          btn.style.setProperty('--v46-fill', pct + '%');
          const m = Math.floor(remSec / 60), s = remSec % 60;
          btn.textContent = `⏱️ ${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')} (${pct}%)`;

          btn.classList.remove('v46-timer-running');

          ? Math.max(0, Math.ceil((fState.endAt - Date.now()) / 1000))
          : (fState.remaining ?? totalSec);
        if (fState.running || remSec < totalSec) {
