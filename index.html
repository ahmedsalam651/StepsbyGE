<script id="v36-upgrade-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };
  const dateStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const escHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 1. Gamified XP & Level Banner (#v36LevelBanner)
  const LEVEL_TITLES = [
    { ar: 'بداية الخطوة 🌱', en: 'First Step 🌱' },
    { ar: 'مبادر نشيط ✨', en: 'Active Starter ✨' },
    { ar: 'مثابر يومي 🔥', en: 'Daily Achiever 🔥' },
    { ar: 'صانع العادات 🎯', en: 'Habit Builder 🎯' },
    { ar: 'بطل الإنجاز 🏆', en: 'Master of Progress 🏆' },
    { ar: 'أسطورة خطوتي 👑', en: 'Khatwati Legend 👑' }
  ];

  function calculateTotalXP() {
    let xp = 0;
    const goals = safeGet('khatwati-goals-v1', []);
    goals.forEach(g => {
      Object.values(g.records || {}).forEach(v => {
        if (v >= g.target) xp += 20;
        else if (v > 0) xp += 5;
      });
    });
    const todos = safeGet('khatwati-todos-v1', []);
    todos.forEach(t => { if (t.done) xp += 10; });
    const books = safeGet('khatwati-books-v1', []);
    books.forEach(b => {
      xp += Math.min(200, (b.current || 0) * 2);
      if (b.total > 0 && b.current >= b.total) xp += 50;
    });
    const focus = safeGet('khatwati-focus-v1', {});
    Object.values(focus.sessions || {}).forEach(c => { xp += (Number(c) || 0) * 25; });
    const study = safeGet('khatwati-study-v1', []);
    study.forEach(p => {
      (p.studyHistory || []).forEach(s => { xp += Math.max(5, Math.round((s.minutes || 0) * 0.8)); });
    });
    const wellness = safeGet('khatwati-wellness-v1', {});
    Object.values(wellness).forEach(w => {
      if ((w.water || 0) >= 8) xp += 15;
      if (w.mood) xp += 5;
    });
    const fcs = safeGet('khatwati-flashcards-v1', []);
    fcs.forEach(f => { xp += (f.mastered ? 15 : 5); });
    return xp;
  }

  function renderLevelBanner() {
    const summaryEl = document.getElementById('summary');
    if (!summaryEl) return;
    let banner = document.getElementById('v36LevelBanner');
    if (!banner) {
      summaryEl.insertAdjacentHTML('beforebegin', `<section class="v36-level-banner" id="v36LevelBanner"></section>`);
      banner = document.getElementById('v36LevelBanner');
    }
    const xp = calculateTotalXP();
    const level = Math.floor(xp / 100) + 1;
    const currentLevelXP = xp % 100;
    const titleObj = LEVEL_TITLES[Math.min(LEVEL_TITLES.length - 1, level - 1)];
    const title = isEn() ? titleObj.en : titleObj.ar;
    banner.innerHTML = `
      <div class="v36-level-info">
        <div class="v36-level-badge">Lv.${level}</div>
        <div>
          <div class="v36-level-title">${title}</div>
          <div class="v36-level-sub">${tx('مجموع نقاطك:', 'Total XP:')} <strong>${xp} XP</strong> · ${tx('كل خطوة ترفع مستواك!', 'Every action levels you up!')}</div>
        </div>
      </div>
      <div class="v36-xp-wrap">
        <div class="v36-xp-head">
          <span>${tx('التقدم للمستوى', 'Next Level')} ${level + 1}</span>
          <span>${currentLevelXP} / 100 XP</span>
        </div>
        <div class="v36-xp-bar"><i style="width:${currentLevelXP}%"></i></div>
      </div>
    `;
  }

  // 2. Quick One-Tap Goal Templates (#v36TemplatesBar)
  const GOAL_TEMPLATES = [
    { ar: 'شرب 8 أكواب ماء', en: 'Drink 8 glasses of water', icon: '💧', period: 'daily', target: 8, cat: 'health' },
    { ar: 'قراءة 15 صفحة', en: 'Read 15 pages', icon: '📖', period: 'daily', target: 15, cat: 'study' },
    { ar: 'مشي أو رياضة 30 دقيقة', en: '30 min walk or workout', icon: '🏃', period: 'daily', target: 1, cat: 'health' },
    { ar: 'أذكار وتأمل صباحي', en: 'Morning mindfulness', icon: '🌿', period: 'daily', target: 1, cat: 'habit' },
    { ar: 'مراجعة أسبوعية للأهداف', en: 'Weekly goals review', icon: '📊', period: 'weekly', target: 1, cat: 'work' }
  ];

  function installGoalTemplates() {
    const filterBar = document.getElementById('goalFilterBar');
    if (!filterBar || document.getElementById('v36TemplatesBar')) return;
    filterBar.insertAdjacentHTML('beforebegin', `
      <div class="v36-templates-row" id="v36TemplatesBar">
        <span style="font-size:11px;color:var(--muted);font-weight:700;white-space:nowrap">${tx('✨ أهداف جاهزة بضغطة:', '✨ Quick templates:')}</span>
        ${GOAL_TEMPLATES.map((tpl, idx) => `
          <button type="button" class="v36-template-chip" data-tpl-index="${idx}">
            ${tpl.icon} ＋ ${isEn() ? tpl.en : tpl.ar}
          </button>
        `).join('')}
      </div>
    `);
    document.querySelectorAll('#v36TemplatesBar [data-tpl-index]').forEach(btn => {
      btn.onclick = () => {
        const tpl = GOAL_TEMPLATES[Number(btn.dataset.tplIndex)];
        if (!tpl) return;
        const name = isEn() ? tpl.en : tpl.ar;
        const allGoals = safeGet('khatwati-goals-v1', []);
        const newId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : 'goal-' + Date.now();
        const newGoal = { id: newId, name, period: tpl.period, target: tpl.target, records: {} };
        allGoals.push(newGoal);
        safeSet('khatwati-goals-v1', allGoals);
        // Update global goals array if accessible
        try { if (typeof goals !== 'undefined' && Array.isArray(goals)) goals.push(newGoal); } catch {}
        const meta = safeGet('khatwati-goal-meta-v1', {});
        meta[newId] = { category: tpl.cat, priority: 'normal' };
        safeSet('khatwati-goal-meta-v1', meta);
        if (typeof render === 'function') render();
        window.khatwatiNotice(tx(`تمت إضافة "${name}" إلى أهدافك 🌱`, `Added "${name}" to your goals 🌱`));
      };
    });
  }

  // 3. Daily Wellness Tracker: Hydration (8 Cups) & Daily Mood/Energy (#v36WellnessSection)
  const WELLNESS_KEY = 'khatwati-wellness-v1';
  const MOODS = [
    { key: 'great', icon: '🤩', ar: 'متحمس', en: 'Energized' },
    { key: 'calm', icon: '😌', ar: 'هادئ', en: 'Calm' },
    { key: 'okay', icon: '🙂', ar: 'جيد', en: 'Good' },
    { key: 'tired', icon: '😴', ar: 'مرهق', en: 'Tired' }
  ];

  function installWellnessSection() {
    const goalSection = document.getElementById('goalSection');
    if (!goalSection || document.getElementById('v36WellnessSection')) return;
    goalSection.insertAdjacentHTML('beforeend', `
      <section class="v36-wellness-grid" id="v36WellnessSection">
        <article class="v36-wellness-card" id="v36WaterCard"></article>
        <article class="v36-wellness-card" id="v36MoodCard"></article>
      </section>
    `);
    renderWellness();
  }

  function renderWellness() {
    const waterEl = document.getElementById('v36WaterCard');
    const moodEl = document.getElementById('v36MoodCard');
    if (!waterEl || !moodEl) return;
    const all = safeGet(WELLNESS_KEY, {});
    const today = dateStr();
    const dayData = all[today] || { water: 0, mood: '' };
    const cups = Math.max(0, Math.min(8, Number(dayData.water) || 0));

    waterEl.innerHTML = `
      <h3>
        <span>💧 ${tx('شرب الماء اليوم', 'Daily Hydration')}</span>
        <strong style="color:#3282b8;font-size:14px">${cups} / 8 ${tx('أكواب', 'cups')}</strong>
      </h3>
      <p style="margin:0;font-size:12px;color:var(--muted)">${tx('اضغط على الكوب لتسجيل شرب الماء والحفاظ على نشاطك:', 'Tap a glass to log your water intake today:')}</p>
      <div class="v36-cups-row">
        ${Array.from({length: 8}, (_, i) => `
          <button type="button" class="v36-cup-btn ${i < cups ? 'filled' : ''}" data-cup-idx="${i + 1}" aria-label="${tx('كوب', 'Cup')} ${i + 1}">💧</button>
        `).join('')}
      </div>
    `;
    waterEl.querySelectorAll('[data-cup-idx]').forEach(btn => {
      btn.onclick = () => {
        const idx = Number(btn.dataset.cupIdx);
        const store = safeGet(WELLNESS_KEY, {});
        const cur = store[today]?.water || 0;
        const nextVal = (cur === idx) ? idx - 1 : idx;
        store[today] = { ...(store[today] || {}), water: nextVal };
        safeSet(WELLNESS_KEY, store);
        if (nextVal === 8 && cur < 8 && window.khatwatiCelebrate) window.khatwatiCelebrate();
        renderWellness();
        renderLevelBanner();
      };
    });

    moodEl.innerHTML = `
      <h3>
        <span>🌤️ ${tx('مزاجك وطاقتك اليوم', 'Today’s Mood & Energy')}</span>
      </h3>
      <p style="margin:0;font-size:12px;color:var(--muted)">${tx('شلون تحس طاقتك اليوم؟', 'How is your energy feeling today?')}</p>
      <div class="v36-mood-row">
        ${MOODS.map(m => `
          <button type="button" class="v36-mood-btn ${dayData.mood === m.key ? 'active' : ''}" data-mood-key="${m.key}">
            <span>${m.icon}</span>
            <small>${isEn() ? m.en : m.ar}</small>
          </button>
        `).join('')}
      </div>
    `;
    moodEl.querySelectorAll('[data-mood-key]').forEach(btn => {
      btn.onclick = () => {
        const store = safeGet(WELLNESS_KEY, {});
        store[today] = { ...(store[today] || {}), mood: btn.dataset.moodKey };
        safeSet(WELLNESS_KEY, store);
        renderWellness();
        renderLevelBanner();
      };
    });
  }

  // 4. Book Reading Extras: Yearly Reading Challenge & Favorite Book Quotes (#v36BookExtras)
  const CHALLENGE_KEY = 'khatwati-reading-challenge-v1';
  const QUOTES_KEY = 'khatwati-book-quotes-v1';

  function installBookExtras() {
    const booksSection = document.getElementById('booksSection');
    if (!booksSection || document.getElementById('v36BookExtras')) return;
    booksSection.insertAdjacentHTML('beforeend', `
      <div class="v36-book-extras" id="v36BookExtras">
        <article class="v36-wellness-card" id="v36ReadingChallengeCard"></article>
        <article class="v36-wellness-card" id="v36BookQuotesCard"></article>
      </div>
    `);
    renderBookExtras();
  }

  function renderBookExtras() {
    const chCard = document.getElementById('v36ReadingChallengeCard');
    const qCard = document.getElementById('v36BookQuotesCard');
    if (!chCard || !qCard) return;

    const year = new Date().getFullYear();
    const challenge = safeGet(CHALLENGE_KEY, { target: 12 });
    const targetBooks = Math.max(1, Number(challenge.target) || 12);
    const books = safeGet('khatwati-books-v1', []);
    const completedBooks = books.filter(b => b.total > 0 && b.current >= b.total).length;
    const pct = Math.min(100, Math.round((completedBooks / targetBooks) * 100));

    chCard.innerHTML = `
      <h3>
        <span>🏆 ${tx('تحدي القراءة السنوي', 'Yearly Reading Challenge')} (${year})</span>
        <strong style="color:var(--green)">${pct}%</strong>
      </h3>
      <p style="margin:4px 0 10px;font-size:12px;color:var(--muted)">
        ${tx('أنجزت', 'Completed')} <strong>${completedBooks}</strong> ${tx('من أصل', 'of')} <strong>${targetBooks}</strong> ${tx('كتاب هذا العام', 'books this year')}
      </p>
      <div class="book-bar" style="margin:8px 0 12px"><i style="width:${pct}%"></i></div>
      <div style="display:flex;align-items:center;gap:8px">
        <label for="v36ChallengeInput" style="margin:0;font-size:12px;color:var(--muted)">${tx('هدف السنة:', 'Yearly goal:')}</label>
        <input type="number" id="v36ChallengeInput" class="v35-search-input" style="width:76px;padding:6px 8px" min="1" max="500" value="${targetBooks}">
        <button type="button" class="v35-pill" id="v36SaveChallengeBtn">${tx('تحديث', 'Update')}</button>
      </div>
    `;
    document.getElementById('v36SaveChallengeBtn').onclick = () => {
      const val = Math.max(1, Math.min(500, Number(document.getElementById('v36ChallengeInput').value) || 12));
      safeSet(CHALLENGE_KEY, { target: val });
      renderBookExtras();
      window.khatwatiNotice(tx('تم تحديث هدف القراءة السنوي 📚', 'Yearly reading goal updated 📚'));
    };

    const quotes = safeGet(QUOTES_KEY, []);
    qCard.innerHTML = `
      <h3>
        <span>✍️ ${tx('دفتر اقتباسات وفوائد الكتب', 'Book Quotes & Notes')}</span>
        <small style="font-size:11px;color:var(--muted)">${quotes.length} ${tx('اقتباس', 'saved')}</small>
      </h3>
      <form id="v36QuoteForm" style="display:grid;gap:7px;margin-top:8px">
        <input type="text" id="v36QuoteText" class="v35-search-input" maxlength="220" placeholder="${tx('اكتب اقتباساً أو فائدة أعجبتك من كتاب...', 'Write a favorite quote or takeaway...')}" required>
        <div style="display:flex;gap:7px">
          <input type="text" id="v36QuoteBook" class="v35-search-input" style="flex:1" maxlength="60" placeholder="${tx('اسم الكتاب / الصفحة (اختياري)', 'Book title / page (optional)')}">
          <button type="submit" class="btn" style="padding:7px 14px">＋ ${tx('حفظ', 'Save')}</button>
        </div>
      </form>
      <div id="v36QuotesList" style="max-height:210px;overflow-y:auto;margin-top:8px">
        ${quotes.length ? quotes.map(q => `
          <div class="v36-quote-item">
            <p class="v36-quote-text">“${escHtml(q.text)}”</p>
            <div class="v36-quote-meta">
              <span>📖 ${escHtml(q.book || tx('ملاحظة قراءة', 'Reading note'))}</span>
              <div>
                <button type="button" class="iconbtn" data-quote-copy="${q.id}" title="${tx('نسخ', 'Copy')}" aria-label="${tx('نسخ', 'Copy')}">📋</button>
                <button type="button" class="iconbtn" data-quote-del="${q.id}" title="${tx('حذف', 'Delete')}" aria-label="${tx('حذف', 'Delete')}">⌫</button>
              </div>
            </div>
          </div>
        `).join('') : `<div style="font-size:12px;color:var(--muted);padding:10px 0;text-align:center">${tx('احتفظ بأجمل العبارات والأفكار اللي تمر عليك أثناء القراءة ✨', 'Save your favorite quotes and insights while reading ✨')}</div>`}
      </div>
    `;
    document.getElementById('v36QuoteForm').onsubmit = e => {
      e.preventDefault();
      const text = document.getElementById('v36QuoteText').value.trim();
      const book = document.getElementById('v36QuoteBook').value.trim();
      if (!text) return;
      const list = safeGet(QUOTES_KEY, []);
      list.unshift({ id: 'q-' + Date.now(), text, book, date: dateStr() });
      safeSet(QUOTES_KEY, list);
      renderBookExtras();
    };
    qCard.querySelectorAll('[data-quote-copy]').forEach(btn => {
      btn.onclick = () => {
        const item = safeGet(QUOTES_KEY, []).find(x => x.id === btn.dataset.quoteCopy);
        if (!item) return;
        const formatted = `“${item.text}”${item.book ? ' — ' + item.book : ''}`;
        window.khatwatiCopyFallback(formatted, tx('تم نسخ الاقتباس 📋', 'Quote copied 📋'));
      };
    });
    qCard.querySelectorAll('[data-quote-del]').forEach(btn => {
      btn.onclick = () => {
        const next = safeGet(QUOTES_KEY, []).filter(x => x.id !== btn.dataset.quoteDel);
        safeSet(QUOTES_KEY, next);
        renderBookExtras();
      };
    });
  }

  // 5. Interactive Study Flashcards (#v36FlashcardsCard)
  const FC_KEY = 'khatwati-flashcards-v1';
  let fcIndex = 0;
  let fcFlipped = false;

  function installStudyFlashcards() {
    const studySection = document.getElementById('studySection');
    if (!studySection || document.getElementById('v36FlashcardsCard')) return;
    studySection.insertAdjacentHTML('beforeend', `
      <section class="v36-flashcards-card" id="v36FlashcardsCard"></section>
    `);
    renderFlashcards();
  }

  function renderFlashcards() {
    const box = document.getElementById('v36FlashcardsCard');
    if (!box) return;
    const cards = safeGet(FC_KEY, []);
    if (fcIndex >= cards.length) fcIndex = 0;
    const current = cards[fcIndex] || null;

    box.innerHTML = `
      <div class="v35-todo-head">
        <h3>🗂️ ${tx('بطاقات المراجعة الذكية (Flashcards)', 'Smart Study Flashcards')}</h3>
        <span style="font-size:12px;color:var(--muted)">${cards.filter(c => c.mastered).length} / ${cards.length} ${tx('متقنة ✓', 'mastered ✓')}</span>
      </div>
      <form id="v36FcForm" style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px">
        <input type="text" id="v36FcQuestion" class="v35-search-input" style="flex:1 1 160px" maxlength="120" placeholder="${tx('السؤال أو المصطلح...', 'Question or term...')}" required>
        <input type="text" id="v36FcAnswer" class="v35-search-input" style="flex:1 1 160px" maxlength="180" placeholder="${tx('الجواب أو التعريف...', 'Answer or definition...')}" required>
        <button type="submit" class="btn" style="padding:8px 14px">＋ ${tx('أضف بطاقة', 'Add card')}</button>
      </form>
      ${current ? `
        <div class="v36-flashcard-stage" id="v36FcStage" role="button" tabindex="0" aria-label="${tx('اقلب البطاقة', 'Flip flashcard')}">
          <span class="v36-fc-badge">${fcFlipped ? tx('💡 الجواب', '💡 Answer') : tx('❓ السؤال', '❓ Question')} (${fcIndex + 1}/${cards.length}) ${current.mastered ? '· 🌟' : ''}</span>
          <div class="v36-fc-content">${escHtml(fcFlipped ? current.a : current.q)}</div>
          <div class="v36-fc-hint">${tx('اضغط على البطاقة لقلبها بين السؤال والجواب ↺', 'Tap the card to flip between question & answer ↺')}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
          <div style="display:flex;gap:6px">
            <button type="button" class="v35-pill" id="v36FcPrev">◀ ${tx('السابق', 'Prev')}</button>
            <button type="button" class="v35-pill" id="v36FcNext">${tx('التالي', 'Next')} ▶</button>
          </div>
          <div style="display:flex;gap:6px">
            <button type="button" class="v35-pill ${current.mastered ? 'active' : ''}" id="v36FcMaster">
              ${current.mastered ? tx('✓ متقنة', '✓ Mastered') : tx('علّمها كمتقنة ✓', 'Mark mastered ✓')}
            </button>
            <button type="button" class="iconbtn" id="v36FcDelete" title="${tx('حذف البطاقة', 'Delete card')}" aria-label="${tx('حذف البطاقة', 'Delete card')}">⌫</button>
          </div>
        </div>
      ` : `<div style="font-size:12px;color:var(--muted);text-align:center;padding:10px 0">${tx('أضف أسئلة أو مصطلحات دراسية لمراجعتها بطريقة البطاقات التفاعلية 🧠', 'Add study questions or terms above to practice with interactive flashcards 🧠')}</div>`}
    `;

    document.getElementById('v36FcForm').onsubmit = e => {
      e.preventDefault();
      const q = document.getElementById('v36FcQuestion').value.trim();
      const a = document.getElementById('v36FcAnswer').value.trim();
      if (!q || !a) return;
      const all = safeGet(FC_KEY, []);
      all.push({ id: 'fc-' + Date.now(), q, a, mastered: false });
      safeSet(FC_KEY, all);
      fcIndex = all.length - 1;
      fcFlipped = false;
      renderFlashcards();
      renderLevelBanner();
    };

    const stage = document.getElementById('v36FcStage');
    if (stage) {
      stage.onclick = () => { fcFlipped = !fcFlipped; renderFlashcards(); };
    }
    const prevBtn = document.getElementById('v36FcPrev');
    if (prevBtn) {
      prevBtn.onclick = () => { fcIndex = (fcIndex - 1 + cards.length) % cards.length; fcFlipped = false; renderFlashcards(); };
    }
    const nextBtn = document.getElementById('v36FcNext');
    if (nextBtn) {
      nextBtn.onclick = () => { fcIndex = (fcIndex + 1) % cards.length; fcFlipped = false; renderFlashcards(); };
    }
    const masterBtn = document.getElementById('v36FcMaster');
    if (masterBtn && current) {
      masterBtn.onclick = () => {
        const all = safeGet(FC_KEY, []);
        const item = all.find(x => x.id === current.id);
        if (item) {
          item.mastered = !item.mastered;
          safeSet(FC_KEY, all);
          renderFlashcards();
          renderLevelBanner();
        }
      };
    }
    const delBtn = document.getElementById('v36FcDelete');
    if (delBtn && current) {
      delBtn.onclick = () => {
        const all = safeGet(FC_KEY, []).filter(x => x.id !== current.id);
        safeSet(FC_KEY, all);
        fcIndex = 0;
        fcFlipped = false;
        renderFlashcards();
      };
    }
  }

  function syncAllV36() {
    renderLevelBanner();
    installGoalTemplates();
    installWellnessSection();
    installBookExtras();
    installStudyFlashcards();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV36);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v36TemplatesBar')?.remove();
        document.getElementById('v36WellnessSection')?.remove();
        document.getElementById('v36BookExtras')?.remove();
        document.getElementById('v36FlashcardsCard')?.remove();
        syncAllV36();
      }, 150);
    }
  });

  syncAllV36();
})();
</script>
<style id="v37-upgrade-styles">
/* Khatwati v37: Daily Quote Banner, Goal Subtasks, Smart Dhikr/Habit Counter, Live Reading Timer, GPA Calculator, Study Timetable & CSV Export */
.v37-quote-banner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: linear-gradient(135deg, color-mix(in srgb, var(--green) 11%, var(--white)), var(--white));
  border: 1px solid color-mix(in srgb, var(--green) 26%, var(--line));
  border-radius: 17px;
  padding: 12px 16px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.v37-quote-body {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.5;
}
.v37-quote-actions {
  display: flex;
  gap: 5px;
  flex: none;
}

/* Goal Subtasks (Checklist inside Goal Card) */
.v37-subtasks-box {
  margin-top: 8px;
  padding-top: 8px;
  border-top: 1px dashed var(--line);
}
.v37-subtask-item {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  padding: 3px 0;
  color: var(--ink);
}
.v37-subtask-item.done span {
  text-decoration: line-through;
  color: var(--muted);
}
.v37-subtask-check {
  width: 18px;
  height: 18px;
  border-radius: 6px;
  border: 1.5px solid var(--green);
  background: transparent;
  color: #fff;
  font-size: 11px;
  display: grid;
  place-items: center;
  cursor: pointer;
  flex: none;
}
.v37-subtask-item.done .v37-subtask-check {
  background: var(--green);
}
.v37-subtask-form {
  display: flex;
  gap: 6px;
  margin-top: 6px;
}

/* Smart Dhikr & Habit Counter Card */
.v37-counter-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 18px;
  margin-top: 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 14px;
  flex-wrap: wrap;
}
.v37-counter-tap {
  width: 78px;
  height: 78px;
  border-radius: 50%;
  border: 3px solid var(--green);
  background: color-mix(in srgb, var(--green) 14%, var(--paper));
  color: var(--green);
  font: 700 22px inherit;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  cursor: pointer;
  transition: transform .1s ease, background .15s ease;
  box-shadow: 0 6px 18px #28664c1a;
}
.v37-counter-tap:active {
  transform: scale(0.93);
  background: var(--green);
  color: #fff;
}

/* Live Reading Timer in Books View */
.v37-reading-timer {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 15px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}
.v37-rt-clock {
  font-size: 24px;
  font-weight: 700;
  color: var(--green);
  font-variant-numeric: tabular-nums;
  background: var(--paper);
  padding: 6px 14px;
  border-radius: 12px;
  border: 1px solid var(--line);
}

/* Study GPA Calculator & Weekly Study Timetable */
.v37-study-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 16px;
}
@media(max-width:680px){
  .v37-study-grid {
    grid-template-columns: 1fr;
  }
}
.v37-gpa-summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 14px;
  margin: 10px 0;
}
.v37-gpa-list {
  display: grid;
  gap: 6px;
  max-height: 180px;
  overflow-y: auto;
}
.v37-gpa-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 12px;
  padding: 6px 10px;
  background: var(--paper);
  border-radius: 9px;
  border: 1px solid var(--line);
}
.v37-tt-day {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--line);
  font-size: 12px;
}
.v37-tt-day:last-child {
  border-bottom: 0;
}
.v37-tt-day strong {
  min-width: 68px;
  color: var(--green);
}
.v37-tt-input {
  flex: 1;
  border: 1px solid transparent;
  background: var(--paper);
  color: var(--ink);
  border-radius: 8px;
  padding: 5px 8px;
  font: 12px inherit;
}
.v37-tt-input:focus {
  border-color: var(--green);
  outline: none;
}
</style>
<script id="v37-upgrade-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };
  const dateStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const escHtml = s => String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // 1. Daily Motivational Quote Banner (#v37DailyQuoteBanner)
  const DAILY_QUOTES = [
    { ar: '﴿ وَأَن لَّيْسَ لِلْإِنسَانِ إِلَّا مَا سَعَىٰ * وَأَنَّ سَعْيَهُ سَوْفَ يُرَىٰ ﴾ [النجم: ٣٩-٤٠]', en: '“And that there is not for man except that [good] for which he strives, and that his effort is going to be seen.” [An-Najm: 39-40]' },
    { ar: '﴿ فَإِنَّ مَعَ الْعُسْرِ يُسْرًا * إِنَّ مَعَ الْعُسْرِ يُسْرًا ﴾ [الشرح: ٥-٦]', en: '“For indeed, with hardship [will be] ease. Indeed, with hardship [will be] ease.” [Ash-Sharh: 5-6]' },
    { ar: '﴿ وَقُل رَّبِّ زِدْنِي عِلْمًا ﴾ [طه: ١١٤]', en: '“And say: My Lord, increase me in knowledge.” [Ta-Ha: 114]' },
    { ar: '﴿ أَلَا بِذِكْرِ اللَّهِ تَطْمَئِنُّ الْقُلُوبُ ﴾ [الرعد: ٢٨]', en: '“Unquestionably, by the remembrance of Allah hearts are assured.” [Ar-Ra’d: 28]' },
    { ar: '﴿ إِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ ﴾ [التوبة: ١٢٠]', en: '“Indeed, Allah does not allow to be lost the reward of the doers of good.” [At-Tawbah: 120]' },
    { ar: '﴿ وَاصْبِرْ فَإِنَّ اللَّهَ لَا يُضِيعُ أَجْرَ الْمُحْسِنِينَ ﴾ [هود: ١١٥]', en: '“And be patient, for indeed, Allah does not allow to be lost the reward of those who do good.” [Hud: 115]' },
    { ar: '﴿ وَمَن يَتَّقِ اللَّهَ يَجْعَل لَّهُ مَخْرَجًا * وَيَرْزُقْهُ مِنْ حَيْثُ لَا يَحْتَسِبُ ﴾ [الطلاق: ٢-٣]', en: '“And whoever fears Allah — He will make for him a way out and will provide for him from where he does not expect.” [At-Talaq: 2-3]' },
    { ar: '﴿ وَالَّذِينَ جَاهَدُوا فِينَا لَنَهْدِيَنَّهُمْ سُبُلَنَا ﴾ [العنكبوت: ٦٩]', en: '“And those who strive for Us — We will surely guide them to Our ways.” [Al-Ankabut: 69]' },
    { ar: '﴿ رَبَّنَا آتِنَا مِن لَّدُنكَ رَحْمَةً وَهَيِّئْ لَنَا مِنْ أَمْرِنَا رَشَدًا ﴾ [الكهف: ١٠]', en: '“Our Lord, grant us from Yourself mercy and prepare for us from our affair right guidance.” [Al-Kahf: 10]' },
    { ar: '﴿ لَا يُكَلِّفُ اللَّهُ نَفْسًا إِلَّا وُسْعَهَا ﴾ [البقرة: ٢٨٦]', en: '“Allah does not charge a soul except [with that within] its capacity.” [Al-Baqarah: 286]' },
    { ar: '﴿ وَسَارِعُوا إِلَىٰ مَغْفِرَةٍ مِّن رَّبِّكُمْ وَجَنَّةٍ عَرْضُهَا السَّمَاوَاتُ وَالْأَرْضُ ﴾ [آل عمران: ١٣٣]', en: '“And hasten to forgiveness from your Lord and a garden as wide as the heavens and earth.” [Ali ‘Imran: 133]' },
    { ar: '﴿ إِنَّ رَحْمَتَ اللَّهِ قَرِيبٌ مِّنَ الْمُحْسِنِينَ ﴾ [الأعراف: ٥٦]', en: '“Indeed, the mercy of Allah is near to the doers of good.” [Al-A’raf: 56]' }
  ];
  let quoteIdx = new Date().getDate() % DAILY_QUOTES.length;

  function installQuoteBanner() {
    const levelBanner = document.getElementById('v36LevelBanner') || document.getElementById('summary');
    if (!levelBanner) return;
    let el = document.getElementById('v37DailyQuoteBanner');
    if (!el) {
      levelBanner.insertAdjacentHTML('beforebegin', `<section class="v37-quote-banner" id="v37DailyQuoteBanner"></section>`);
      el = document.getElementById('v37DailyQuoteBanner');
    }
    const q = DAILY_QUOTES[quoteIdx % DAILY_QUOTES.length];
    const text = isEn() ? q.en : q.ar;
    el.innerHTML = `
      <div class="v37-quote-body">
        <span style="font-size:18px">💡</span>
        <span id="v37QuoteText">${text}</span>
      </div>
      <div class="v37-quote-actions">
        <button type="button" class="iconbtn" id="v37NextQuoteBtn" title="${tx('حكمة ثانية', 'Next quote')}" aria-label="${tx('حكمة ثانية', 'Next quote')}">🔄</button>
        <button type="button" class="iconbtn" id="v37CopyQuoteBtn" title="${tx('نسخ', 'Copy')}" aria-label="${tx('نسخ', 'Copy')}">📋</button>
      </div>
    `;
    document.getElementById('v37NextQuoteBtn').onclick = () => {
      quoteIdx = (quoteIdx + 1) % DAILY_QUOTES.length;
      installQuoteBanner();
    };
    document.getElementById('v37CopyQuoteBtn').onclick = () => {
      window.khatwatiCopyFallback(text, tx('تم نسخ الحكمة ✨', 'Quote copied ✨'));
    };
  }

  // 2. Goal Subtasks / Checklist inside Goal Cards (khatwati-subtasks-v1)
  const SUBTASKS_KEY = 'khatwati-subtasks-v1';
  let openSubtaskGoals = new Set();

  function decorateGoalSubtasks() {
    const store = safeGet(SUBTASKS_KEY, {});
    document.querySelectorAll('#goalList .goal').forEach(card => {
      const id = card.dataset.goalId || card.querySelector('.goal-actions button[onclick*="editGoal"]')?.getAttribute('onclick')?.match(/editGoal\('([^']+)'\)/)?.[1];
      if (!id) return;
      const actions = card.querySelector('.goal-actions');
      const info = card.querySelector('.goal-info');
      if (!actions || !info) return;

      if (!actions.querySelector('.v37-subtask-btn')) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'iconbtn v37-subtask-btn';
        btn.title = tx('خطوات فرعية', 'Subtasks');
        btn.setAttribute('aria-label', btn.title);
        btn.textContent = '☑️';
        btn.onclick = () => {
          if (openSubtaskGoals.has(id)) openSubtaskGoals.delete(id);
          else openSubtaskGoals.add(id);
          renderGoalSubtaskBox(info, id);
        };
        actions.prepend(btn);
      }
      renderGoalSubtaskBox(info, id);
    });
  }

  function renderGoalSubtaskBox(info, goalId) {
    const store = safeGet(SUBTASKS_KEY, {});
    const list = store[goalId] || [];
    let box = info.querySelector('.v37-subtasks-box');
    if (!openSubtaskGoals.has(goalId) && !list.length) {
      box?.remove();
      return;
    }
    if (!box) {
      box = document.createElement('div');
      box.className = 'v37-subtasks-box';
      info.appendChild(box);
    }
    box.innerHTML = `
      ${list.map(st => `
        <div class="v37-subtask-item ${st.done ? 'done' : ''}">
          <button type="button" class="v37-subtask-check" data-st-toggle="${st.id}">${st.done ? '✓' : ''}</button>
          <span style="flex:1">${escHtml(st.text)}</span>
          <button type="button" class="iconbtn" style="font-size:12px;padding:2px 5px" data-st-del="${st.id}" aria-label="${tx('حذف', 'Delete')}">×</button>
        </div>
      `).join('')}
      ${openSubtaskGoals.has(goalId) ? `
        <form class="v37-subtask-form">
          <input type="text" class="v35-search-input" style="padding:5px 9px;font-size:12px" maxlength="70" placeholder="${tx('أضف خطوة فرعية لهذا الهدف...', 'Add a mini step for this goal...')}" required>
          <button type="submit" class="v35-pill active" style="padding:4px 10px">＋</button>
        </form>
      ` : ''}
    `;
    box.querySelectorAll('[data-st-toggle]').forEach(b => {
      b.onclick = () => {
        const all = safeGet(SUBTASKS_KEY, {});
        const arr = all[goalId] || [];
        const item = arr.find(x => x.id === b.dataset.stToggle);
        if (item) {
          item.done = !item.done;
          safeSet(SUBTASKS_KEY, all);
          renderGoalSubtaskBox(info, goalId);
        }
      };
    });
    box.querySelectorAll('[data-st-del]').forEach(b => {
      b.onclick = () => {
        const all = safeGet(SUBTASKS_KEY, {});
        all[goalId] = (all[goalId] || []).filter(x => x.id !== b.dataset.stDel);
        safeSet(SUBTASKS_KEY, all);
        renderGoalSubtaskBox(info, goalId);
      };
    });
    const form = box.querySelector('form');
    if (form) {
      form.onsubmit = e => {
        e.preventDefault();
        const inp = form.querySelector('input');
        const val = inp.value.trim();
        if (!val) return;
        const all = safeGet(SUBTASKS_KEY, {});
        all[goalId] = all[goalId] || [];
        all[goalId].push({ id: 'st-' + Date.now(), text: val, done: false });
        safeSet(SUBTASKS_KEY, all);
        renderGoalSubtaskBox(info, goalId);
      };
    }
  }

  // 3. Smart Dhikr / Mindfulness Habit Counter (#v37TasbeehCard)
  const TASBEEH_KEY = 'khatwati-tasbeeh-v1';
  const PHRASES = [
    { ar: 'سبحان الله وبحمده 🌿', en: 'Gratitude & Mindfulness 🌿' },
    { ar: 'أستغفر الله وأتوب إليه ✨', en: 'Peaceful Reflection ✨' },
    { ar: 'اللهم صلِّ على محمد وآل محمد 🌸', en: 'Blessings & Kindness 🌸' },
    { ar: 'لا حول ولا قوة إلا بالله 💪', en: 'Strength & Patience 💪' },
    { ar: 'تنفّس عميق وهدوء 🧘', en: 'Deep Breath Count 🧘' }
  ];

  function installTasbeehCard() {
    const goalSection = document.getElementById('goalSection');
    if (!goalSection || document.getElementById('v37TasbeehCard')) return;
    goalSection.insertAdjacentHTML('beforeend', `<section class="v37-counter-card" id="v37TasbeehCard"></section>`);
    renderTasbeehCard();
  }

  function renderTasbeehCard() {
    const card = document.getElementById('v37TasbeehCard');
    if (!card) return;
    const state = safeGet(TASBEEH_KEY, { count: 0, total: 0, phraseIdx: 0, target: 33 });
    const pIdx = Number(state.phraseIdx) || 0;
    const target = Number(state.target) || 33;

    card.innerHTML = `
      <div style="flex:1;min-width:210px">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px">
          <h3 style="margin:0;font-size:15px">📿 ${tx('عداد الأذكار والتكرار اليومي', 'Mindfulness & Habit Counter')}</h3>
          <span class="v35-tag">${tx('الإجمالي:', 'Total:')} ${state.total || 0}</span>
        </div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px">
          <select id="v37PhraseSelect" class="v35-search-input" style="flex:1;min-width:160px;padding:6px 10px">
            ${PHRASES.map((p, i) => `<option value="${i}" ${i === pIdx ? 'selected' : ''}>${isEn() ? p.en : p.ar}</option>`).join('')}
          </select>
          <select id="v37TargetSelect" class="v35-pill" aria-label="${tx('الهدف', 'Target')}">
            ${[10, 33, 100].map(n => `<option value="${n}" ${n === target ? 'selected' : ''}>🎯 ${n}</option>`).join('')}
          </select>
          <button type="button" class="v35-pill" id="v37ResetCounterBtn">${tx('تصفير', 'Reset')}</button>
        </div>
        <div style="font-size:12px;color:var(--muted)">
          ${tx('اضغط على الدائرة للتسبيح أو العدّ — يحتفظ بتقدمك تلقائياً:', 'Tap the circle to count — saves your progress automatically:')}
        </div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <button type="button" class="v37-counter-tap" id="v37TapBtn" aria-label="${tx('اضغط للعد', 'Tap to count')}">
          ${state.count || 0}
        </button>
        <small style="font-size:11px;color:var(--muted)">${state.count || 0} / ${target}</small>
      </div>
    `;

    document.getElementById('v37TapBtn').onclick = () => {
      const s = safeGet(TASBEEH_KEY, { count: 0, total: 0, phraseIdx: 0, target: 33 });
      s.count = (Number(s.count) || 0) + 1;
      s.total = (Number(s.total) || 0) + 1;
      safeSet(TASBEEH_KEY, s);
      if (s.count === (Number(s.target) || 33)) {
        if (window.khatwatiCelebrate) window.khatwatiCelebrate();
        window.khatwatiNotice(tx('تقبّل الله! أكملت العدد المستهدف 🌟', 'Target count reached! Well done 🌟'));
      }
      renderTasbeehCard();
    };
    document.getElementById('v37PhraseSelect').onchange = e => {
      const s = safeGet(TASBEEH_KEY, { count: 0, total: 0, phraseIdx: 0, target: 33 });
      s.phraseIdx = Number(e.target.value);
      safeSet(TASBEEH_KEY, s);
    };
    document.getElementById('v37TargetSelect').onchange = e => {
      const s = safeGet(TASBEEH_KEY, { count: 0, total: 0, phraseIdx: 0, target: 33 });
      s.target = Number(e.target.value);
      safeSet(TASBEEH_KEY, s);
      renderTasbeehCard();
    };
    document.getElementById('v37ResetCounterBtn').onclick = () => {
      const s = safeGet(TASBEEH_KEY, { count: 0, total: 0, phraseIdx: 0, target: 33 });
      s.count = 0;
      safeSet(TASBEEH_KEY, s);
      renderTasbeehCard();
    };
  }

  // 4. Live Reading Session Timer & Pace Logger in Books Tab (#v37ReadingTimerCard)
  let readSec = 0;
  let readInterval = null;

  function installReadingTimer() {
    const booksSection = document.getElementById('booksSection');
    const bookList = document.getElementById('bookList');
    if (!booksSection || !bookList || document.getElementById('v37ReadingTimerCard')) return;
    bookList.insertAdjacentHTML('beforebegin', `<section class="v37-reading-timer" id="v37ReadingTimerCard"></section>`);
    renderReadingTimer();
  }

  function formatMMSS(sec) {
    const m = Math.floor(sec / 60);
    const s = sec % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function renderReadingTimer() {
    const box = document.getElementById('v37ReadingTimerCard');
    if (!box) return;
    const books = safeGet('khatwati-books-v1', []);
    box.innerHTML = `
      <div>
        <h3 style="margin:0 0 4px;font-size:15px">⏱️ ${tx('مؤقت جلسة القراءة المباشر', 'Live Reading Session Timer')}</h3>
        <p style="margin:0;font-size:12px;color:var(--muted)">${tx('شغّل المؤقت أثناء قراءتك وسجّل الصفحات المنجزة فوراً:', 'Run the timer while reading and log completed pages right away:')}</p>
      </div>
      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="v37-rt-clock" id="v37ReadClock">${formatMMSS(readSec)}</span>
        <button type="button" class="btn" id="v37ReadToggleBtn" style="padding:9px 14px">${readInterval ? tx('إيقاف مؤقت', 'Pause') : tx('▶ ابدأ قراءة', '▶ Start reading')}</button>
        ${books.length ? `<button type="button" class="v35-pill" id="v37LogReadPagesBtn">＋ ${tx('سجّل صفحات للكتاب', 'Log pages to book')}</button>` : ''}
        <button type="button" class="iconbtn" id="v37ReadResetBtn" title="${tx('إعادة', 'Reset')}" aria-label="${tx('إعادة', 'Reset')}">↺</button>
      </div>
    `;
    document.getElementById('v37ReadToggleBtn').onclick = () => {
      if (readInterval) {
        clearInterval(readInterval);
        readInterval = null;
      } else {
        readInterval = setInterval(() => {
          readSec++;
          const clk = document.getElementById('v37ReadClock');
          if (clk) clk.textContent = formatMMSS(readSec);
        }, 1000);
      }
      renderReadingTimer();
    };
    document.getElementById('v37ReadResetBtn').onclick = () => {
      clearInterval(readInterval);
      readInterval = null;
      readSec = 0;
      renderReadingTimer();
    };
    const logBtn = document.getElementById('v37LogReadPagesBtn');
    if (logBtn) {
      logBtn.onclick = () => {
        const currentBooks = safeGet('khatwati-books-v1', []);
        if (!currentBooks.length) return;
        const firstBook = currentBooks.find(b => b.current < b.total) || currentBooks[0];
        window.khatwatiPrompt(
          tx(`كم صفحة/فصل أنجزت من «${firstBook.title}»؟`, `How many pages/chapters did you read in "${firstBook.title}"?`),
          '5',
          val => {
            const delta = Math.max(1, parseInt(val, 10) || 0);
            if (!delta || typeof window.bookStep !== 'function') return;
            window.bookStep(firstBook.id, delta);
            const mins = Math.max(1, Math.round(readSec / 60));
            window.khatwatiNotice(tx(`عاشت إيدك! انحفظ تقدمك (${delta} وحدة في ~${mins} دقيقة) 📚`, `Saved ${delta} units in ~${mins} min 📚`));
          }
        );
      };
    }
  }

  // 5. Study GPA / Grade Calculator & Weekly Study Timetable (#v37StudyExtras)
  const GPA_KEY = 'khatwati-gpa-v1';
  const TT_KEY = 'khatwati-timetable-v1';
  const WEEK_DAYS = [
    { k: 'mon', ar: 'الاثنين', en: 'Monday' },
    { k: 'tue', ar: 'الثلاثاء', en: 'Tuesday' },
    { k: 'wed', ar: 'الأربعاء', en: 'Wednesday' },
    { k: 'thu', ar: 'الخميس', en: 'Thursday' },
    { k: 'fri', ar: 'الجمعة', en: 'Friday' },
    { k: 'sat', ar: 'السبت', en: 'Saturday' },
    { k: 'sun', ar: 'الأحد', en: 'Sunday' }
  ];

  function installStudyExtras() {
    const studySection = document.getElementById('studySection');
    if (!studySection || document.getElementById('v37StudyExtras')) return;
    studySection.insertAdjacentHTML('beforeend', `
      <div class="v37-study-grid" id="v37StudyExtras">
        <article class="v36-wellness-card" id="v37GpaCard"></article>
        <article class="v36-wellness-card" id="v37TimetableCard"></article>
      </div>
    `);
    renderGpaCard();
    renderTimetableCard();
  }

  function renderGpaCard() {
    const card = document.getElementById('v37GpaCard');
    if (!card) return;
    const list = safeGet(GPA_KEY, []);
    let totalWeighted = 0;
    let totalUnits = 0;
    list.forEach(item => {
      const u = Math.max(1, Number(item.units) || 1);
      const g = Math.max(0, Math.min(100, Number(item.grade) || 0));
      totalWeighted += g * u;
      totalUnits += u;
    });
    const avg100 = totalUnits ? (totalWeighted / totalUnits).toFixed(1) : '0.0';
    const gpa4 = totalUnits ? Math.max(0, Math.min(4, ((totalWeighted / totalUnits) / 25))).toFixed(2) : '0.00';

    card.innerHTML = `
      <h3>
        <span>🎓 ${tx('حاسبة المعدل والدرجات', 'GPA & Grade Calculator')}</span>
        <span class="v35-tag">${avg100}% · ${gpa4}/4.0</span>
      </h3>
      <form id="v37GpaForm" style="display:flex;gap:6px;flex-wrap:wrap;margin:8px 0">
        <input type="text" id="v37GpaSubj" class="v35-search-input" style="flex:2 1 110px" maxlength="50" placeholder="${tx('المادة...', 'Subject...')}" required>
        <input type="number" id="v37GpaScore" class="v35-search-input" style="flex:1 1 65px" min="0" max="100" placeholder="${tx('الدرجة %', 'Score %')}" required>
        <input type="number" id="v37GpaUnits" class="v35-search-input" style="flex:1 1 60px" min="1" max="20" value="3" title="${tx('الوحدات', 'Credits')}" required>
        <button type="submit" class="btn" style="padding:7px 12px">＋</button>
      </form>
      <div class="v37-gpa-list">
        ${list.length ? list.map(item => `
          <div class="v37-gpa-row">
            <span><strong>${escHtml(item.name)}</strong> <small style="color:var(--muted)">(${item.units} ${tx('وحدة', 'cr')})</small></span>
            <div>
              <b style="color:var(--green)">${item.grade}%</b>
              <button type="button" class="iconbtn" data-gpa-del="${item.id}" aria-label="${tx('حذف', 'Delete')}">⌫</button>
            </div>
          </div>
        `).join('') : `<div style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0">${tx('أضف موادك ودرجاتك لحساب المعدل الموزون فوراً 📊', 'Add subjects and scores to calculate your weighted average 📊')}</div>`}
      </div>
    `;
    document.getElementById('v37GpaForm').onsubmit = e => {
      e.preventDefault();
      const name = document.getElementById('v37GpaSubj').value.trim();
      const grade = Number(document.getElementById('v37GpaScore').value);
      const units = Number(document.getElementById('v37GpaUnits').value) || 1;
      if (!name) return;
      const arr = safeGet(GPA_KEY, []);
      arr.push({ id: 'gpa-' + Date.now(), name, grade, units });
      safeSet(GPA_KEY, arr);
      renderGpaCard();
    };
    card.querySelectorAll('[data-gpa-del]').forEach(btn => {
      btn.onclick = () => {
        const arr = safeGet(GPA_KEY, []).filter(x => x.id !== btn.dataset.gpaDel);
        safeSet(GPA_KEY, arr);
        renderGpaCard();
      };
    });
  }

  function renderTimetableCard() {
    const card = document.getElementById('v37TimetableCard');
    if (!card) return;
    const schedule = safeGet(TT_KEY, {});
    card.innerHTML = `
      <h3>
        <span>📅 ${tx('جدول المراجعة الأسبوعي', 'Weekly Study Schedule')}</span>
      </h3>
      <p style="margin:0 0 8px;font-size:12px;color:var(--muted)">${tx('وزّع موادك على أيام الأسبوع وينحفظ جدولك تلقائياً:', 'Assign subjects to each day of the week (auto-saves):')}</p>
      <div>
        ${WEEK_DAYS.map(d => `
          <div class="v37-tt-day">
            <strong>${isEn() ? d.en : d.ar}</strong>
            <input type="text" class="v37-tt-input" data-tt-day="${d.k}" value="${escHtml(schedule[d.k] || '')}" placeholder="${tx('اكتب مواد أو مهام هذا اليوم...', 'Subjects or focus for this day...')}">
          </div>
        `).join('')}
      </div>
    `;
    card.querySelectorAll('[data-tt-day]').forEach(inp => {
      inp.onchange = () => {
        const cur = safeGet(TT_KEY, {});
        cur[inp.dataset.ttDay] = inp.value.trim();
        safeSet(TT_KEY, cur);
        window.khatwatiNotice(tx('تم حفظ جدول اليوم 📅', 'Schedule saved 📅'));
      };
    });
  }

  // 6. Export CSV button in Backup Card & Keyboard Shortcuts
  function installCsvExportBtn() {
    const exportBtn = document.getElementById('exportBackup');
    if (!exportBtn || document.getElementById('v37ExportCsvBtn')) return;
    exportBtn.insertAdjacentHTML('afterend', `
      <button type="button" id="v37ExportCsvBtn" class="btn secondary">${tx('📊 تصدير جدول (CSV)', '📊 Export CSV')}</button>
    `);
    document.getElementById('v37ExportCsvBtn').onclick = () => {
      const goals = safeGet('khatwati-goals-v1', []);
      const books = safeGet('khatwati-books-v1', []);
      const study = safeGet('khatwati-study-v1', []);
      const rows = [
        ['Type', 'Title', 'Period/Unit', 'Current', 'Target', 'Deadline']
      ];
      goals.forEach(g => {
        const doneCount = Object.values(g.records || {}).filter(v => v >= g.target).length;
        rows.push(['Goal', g.name, g.period, String(doneCount), String(g.target), '-']);
      });
      books.forEach(b => {
        rows.push(['Book', b.title, b.unit, String(b.current), String(b.total), b.deadline || '-']);
      });
      study.forEach(s => {
        rows.push(['Study Plan', s.name, s.unit, String(s.current), String(s.total), s.deadline || '-']);
      });
      const csvContent = '\uFEFF' + rows.map(r => r.map(c => `"${String(c || '').replace(/"/g, '""')}"`).join(',')).join('\n');
      const url = URL.createObjectURL(new Blob([csvContent], { type: 'text/csv;charset=utf-8' }));
      const a = document.createElement('a');
      a.href = url;
      a.download = `khatwati-summary-${dateStr()}.csv`;
      a.click();
      URL.revokeObjectURL(url);
      window.khatwatiNotice(tx('تم تنزيل جدول الإنجازات بصيغة CSV 📊', 'Downloaded summary table as CSV 📊'));
    };
  }

  // Keyboard shortcuts: Alt+N (new goal), Alt+D (dark mode), Alt+1..4 (switch views)
  document.addEventListener('keydown', e => {
    if (!e.altKey) return;
    const key = e.key.toLowerCase();
    if (key === 'n') {
      e.preventDefault();
      document.getElementById('addBtn')?.click();
    } else if (key === 'd') {
      e.preventDefault();
      document.getElementById('darkModeBtn')?.click();
    } else if (['1', '2', '3', '4'].includes(key)) {
      e.preventDefault();
      const views = ['goals', 'books', 'weekly', 'study'];
      const v = views[Number(key) - 1];
      document.querySelector(`.view-btn[data-view="${v}"]`)?.click();
    }
  });

  function syncAllV37() {
    installQuoteBanner();
    decorateGoalSubtasks();
    installTasbeehCard();
    installReadingTimer();
    installStudyExtras();
    installCsvExportBtn();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV37);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v37DailyQuoteBanner')?.remove();
        document.getElementById('v37TasbeehCard')?.remove();
        document.getElementById('v37ReadingTimerCard')?.remove();
        document.getElementById('v37StudyExtras')?.remove();
        document.getElementById('v37ExportCsvBtn')?.remove();
        syncAllV37();
      }, 160);
    }
  });

  syncAllV37();
})();
</script>

<script id="v38-iphone-clean-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;

  let activeGoalTool = LS.getItem('khatwati-v38-goal-tool') || 'focus';
  let activeBookTool = LS.getItem('khatwati-v38-book-tool') || 'timer';
  let activeStudyTool = LS.getItem('khatwati-v38-study-tool') || 'exams';

  // 1. Re-structure each Goal Card so Title + Check are on the top row, Progress bar in the middle, Actions at bottom
  function organizeGoalCardsForIphone() {
    document.querySelectorAll('#goalList .goal').forEach(card => {
      if (card.querySelector('.v38-goal-top-row')) return;
      const check = card.querySelector('.check');
      const info = card.querySelector('.goal-info');
      if (!check || !info) return;
      const topRow = document.createElement('div');
      topRow.className = 'v38-goal-top-row';
      card.prepend(topRow);
      topRow.appendChild(check);
      topRow.appendChild(info);
    });
  }

  // 2. Add a clean Filter/Templates toggle button in the Goals section header so filters don't clutter iPhone view
  function setupFilterToggle() {
    const goalSection = document.getElementById('goalSection');
    if (!goalSection) return;
    const sectionHead = goalSection.querySelector('.section-head');
    if (!sectionHead || document.getElementById('v38FilterToggleBtn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'v38FilterToggleBtn';
    btn.className = 'v38-filter-btn';
    const updateLabel = () => {
      const shown = document.body.dataset.showFilters === 'true';
      btn.classList.toggle('active', shown);
      btn.innerHTML = `🔍 ${tx('بحث وقوالب جاهزة', 'Search & Templates')} ${shown ? '▲' : '▼'}`;
    };
    btn.onclick = () => {
      document.body.dataset.showFilters = document.body.dataset.showFilters === 'true' ? 'false' : 'true';
      updateLabel();
    };
    sectionHead.appendChild(btn);
    updateLabel();
  }

  // 3. Organize Goal Extra Tools into a clean iOS Segmented Switcher BELOW #goalList
  function organizeGoalSubtools() {
    const goalSection = document.getElementById('goalSection');
    const goalList = document.getElementById('goalList');
    if (!goalSection || !goalList) return;

    const focusCard = document.getElementById('focusCard');
    const quickTasks = document.getElementById('quickTasksCard');
    const wellness = document.getElementById('v36WellnessSection');
    const tasbeeh = document.getElementById('v37TasbeehCard');

    if (!focusCard && !quickTasks && !wellness && !tasbeeh) return;

    let wrap = document.getElementById('v38GoalSubtools');
    if (!wrap) {
      goalList.insertAdjacentHTML('afterend', `
        <div class="v38-subtools-wrap" id="v38GoalSubtools">
          <div class="v38-subtools-header">
            <h3 id="v38GoalToolsTitle">✨ ${tx('أدوات يومك المساندة (اضغط للتبديل)', 'Daily Companion Tools')}</h3>
          </div>
          <div class="v38-seg-bar" id="v38GoalSegBar"></div>
          <div id="v38GoalToolsBody"></div>
        </div>
      `);
      wrap = document.getElementById('v38GoalSubtools');
    }

    const body = document.getElementById('v38GoalToolsBody');
    [focusCard, quickTasks, wellness, tasbeeh].forEach(el => {
      if (el && el.parentElement !== body) body.appendChild(el);
    });

    const titleEl = document.getElementById('v38GoalToolsTitle');
    if (titleEl) titleEl.textContent = '✨ ' + tx('أدوات يومك المساندة (اضغط للتبديل)', 'Daily Companion Tools');

    const tabs = [
      { id: 'focus', label: tx('🎯 التركيز', '🎯 Focus'), el: focusCard },
      { id: 'tasks', label: tx('⚡ مهام سريعة', '⚡ Tasks'), el: quickTasks },
      { id: 'wellness', label: tx('💧 ماء ومزاج', '💧 Wellness'), el: wellness },
      { id: 'tasbeeh', label: tx('📿 الأذكار', '📿 Counter'), el: tasbeeh }
    ];

    const segBar = document.getElementById('v38GoalSegBar');
    if (segBar) {
      segBar.innerHTML = tabs.map(t => `
        <button type="button" class="v38-seg-btn ${activeGoalTool === t.id ? 'active' : ''}" data-gtool="${t.id}">${t.label}</button>
      `).join('');
      segBar.querySelectorAll('[data-gtool]').forEach(b => {
        b.onclick = () => {
          activeGoalTool = b.dataset.gtool;
          try { LS.setItem('khatwati-v38-goal-tool', activeGoalTool); } catch {}
          organizeGoalSubtools();
        };
      });
    }

    tabs.forEach(t => {
      if (t.el) t.el.classList.toggle('v38-hidden-tool', activeGoalTool !== t.id);
    });
  }

  // 4. Organize Books Extra Tools into a clean iOS Segmented Switcher BELOW #bookList
  function organizeBookSubtools() {
    const booksSection = document.getElementById('booksSection');
    const bookList = document.getElementById('bookList');
    if (!booksSection || !bookList) return;

    const timerCard = document.getElementById('v37ReadingTimerCard');
    const challengeCard = document.getElementById('v36ReadingChallengeCard');
    const quotesCard = document.getElementById('v36BookQuotesCard');
    if (!timerCard && !challengeCard && !quotesCard) return;

    let wrap = document.getElementById('v38BookSubtools');
    if (!wrap) {
      bookList.insertAdjacentHTML('afterend', `
        <div class="v38-subtools-wrap" id="v38BookSubtools">
          <div class="v38-subtools-header">
            <h3 id="v38BookToolsTitle">📚 ${tx('أدوات القراءة والاقتباسات', 'Reading Tools & Quotes')}</h3>
          </div>
          <div class="v38-seg-bar" id="v38BookSegBar" style="grid-template-columns:repeat(3,minmax(0,1fr))"></div>
          <div id="v38BookToolsBody"></div>
        </div>
      `);
      wrap = document.getElementById('v38BookSubtools');
    }

    const body = document.getElementById('v38BookToolsBody');
    [timerCard, challengeCard, quotesCard].forEach(el => {
      if (el && el.parentElement !== body) body.appendChild(el);
    });

    const titleEl = document.getElementById('v38BookToolsTitle');
    if (titleEl) titleEl.textContent = '📚 ' + tx('أدوات القراءة والاقتباسات', 'Reading Tools & Quotes');

    const tabs = [
      { id: 'timer', label: tx('⏱️ مؤقت القراءة', '⏱️ Timer'), el: timerCard },
      { id: 'challenge', label: tx('🏆 تحدي السنة', '🏆 Yearly Goal'), el: challengeCard },
      { id: 'quotes', label: tx('✍️ اقتباساتي', '✍️ Quotes'), el: quotesCard }
    ];

    const segBar = document.getElementById('v38BookSegBar');
    if (segBar) {
      segBar.innerHTML = tabs.map(t => `
        <button type="button" class="v38-seg-btn ${activeBookTool === t.id ? 'active' : ''}" data-btool="${t.id}">${t.label}</button>
      `).join('');
      segBar.querySelectorAll('[data-btool]').forEach(b => {
        b.onclick = () => {
          activeBookTool = b.dataset.btool;
          try { LS.setItem('khatwati-v38-book-tool', activeBookTool); } catch {}
          organizeBookSubtools();
        };
      });
    }

    tabs.forEach(t => {
      if (t.el) t.el.classList.toggle('v38-hidden-tool', activeBookTool !== t.id);
    });
  }

  // 5. Organize Study Extra Tools into a clean iOS Segmented Switcher BELOW Study Plans
  function organizeStudySubtools() {
    const studySection = document.getElementById('studySection');
    if (!studySection) return;

    const examCard = document.getElementById('examCountdownCard');
    const fcCard = document.getElementById('v36FlashcardsCard');
    const gpaCard = document.getElementById('v37GpaCard');
    const ttCard = document.getElementById('v37TimetableCard');
    if (!examCard && !fcCard && !gpaCard && !ttCard) return;

    let wrap = document.getElementById('v38StudySubtools');
    if (!wrap) {
      studySection.insertAdjacentHTML('beforeend', `
        <div class="v38-subtools-wrap" id="v38StudySubtools">
          <div class="v38-subtools-header">
            <h3 id="v38StudyToolsTitle">🎓 ${tx('أدوات الدراسة والمراجعة', 'Study & Review Tools')}</h3>
          </div>
          <div class="v38-seg-bar" id="v38StudySegBar"></div>
          <div id="v38StudyToolsBody"></div>
        </div>
      `);
      wrap = document.getElementById('v38StudySubtools');
    }

    const body = document.getElementById('v38StudyToolsBody');
    [examCard, fcCard, gpaCard, ttCard].forEach(el => {
      if (el && el.parentElement !== body) body.appendChild(el);
    });

    const titleEl = document.getElementById('v38StudyToolsTitle');
    if (titleEl) titleEl.textContent = '🎓 ' + tx('أدوات الدراسة والمراجعة', 'Study & Review Tools');

    const tabs = [
      { id: 'exams', label: tx('⏳ الامتحانات', '⏳ Exams'), el: examCard },
      { id: 'flashcards', label: tx('🗂️ البطاقات', '🗂️ Cards'), el: fcCard },
      { id: 'gpa', label: tx('🎓 المعدل', '🎓 GPA'), el: gpaCard },
      { id: 'timetable', label: tx('📅 الجدول', '📅 Schedule'), el: ttCard }
    ];

    const segBar = document.getElementById('v38StudySegBar');
    if (segBar) {
      segBar.innerHTML = tabs.map(t => `
        <button type="button" class="v38-seg-btn ${activeStudyTool === t.id ? 'active' : ''}" data-stool="${t.id}">${t.label}</button>
      `).join('');
      segBar.querySelectorAll('[data-stool]').forEach(b => {
        b.onclick = () => {
          activeStudyTool = b.dataset.stool;
          try { LS.setItem('khatwati-v38-study-tool', activeStudyTool); } catch {}
          organizeStudySubtools();
        };
      });
    }

    tabs.forEach(t => {
      if (t.el) t.el.classList.toggle('v38-hidden-tool', activeStudyTool !== t.id);
    });
  }

  function syncAllV38() {
    organizeGoalCardsForIphone();
    setupFilterToggle();
    organizeGoalSubtools();
    organizeBookSubtools();
    organizeStudySubtools();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV38);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v38FilterToggleBtn')?.remove();
        syncAllV38();
      }, 180);
    }
  });

  syncAllV38();
})();
</script>

<script id="v39-upgrade-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };

  const META_KEY = 'khatwati-goal-meta-v1';
  // Days of week ordered Sunday(0) to Saturday(6)
  const DAYS_LIST = [
    { d: 0, arShort: 'ح', arFull: 'الأحد', enShort: 'Sun', enFull: 'Sun' },
    { d: 1, arShort: 'ن', arFull: 'الاثنين', enShort: 'Mon', enFull: 'Mon' },
    { d: 2, arShort: 'ث', arFull: 'الثلاثاء', enShort: 'Tue', enFull: 'Tue' },
    { d: 3, arShort: 'ر', arFull: 'الأربعاء', enShort: 'Wed', enFull: 'Wed' },
    { d: 4, arShort: 'خ', arFull: 'الخميس', enShort: 'Thu', enFull: 'Thu' },
    { d: 5, arShort: 'ج', arFull: 'الجمعة', enShort: 'Fri', enFull: 'Fri' },
    { d: 6, arShort: 'س', arFull: 'السبت', enShort: 'Sat', enFull: 'Sat' }
  ];

  let selectedGoalDays = []; // empty array or 7 items = all days
  let onlyTodayScheduled = false;

  // 1. Sync bottom bar & browser theme-color meta tag whenever theme changes
  function syncBottomBarTheme() {
    const computedGreen = getComputedStyle(document.documentElement).getPropertyValue('--green').trim();
    const computedPaper = getComputedStyle(document.documentElement).getPropertyValue('--paper').trim();
    const metaTheme = document.querySelector('meta[name="theme-color"]');
    if (metaTheme && computedPaper) {
      metaTheme.setAttribute('content', document.body.dataset.dark === 'true' ? '#0f1714' : computedPaper);
    }
    const dock = document.querySelector('.view-switch');
    if (dock && computedGreen) {
      dock.style.setProperty('--dock-accent', computedGreen);
    }
  }

  const origChooseTheme = window.chooseTheme;
  if (typeof origChooseTheme === 'function') {
    window.chooseTheme = function(name) {
      origChooseTheme(name);
      syncBottomBarTheme();
    };
  }

  // 2. Inject Custom Days Selector into #goalForm
  function injectCustomDaysField() {
    const form = document.getElementById('goalForm');
    if (!form || document.getElementById('v39GoalDaysWrap')) return;
    const submitBtn = form.querySelector('.submit');
    if (!submitBtn) return;

    submitBtn.insertAdjacentHTML('beforebegin', `
      <div class="v39-days-wrap" id="v39GoalDaysWrap">
        <div class="v39-days-head">
          <label id="v39DaysTitle">${tx('أيام الهدف بالأسبوع', 'Goal days of the week')}</label>
          <button type="button" class="v39-days-all-btn is-all" id="v39AllDaysBtn">${tx('كل الأيام ✓', 'All days ✓')}</button>
        </div>
        <div class="v39-days-grid" id="v39DaysGrid"></div>
        <p class="v39-days-hint" id="v39DaysHint"></p>
      </div>
    `);

    document.getElementById('v39AllDaysBtn').onclick = () => {
      selectedGoalDays = [];
      paintDaysSelector();
    };
    paintDaysSelector();
  }

  function paintDaysSelector() {
    const grid = document.getElementById('v39DaysGrid');
    const allBtn = document.getElementById('v39AllDaysBtn');
    const titleEl = document.getElementById('v39DaysTitle');
    const hintEl = document.getElementById('v39DaysHint');
    if (!grid) return;

    const isAll = !selectedGoalDays || selectedGoalDays.length === 0 || selectedGoalDays.length === 7;
    if (titleEl) titleEl.textContent = tx('أيام الهدف بالأسبوع', 'Goal days of the week');
    if (allBtn) {
      allBtn.classList.toggle('is-all', isAll);
      allBtn.textContent = isAll ? tx('كل الأيام ✓', 'All days ✓') : tx('تحديد كل الأيام', 'Select all days');
    }

    grid.innerHTML = DAYS_LIST.map(day => {
      const active = !isAll && selectedGoalDays.includes(day.d);
      return `
        <button type="button" class="v39-day-btn ${active ? 'selected' : ''}" data-day-num="${day.d}" aria-pressed="${active}">
          <span>${isEn() ? day.enShort : day.arShort}</span>
          <small>${isEn() ? day.enFull : day.arFull}</small>
        </button>
      `;
    }).join('');

    grid.querySelectorAll('[data-day-num]').forEach(btn => {
      btn.onclick = () => {
        const dNum = Number(btn.dataset.dayNum);
        if (!selectedGoalDays || selectedGoalDays.length === 7) selectedGoalDays = [];
        if (selectedGoalDays.includes(dNum)) {
          selectedGoalDays = selectedGoalDays.filter(x => x !== dNum);
        } else {
          selectedGoalDays = [...selectedGoalDays, dNum].sort((a, b) => a - b);
        }
        if (selectedGoalDays.length === 7) selectedGoalDays = [];
        paintDaysSelector();
      };
    });

    if (hintEl) {
      if (isAll) {
        hintEl.textContent = tx('الهدف مفعّل لكل أيام الأسبوع (اضغط على أيام معينة لتخصيصه).', 'Scheduled for every day of the week (tap specific days to customize).');
      } else {
        const names = selectedGoalDays.map(d => {
          const obj = DAYS_LIST.find(x => x.d === d);
          return isEn() ? obj.enFull : obj.arFull;
        }).join(isEn() ? ', ' : '، ');
        hintEl.textContent = tx('مخصص لأيام: ', 'Scheduled on: ') + names;
      }
    }
  }

  // Hook window.openForm to load saved custom days for the goal being edited
  const prevOpenForm = window.openForm;
  if (typeof prevOpenForm === 'function') {
    window.openForm = function(g = null) {
      injectCustomDaysField();
      const meta = safeGet(META_KEY, {});
      const id = g?.id || '';
      const savedDays = (g && Array.isArray(g.days)) ? g.days : (meta[id]?.days || []);
      selectedGoalDays = Array.isArray(savedDays) && savedDays.length < 7 ? [...savedDays] : [];
      paintDaysSelector();
      prevOpenForm(g);
    };
  }

  // Save custom days when submitting #goalForm
  const goalForm = document.getElementById('goalForm');
  if (goalForm) {
    goalForm.addEventListener('submit', () => {
      const daysToSave = (Array.isArray(selectedGoalDays) && selectedGoalDays.length > 0 && selectedGoalDays.length < 7)
        ? [...selectedGoalDays].sort((a, b) => a - b)
        : [];
      setTimeout(() => {
        try {
          const allGoals = safeGet('khatwati-goals-v1', []);
          const idInput = document.getElementById('goalId')?.value;
          const targetGoal = idInput ? allGoals.find(x => x.id === idInput) : allGoals[allGoals.length - 1];
          if (targetGoal) {
            targetGoal.days = daysToSave;
            safeSet('khatwati-goals-v1', allGoals);
            try {
              if (typeof goals !== 'undefined' && Array.isArray(goals)) {
                const memGoal = goals.find(x => x.id === targetGoal.id);
                if (memGoal) memGoal.days = daysToSave;
              }
            } catch {}
            const meta = safeGet(META_KEY, {});
            meta[targetGoal.id] = {
              ...(meta[targetGoal.id] || { category: 'habit', priority: 'normal' }),
              days: daysToSave
            };
            safeSet(META_KEY, meta);
            decorateGoalCustomDays();
          }
        } catch {}
      }, 30);
    });
  }

  // 3. Display Custom Days Badge on Goal Cards & Today's Schedule Filter
  function getGoalDays(goalId, allGoals, meta) {
    const g = allGoals.find(x => x.id === goalId);
    if (g && Array.isArray(g.days) && g.days.length > 0 && g.days.length < 7) return g.days;
    const mDays = meta[goalId]?.days;
    if (Array.isArray(mDays) && mDays.length > 0 && mDays.length < 7) return mDays;
    return [];
  }

  function installTodayScheduleFilterPill() {
    const filterBar = document.getElementById('goalFilterBar');
    if (!filterBar || document.getElementById('v39TodayFilterBtn')) return;
    filterBar.insertAdjacentHTML('beforeend', `
      <button type="button" class="v35-pill ${onlyTodayScheduled ? 'active' : ''}" id="v39TodayFilterBtn">
        📅 ${tx('المجدول لليوم فقط', 'Scheduled today only')}
      </button>
    `);
    document.getElementById('v39TodayFilterBtn').onclick = () => {
      onlyTodayScheduled = !onlyTodayScheduled;
      document.getElementById('v39TodayFilterBtn')?.classList.toggle('active', onlyTodayScheduled);
      decorateGoalCustomDays();
    };
  }

  function decorateGoalCustomDays() {
    installTodayScheduleFilterPill();
    const allGoals = safeGet('khatwati-goals-v1', []);
    const meta = safeGet(META_KEY, {});
    const todayDow = new Date().getDay();

    document.querySelectorAll('#goalList .goal').forEach(card => {
      const id = card.dataset.goalId || card.querySelector('.goal-actions button[onclick*="editGoal"]')?.getAttribute('onclick')?.match(/editGoal\('([^']+)'\)/)?.[1];
      if (!id) return;
      const days = getGoalDays(id, allGoals, meta);
      const badgeBox = card.querySelector('.v35-goal-badges');
      card.querySelectorAll('.v39-custom-days-badge').forEach(el => el.remove());

      const isScheduledToday = days.length === 0 || days.includes(todayDow);
      card.classList.toggle('v39-rest-day', !isScheduledToday);

      if (days.length > 0 && badgeBox) {
        const dayNames = days.map(d => {
          const obj = DAYS_LIST.find(x => x.d === d);
          return obj ? (isEn() ? obj.enShort : obj.arFull) : '';
        }).filter(Boolean).join(isEn() ? ' · ' : ' · ');

        const tag = document.createElement('span');
        tag.className = `v35-tag ${isScheduledToday ? 'days-tag' : 'rest-day-tag'} v39-custom-days-badge`;
        tag.textContent = `📅 ${dayNames}${!isScheduledToday ? (isEn() ? ' (Rest today)' : ' (غير مجدول اليوم)') : ''}`;
        badgeBox.appendChild(tag);
      }

      if (onlyTodayScheduled && !isScheduledToday) {
        card.style.display = 'none';
      }
    });
  }

  function syncAllV39() {
    syncBottomBarTheme();
    injectCustomDaysField();
    decorateGoalCustomDays();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV39);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v39TodayFilterBtn')?.remove();
        paintDaysSelector();
        syncAllV39();
      }, 190);
    }
  });

  syncAllV39();
})();
</script>

  function getSurahForPage(page) {
    let current = SURAHS[0];
    for (const s of SURAHS) {
      if (page >= s.p) current = s;
      else break;
    }
    return current;
  }

  function getJuzForPage(page) {
    if (page <= 1) return 1;
    return Math.min(30, Math.floor((page - 2) / 20) + 1);
  }

  // 1. Enhance #v37DailyQuoteBanner into "آية اليوم" (Daily Ayah Banner) with quick button to Quran Tracker
  function upgradeDailyAyahBanner() {
    const banner = document.getElementById('v37DailyQuoteBanner');
    if (!banner) return;
    const body = banner.querySelector('.v37-quote-body');
    const actions = banner.querySelector('.v37-quote-actions');
    const nextBtn = document.getElementById('v37NextQuoteBtn');
    if (nextBtn) {
      nextBtn.title = tx('آية أخرى', 'Another Ayah');
      nextBtn.setAttribute('aria-label', nextBtn.title);
    }
    if (body && !body.querySelector('.v40-ayah-kicker')) {
      const iconSpan = body.querySelector('span:first-child');
      if (iconSpan) iconSpan.textContent = '📖';
      const quoteText = document.getElementById('v37QuoteText');
      if (quoteText && !quoteText.parentElement.classList.contains('v40-ayah-wrap')) {
        const wrap = document.createElement('div');
        wrap.className = 'v40-ayah-wrap';
        wrap.innerHTML = `<span class="v40-ayah-kicker">✨ ${tx('آية اليوم', 'Daily Quranic Verse')}</span>`;
        quoteText.before(wrap);
        wrap.appendChild(quoteText);
      }
    }
    if (actions && !document.getElementById('v40OpenQuranBtn')) {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.id = 'v40OpenQuranBtn';
      btn.className = 'v40-open-quran-btn';
      btn.innerHTML = `📖 ${tx('الورد والختمة', 'Quran Wird')}`;
      btn.onclick = () => {
        const quranCard = document.getElementById('v40QuranCard');
        if (quranCard) {
          quranCard.classList.remove('v38-hidden-tool');
          quranCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
      };
      actions.prepend(btn);
    }
  }

    if (!goalSection || !subtools || document.getElementById('v40QuranCard')) return;

    subtools.insertAdjacentHTML('beforebegin', `<section class="v40-quran-card" id="v40QuranCard" style="margin-top:16px"></section>`);
    renderQuranCard();
  }

  function renderQuranCard() {
    const card = document.getElementById('v40QuranCard');
    if (!card) return;
    const state = safeGet(QURAN_KEY, {
      page: 1,
      dailyTarget: 4,
      khatmasCompleted: 0,
      todayPages: {},
      selectedPassage: 'fatiha'
    });
    const page = Math.max(1, Math.min(604, Number(state.page) || 1));
    const dailyTarget = Math.max(1, Number(state.dailyTarget) || 4);
    const todayKey = dateStr();
    const readToday = Number(state.todayPages?.[todayKey]) || 0;
    const juz = getJuzForPage(page);
    const surah = getSurahForPage(page);
    const pct = Math.min(100, Math.round((page / 604) * 100));
    const pagesLeft = 604 - page;
    const daysLeft = Math.ceil(pagesLeft / dailyTarget);
    const passage = OFFLINE_PASSAGES.find(p => p.id === state.selectedPassage) || OFFLINE_PASSAGES[0];

    card.innerHTML = `
      <div class="v40-quran-head">
        <div>
          <h3>📖 ${tx('القرآن الكريم ومتتبع الختمة', 'Noble Quran & Khatma Tracker')}</h3>
          <p style="margin:3px 0 0;font-size:12px;color:var(--muted)">
            ${tx('ورد اليوم:', 'Today’s Wird:')} <strong style="color:var(--green)">${readToday} / ${dailyTarget} ${tx('صفحة', 'pages')}</strong>
            · ${pagesLeft === 0 ? tx('تمت الختمة بحمد الله! 🎉', 'Khatma Complete! 🎉') : `${tx('باقي', 'Left:')} ${pagesLeft} ${tx('صفحة', 'pages')} (~${daysLeft} ${tx('يوم للختم', 'days')})`}
          </p>
        </div>
        <div style="display:flex;gap:6px;align-items:center">
          ${state.khatmasCompleted > 0 ? `<span class="v35-tag">🏆 ${state.khatmasCompleted} ${tx('ختمة', 'Khatma')}</span>` : ''}
          <span class="v35-tag" style="font-size:13px">${pct}%</span>
        </div>
      </div>

      <div class="book-bar" style="margin:8px 0 12px"><i style="width:${pct}%"></i></div>

      <div class="v40-khatma-stats">
        <div class="v40-khatma-stat">
          <span>🔖 ${tx('علامة الوقف (الصفحة)', 'Current Page')}</span>
          <strong>${page} <small style="font-weight:500;color:var(--muted)">/ 604</small></strong>
        </div>
        <div class="v40-khatma-stat">
          <span>🧭 ${tx('الجزء الحالي', 'Current Juz')}</span>
          <strong>${tx('الجزء', 'Juz')} ${juz}</strong>
        </div>
        <div class="v40-khatma-stat">
          <span>🕌 ${tx('السورة', 'Surah')}</span>
          <strong>${isEn() ? surah.en : 'سورة ' + surah.ar}</strong>
        </div>
      </div>

      <div class="v40-quran-controls">
        <div class="v40-q-step-group">
          <button type="button" class="v40-q-btn" id="v40PageMinus">−</button>
          <button type="button" class="v40-q-btn primary" id="v40PagePlus1">＋ ${tx('صفحة', '1 Page')}</button>
          <button type="button" class="v40-q-btn" id="v40PagePlusWird">＋ ${tx('ورد اليوم', 'Daily Wird')} (${dailyTarget})</button>
          <button type="button" class="v40-q-btn" id="v40PagePlusJuz">＋ ${tx('جزء (٢٠ ص)', 'Juz (20p)')}</button>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <select id="v40SurahJump" class="v35-search-input" style="padding:6px 8px;font-size:12px;width:auto" aria-label="${tx('انتقال إلى سورة', 'Jump to Surah')}">
            <option value="">${tx('انتقل إلى سورة / صفحة...', 'Jump to Surah...')}</option>
            ${SURAHS.map(s => `<option value="${s.p}" ${s.n === surah.n ? 'selected' : ''}>${s.n}. ${isEn() ? s.en : s.ar} (${tx('ص', 'p.')}${s.p})</option>`).join('')}
          </select>
        </div>
      </div>

      <details class="v40-surah-reader">
        <summary style="cursor:pointer;font-weight:700;font-size:13px;color:var(--green);list-style:none;display:flex;justify-content:space-between;align-items:center">
          <span>✨ ${tx('قراءة السور والأوراد المحفوظة (بدون إنترنت)', 'Read Offline Surahs & Daily Awrad')}</span>
          <span style="font-size:11px;color:var(--muted)">▼</span>
        </summary>
        <div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:10px">
          ${OFFLINE_PASSAGES.map(p => `
            <button type="button" class="v35-pill ${p.id === passage.id ? 'active' : ''}" data-passage-id="${p.id}">
              ${isEn() ? p.titleEn : p.titleAr}
            </button>
          `).join('')}
        </div>
        <div class="v40-surah-box">
          ${passage.bismillah ? `<div class="v40-bismillah">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : ''}
          <div class="v40-ayat-text">${passage.text}</div>
        </div>
      </details>
    `;

    function stepQuranPages(delta) {
      const s = safeGet(QURAN_KEY, { page: 1, dailyTarget: 4, khatmasCompleted: 0, todayPages: {}, selectedPassage: 'fatiha' });
      const before = Number(s.page) || 1;
      let next = before + delta;
      if (next > 604) {
        s.khatmasCompleted = (Number(s.khatmasCompleted) || 0) + 1;
        next = 1;
        if (window.khatwatiCelebrate) window.khatwatiCelebrate();
        window.khatwatiNotice(tx('مبارك! أتممت ختمة القرآن الكريم كاملة وتقبل الله طاعتك 🕋🎉', 'Mubarak! You completed a full Khatma of the Noble Quran 🕋🎉'));
      } else {
        next = Math.max(1, Math.min(604, next));
      }
      s.page = next;
      if (delta > 0) {
        s.todayPages = s.todayPages || {};
        s.todayPages[todayKey] = (Number(s.todayPages[todayKey]) || 0) + delta;
        if (s.todayPages[todayKey] === s.dailyTarget && window.khatwatiCelebrate) window.khatwatiCelebrate();
      }
      safeSet(QURAN_KEY, s);
      renderQuranCard();
    }

    document.getElementById('v40PageMinus').onclick = () => stepQuranPages(-1);
    document.getElementById('v40PagePlus1').onclick = () => stepQuranPages(1);
    document.getElementById('v40PagePlusWird').onclick = () => stepQuranPages(dailyTarget);
    document.getElementById('v40PagePlusJuz').onclick = () => stepQuranPages(20);

    document.getElementById('v40SurahJump').onchange = e => {
      const targetPage = Number(e.target.value);
      if (!targetPage) return;
      const s = safeGet(QURAN_KEY, { page: 1, dailyTarget: 4, khatmasCompleted: 0, todayPages: {}, selectedPassage: 'fatiha' });
      s.page = targetPage;
      safeSet(QURAN_KEY, s);
      renderQuranCard();
      window.khatwatiNotice(tx(`تم نقل علامة الوقف إلى صفحة ${targetPage} 🔖`, `Bookmark moved to page ${targetPage} 🔖`));
    };

    card.querySelectorAll('[data-passage-id]').forEach(btn => {
      btn.onclick = () => {
        const s = safeGet(QURAN_KEY, { page: 1, dailyTarget: 4, khatmasCompleted: 0, todayPages: {}, selectedPassage: 'fatiha' });
        s.selectedPassage = btn.dataset.passageId;
        safeSet(QURAN_KEY, s);
        renderQuranCard();
        const detailsEl = card.querySelector('.v40-surah-reader');
        if (detailsEl) detailsEl.open = true;
      };
    });
  }

  function syncAllV40() {
    upgradeDailyAyahBanner();
    installQuranCard();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV40);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('v40QuranCard')?.remove();
        document.getElementById('v40OpenQuranBtn')?.remove();
        syncAllV40();
      }, 200);
    }
  });

  syncAllV40();
})();
</script>

  const AYAH_STATE_KEY = 'khatwati-daily-ayah-v41';
  let currentSurahNum = 94;
