          fBtn.classList.remove('v46-timer-running');
          fBtn.style.setProperty('--v46-fill', '0%');
        }
      }
    } catch {}

    // C. Exam & Deadline Countdowns (#examList .v35-todo-item & .v35-exam-days)
    try {
      const exams = safeGet('khatwati-exams-v1', []).sort((a, b) => a.date.localeCompare(b.date));
      const items = document.querySelectorAll('#examList .v35-todo-item');
      const now = new Date(); now.setHours(0,0,0,0);
      items.forEach((itemEl, idx) => {
        const ex = exams[idx];
        if (!ex) return;
        const target = new Date(ex.date + 'T00:00:00');
        const diffDays = Math.ceil((target - now) / 86400000);
        const shadePct = diffDays <= 0 ? 100 : Math.max(18, Math.min(96, Math.round(100 - (diffDays / 30) * 82)));
        itemEl.style.setProperty('--v46-fill', shadePct + '%');
        const badge = itemEl.querySelector('.v35-exam-days');
        if (badge) {
          badge.style.setProperty('--v46-fill', shadePct + '%');
        }
      });
    } catch {}

    // D. Multi-step Goal Check Buttons (.check) & Count Pills (.count) + Study Step Buttons
    try {
      const allGoals = safeGet('khatwati-goals-v1', []);
      document.querySelectorAll('#goalList .goal').forEach(card => {
        const id = card.dataset.goalId;
        const g = allGoals.find(x => x.id === id);
        if (!g) return;
        const cur = typeof count === 'function' ? count(g) : 0;
        const pct = g.target ? Math.min(100, Math.round((cur / g.target) * 100)) : 0;
        const checkBtn = card.querySelector('.check');
        if (checkBtn && !card.classList.contains('done')) {
          checkBtn.classList.add('v46-shaded-check');
          checkBtn.style.setProperty('--v46-fill', pct + '%');
        }
        const countEl = card.querySelector('.count');
        if (countEl && g.target > 1) {
          countEl.classList.add('v46-shaded-btn');
          countEl.style.setProperty('--v46-fill', pct + '%');
        }
      });

      const studyPlans = safeGet('khatwati-study-v1', []);
      document.querySelectorAll('#studySection .study-plan').forEach(card => {
        const stepBtn = card.querySelector('[data-study-step="1"]');
        const id = stepBtn?.dataset.id;
        const p = studyPlans.find(x => x.id === id);
        if (stepBtn && p && p.total > 0) {
          const pct = Math.min(100, Math.round((p.current / p.total) * 100));
          stepBtn.classList.add('v46-shaded-btn');
          stepBtn.style.setProperty('--v46-fill', pct + '%');
        }
      });
    } catch {}
  };

  setInterval(paintAllShadedCountdownsAndButtons, 500);

  // =========================================================================
  // 3. Cloud Sync Anywhere (☁️ مزامنة سحابية برمزك الشخصي + رابط/كود فوري)
  // =========================================================================
  const SYNC_CONFIG_KEY = 'khatwati-cloud-sync-v1';
  const SYNC_DATA_KEYS = [
    'khatwati-goals-v1','khatwati-books-v1','khatwati-language','khatwati-theme','khatwati-daily-theme',
    'khatwati-theme-override','khatwati-reminder-v1','khatwati-goal-notes-v1','khatwati-focus-v1',
    'khatwati-study-v1','khatwati-study-duration-v1','khatwati-study-scene','khatwati-ui-scale-v1',
    'khatwati-dark-mode','khatwati-goal-meta-v1','khatwati-todos-v1','khatwati-exams-v1',
    'khatwati-wellness-v1','khatwati-book-quotes-v1','khatwati-reading-challenge-v1',
    'khatwati-flashcards-v1','khatwati-subtasks-v1','khatwati-tasbeeh-v1','khatwati-gpa-v1',
    'khatwati-timetable-v1','khatwati-quran-v1','khatwati-archive-v1','khatwati-study-notes-v1'
  ];

  function collectSyncPayload() {
    const data = {};
    SYNC_DATA_KEYS.forEach(k => {
      const v = LS.getItem(k);
      if (v !== null) data[k] = v;
    });
    return { updatedAt: Date.now(), version: 'v46', data };
  }

  function applySyncPayload(payload, silent = false) {
    if (!payload || !payload.data || typeof payload.data !== 'object') return false;
    Object.entries(payload.data).forEach(([k, v]) => {
      if (SYNC_DATA_KEYS.includes(k) && typeof v === 'string') {
        LS.setItem(k, v);
      }
    });
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    cfg.lastSyncedAt = payload.updatedAt || Date.now();
    safeSet(SYNC_CONFIG_KEY, cfg);

    try {
      if (typeof goals !== 'undefined') goals = JSON.parse(LS.getItem('khatwati-goals-v1') || '[]');
      if (typeof window.render === 'function') window.render();
      if (typeof window.drawBooks === 'function') window.drawBooks();
    } catch {}
    if (!silent) {
      window.khatwatiNotice(tx('☁️ تمت مزامنة بياناتك بنجاح!', '☁️ Your data is synced!'));
    }
    updateSyncButtonState();
    return true;
  }

  async function pushToCloudSync(customCode) {
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    const code = (customCode || cfg.syncCode || '').trim().toLowerCase();
    if (!code) return false;
    const payload = collectSyncPayload();
    cfg.syncCode = code;
    cfg.lastSyncedAt = payload.updatedAt;
    safeSet(SYNC_CONFIG_KEY, cfg);
    updateSyncButtonState();

    let ok = false;
    try {
      const topic = 'khatwati-sync-' + encodeURIComponent(code.replace(/[^a-z0-9_-]/gi, ''));
      const res = await fetch(`https://ntfy.sh/${topic}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      if (res.ok) ok = true;
    } catch {}
    return ok;
  }

  async function pullFromCloudSync(customCode, silent = false) {
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    const code = (customCode || cfg.syncCode || '').trim().toLowerCase();
    if (!code) return false;
    cfg.syncCode = code;
    safeSet(SYNC_CONFIG_KEY, cfg);
    updateSyncButtonState();

    try {
      const topic = 'khatwati-sync-' + encodeURIComponent(code.replace(/[^a-z0-9_-]/gi, ''));
      const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=all`);
      if (res.ok) {
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        if (lines.length > 0) {
          const lastMsg = JSON.parse(lines[lines.length - 1]);
          const payload = JSON.parse(lastMsg.message);
          if (payload && payload.data) {
            applySyncPayload(payload, silent);
            return true;
          }
        }
      }
    } catch {}
    return false;
  }

  function installCloudSyncHeaderBtn() {
    const topRight = document.querySelector('.top > div:last-child');
    if (!topRight || document.getElementById('v46CloudSyncBtn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'v46CloudSyncBtn';
    btn.className = 'v46-sync-header-btn';
    btn.onclick = openCloudSyncModal;
    topRight.prepend(btn);
    updateSyncButtonState();
  }

  function updateSyncButtonState() {
    const btn = document.getElementById('v46CloudSyncBtn');
    if (!btn) return;
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    const isLinked = !!cfg.syncCode;
    btn.classList.toggle('synced', isLinked);
    btn.title = tx('مزامنة بياناتك في أي مكان', 'Sync your data anywhere');
    btn.setAttribute('aria-label', btn.title);
    btn.innerHTML = `<span class="v46-sync-dot"></span>☁️ ${tx('مزامنة', 'Sync')}`;
  }

  function encodeInstantToken() {
    const json = JSON.stringify(collectSyncPayload());
    return btoa(unescape(encodeURIComponent(json)));
  }

  function decodeInstantToken(tokenStr) {
    try {
      let clean = String(tokenStr || '').trim();
      if (clean.includes('#khatwati_sync=')) {
        clean = clean.split('#khatwati_sync=')[1];
      }
      const json = decodeURIComponent(escape(atob(clean)));
      return JSON.parse(json);
    } catch {
      return null;
    }
  }

  function openCloudSyncModal() {
    document.getElementById('v46SyncModalOverlay')?.remove();
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    const currentCode = cfg.syncCode || '';

    document.body.insertAdjacentHTML('beforeend', `
      <div class="overlay show" id="v46SyncModalOverlay">
        <div class="dialog" style="max-width:430px">
          <div class="dialog-head">
            <h3>☁️ ${tx('مزامنة خطوتي في أي مكان', 'Sync Khatwati Anywhere')}</h3>
            <button type="button" class="close" id="v46CloseSyncModal">×</button>
          </div>

          <div class="v46-sync-box">
            <strong style="font-size:13.5px;display:block;margin-bottom:4px">1. ${tx('المزامنة السحابية برمزك الشخصي (بين كل أجهزتك)', 'Cloud Sync with Personal Code')}</strong>
            <p style="margin:0 0 8px;font-size:12px;color:var(--muted);line-height:1.5">
              ${tx('اكتب رمز خاص بيك (مثل اسمك ورقم) واضغط حفظ؛ ومن تفتح البرنامج بأي مكان ثاني اكتب نفس الرمز وراح تنزل كل أهدافك وكتبك وختمتك فوراً.', 'Enter a personal sync code (e.g. yourname-99). Enter the same code wherever you open the app to sync everything.')}
            </p>
            <input type="text" id="v46SyncCodeInput" class="field v46-sync-code-input" placeholder="مثلاً: ali-khatwati-2026" value="${currentCode}">
            <div style="display:flex;gap:7px;margin-top:8px">
              <button type="button" class="btn" id="v46PushCloudBtn" style="flex:1;padding:10px">☁️ ${tx('رفع وحفظ بالسحابة', 'Save to Cloud')}</button>
              <button type="button" class="btn secondary" id="v46PullCloudBtn" style="flex:1;padding:10px">📥 ${tx('جلب من السحابة', 'Pull from Cloud')}</button>
            </div>
          </div>

          <div class="v46-sync-box" style="margin-bottom:0">
            <strong style="font-size:13.5px;display:block;margin-bottom:4px">2. ${tx('رابط / كود النقل الفوري (بدون سحابة)', 'Instant Sync Link / Token')}</strong>
            <p style="margin:0 0 8px;font-size:12px;color:var(--muted);line-height:1.5">
              ${tx('انسخ كود المزامنة الفوري أو الرابط لتفتح بياناتك مباشرة بين Safari وتطبيق الشاشة الرئيسية بالآيفون:', 'Copy an instant sync link or token to transfer data immediately between Safari and your Home Screen app:')}
            </p>
            <div style="display:flex;gap:7px">
              <button type="button" class="v35-pill active" id="v46CopySyncLinkBtn" style="flex:1;padding:9px">🔗 ${tx('نسخ رابط المزامنة', 'Copy Sync Link')}</button>
              <button type="button" class="v35-pill" id="v46PasteSyncTokenBtn" style="flex:1;padding:9px">📋 ${tx('لصق كود مزامنة', 'Paste Sync Token')}</button>
            </div>
          </div>
        </div>
      </div>
    `);

    document.getElementById('v46CloseSyncModal').onclick = () => document.getElementById('v46SyncModalOverlay')?.remove();
    document.getElementById('v46SyncModalOverlay').onclick = e => { if (e.target.id === 'v46SyncModalOverlay') e.currentTarget.remove(); };

    document.getElementById('v46PushCloudBtn').onclick = async () => {
      const code = document.getElementById('v46SyncCodeInput').value.trim();
      if (!code || code.length < 4) {
        window.khatwatiNotice(tx('اكتب رمز مزامنة من 4 حروف أو أرقام على الأقل', 'Enter a sync code of at least 4 characters'));
        return;
      }
      window.khatwatiNotice(tx('⏳ جاري رفع بياناتك للسحابة...', '⏳ Uploading to cloud...'));
      const ok = await pushToCloudSync(code);
      if (ok) {
        window.khatwatiNotice(tx(`☁️ تم حفظ ومزامنة بياناتك بالرمز (${code}) بنجاح!`, `☁️ Data synced with code (${code})!`));
        document.getElementById('v46SyncModalOverlay')?.remove();
      } else {
        window.khatwatiNotice(tx('تعذر الاتصال بالسحابة حالياً، استخدم «نسخ رابط المزامنة» الفوري.', 'Cloud unreachable; use Copy Sync Link instead.'));
      }
    };

    document.getElementById('v46PullCloudBtn').onclick = async () => {
      const code = document.getElementById('v46SyncCodeInput').value.trim();
      if (!code || code.length < 4) {
        window.khatwatiNotice(tx('اكتب رمز المزامنة أولاً', 'Enter your sync code first'));
        return;
      }
      window.khatwatiNotice(tx('⏳ جاري جلب بياناتك من السحابة...', '⏳ Pulling from cloud...'));
      const ok = await pullFromCloudSync(code, false);
      if (ok) {
        document.getElementById('v46SyncModalOverlay')?.remove();
        setTimeout(() => location.reload(), 400);
      } else {
        window.khatwatiNotice(tx('ماكو بيانات محفوظة بهذا الرمز بعد أو لا يوجد اتصال بالإنترنت.', 'No data found for this code yet or offline.'));
      }
    };

    document.getElementById('v46CopySyncLinkBtn').onclick = () => {
      const token = encodeInstantToken();
      const baseUrl = location.href.split('#')[0];
      const fullLink = `${baseUrl}#khatwati_sync=${token}`;
      window.khatwatiCopyFallback(fullLink, tx('🔗 تم نسخ رابط المزامنة الفوري! افتحه بأي متصفح أو جهاز لتنزل بياناتك فوراً', '🔗 Sync link copied! Open it anywhere to sync immediately'));
    };

    document.getElementById('v46PasteSyncTokenBtn').onclick = () => {
      document.getElementById('v46SyncModalOverlay')?.remove();
      window.khatwatiPrompt(
        tx('لصق رابط أو كود المزامنة الفوري:', 'Paste Sync Link or Token:'),
        '',
        val => {
          if (!val) return;
          const payload = decodeInstantToken(val);
          if (payload && applySyncPayload(payload, false)) {
            setTimeout(() => location.reload(), 400);
          } else {
            window.khatwatiNotice(tx('الكود أو الرابط غير صالح', 'Invalid sync token or link'));
          }
        }
      );
    };
  }

  if (location.hash && location.hash.startsWith('#khatwati_sync=')) {
    const payload = decodeInstantToken(location.hash);
    if (payload) {
      applySyncPayload(payload, false);
      history.replaceState(null, '', location.pathname + location.search);
    }
  }

  let cloudPushDebounce = null;
  function scheduleAutoCloudPush() {
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    if (!cfg.syncCode) return;
    clearTimeout(cloudPushDebounce);
    cloudPushDebounce = setTimeout(() => {
      pushToCloudSync(cfg.syncCode);
    }, 2500);
  }

  window.addEventListener('storage', e => {
    if (e.key && SYNC_DATA_KEYS.includes(e.key)) {
      try {
        if (typeof goals !== 'undefined') goals = JSON.parse(LS.getItem('khatwati-goals-v1') || '[]');
        if (typeof window.render === 'function') window.render();
      } catch {}
    }
  });

  function syncAllV46() {
    installCloudSyncHeaderBtn();
    updateSyncButtonState();
    paintAllShadedCountdownsAndButtons();
    if (document.body.dataset.activeView === 'quran') {
      const sel = document.getElementById('v41SurahSelect');
      if (!sel || sel.options.length < 114) {
        window.renderFullQuranTabV46(activeSurahV46, activeAyahV46);
      }
    }
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV46);

  document.addEventListener('click', e => {
    const tgt = e.target && e.target.nodeType === 1 ? e.target : e.target?.parentElement;
    if (!tgt) return;
    if (tgt.id === 'langBtn') {
      setTimeout(() => {
        updateSyncButtonState();
        if (document.body.dataset.activeView === 'quran') {
          window.renderFullQuranTabV46(activeSurahV46, activeAyahV46);
        }
      }, 240);
    }
    if (tgt.closest('.check, .v41-read-btn, .book-step, [data-study-step], .submit')) {
      scheduleAutoCloudPush();
    }
  });

  const initCfg = safeGet(SYNC_CONFIG_KEY, {});
  if (initCfg.syncCode) {
    pullFromCloudSync(initCfg.syncCode, true);
  }

  syncAllV46();
})();
</script>

<script id="v47-live-sync-and-exam-shading-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };

  const EXAM_KEY = 'khatwati-exams-v1';
  const SYNC_CONFIG_KEY = 'khatwati-cloud-sync-v1';
  const SYNC_DATA_KEYS = [
    'khatwati-goals-v1','khatwati-books-v1','khatwati-language','khatwati-theme','khatwati-daily-theme',
    'khatwati-theme-override','khatwati-reminder-v1','khatwati-goal-notes-v1','khatwati-focus-v1',
    'khatwati-study-v1','khatwati-study-duration-v1','khatwati-study-scene','khatwati-ui-scale-v1',
    'khatwati-dark-mode','khatwati-goal-meta-v1','khatwati-todos-v1','khatwati-exams-v1',
    'khatwati-wellness-v1','khatwati-book-quotes-v1','khatwati-reading-challenge-v1',
    'khatwati-flashcards-v1','khatwati-subtasks-v1','khatwati-tasbeeh-v1','khatwati-gpa-v1',
    'khatwati-timetable-v1','khatwati-quran-v1','khatwati-archive-v1','khatwati-study-notes-v1'
  ];

  // =========================================================================
  // 1. Fix & Enhance Exams & Deadlines Countdown (#examCountdownList) Progress Fill Shading
  // =========================================================================
  function paintExamsCountdownShading() {
    const listEl = document.getElementById('examCountdownList');
    if (!listEl) return;
    const exams = safeGet(EXAM_KEY, []).sort((a, b) => a.date.localeCompare(b.date));
    const items = listEl.querySelectorAll('.v35-exam-item');
    const now = new Date();
    now.setHours(0, 0, 0, 0);

    items.forEach((itemEl, idx) => {
      const ex = exams[idx];
      if (!ex) return;
      const due = new Date(ex.date + 'T00:00:00');
      const diffDays = Math.ceil((due - now) / 86400000);
      // Calculate progress fill percentage (30-day window: closer to 0 days = fuller theme shading!)
      const totalWindow = ex.totalDays || 30;
      const shadePct = diffDays <= 0
        ? 100
        : Math.max(20, Math.min(96, Math.round(((totalWindow - Math.min(totalWindow, diffDays)) / totalWindow) * 80 + 18)));

      itemEl.style.setProperty('--v46-fill', shadePct + '%');

      const badge = itemEl.querySelector('.v35-exam-days');
      if (badge) {
        badge.style.setProperty('--v46-fill', shadePct + '%');
        const baseLabel = diffDays < 0
          ? tx('انتهى', 'Passed')
          : diffDays === 0
            ? tx('اليوم! 🎯', 'Today! 🎯')
            : `${diffDays} ${tx('يوم', 'days')}`;
        const desiredText = `⏳ ${baseLabel} · ${shadePct}%`;
        if (badge.textContent !== desiredText) {
          badge.textContent = desiredText;
        }
      }
    });
  }

  // Wrap window.v46PaintCountdowns so it ALWAYS paints #examCountdownList .v35-exam-item too!
  const prevPaintCountdowns = window.v46PaintCountdowns;
  window.v46PaintCountdowns = function() {
    if (typeof prevPaintCountdowns === 'function') prevPaintCountdowns();
    paintExamsCountdownShading();
  };

  // =========================================================================
  // 2. Direct, Automatic, Zero-Click Live Sync (⚡ المزامنة المباشرة التلقائية)
  // =========================================================================
  // Ensure every device has an active live sync channel automatically (or joins via #live_sync=CODE in URL!)
  const DEVICE_ID = LS.getItem('khatwati-device-id') || ('dev-' + Math.random().toString(36).slice(2, 8));
  try { LS.setItem('khatwati-device-id', DEVICE_ID); } catch {}

  function ensureLiveSyncCode() {
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    // Check if URL has #live_sync=CODE or ?sync=CODE
    const urlParams = new URLSearchParams(location.search);
    const hashMatch = location.hash.match(/[#&]live_sync=([a-zA-Z0-9_-]+)/);
    const incomingCode = urlParams.get('sync') || (hashMatch ? hashMatch[1] : '');
    if (incomingCode) {
      cfg.syncCode = incomingCode.trim().toLowerCase();
      cfg.autoLive = true;
      safeSet(SYNC_CONFIG_KEY, cfg);
      if (hashMatch) {
        history.replaceState(null, '', location.pathname + location.search);
      }
    }
    if (!cfg.syncCode) {
      // Auto-create a ready-to-use direct sync code so Live Sync works out-of-the-box without setup!
      cfg.syncCode = 'kh-' + Math.random().toString(36).slice(2, 8);
      cfg.autoLive = true;
      safeSet(SYNC_CONFIG_KEY, cfg);
    }
    return cfg.syncCode;
  }

  let lastPushedHash = '';
  let liveEventSource = null;
  let applyingRemote = false;

  function buildLivePayload() {
    const data = {};
    SYNC_DATA_KEYS.forEach(k => {
      const v = LS.getItem(k);
      if (v !== null) data[k] = v;
    });
    return {
      updatedAt: Date.now(),
      deviceId: DEVICE_ID,
      version: 'v47',
      data
    };
  }

  function applyLivePayload(payload) {
    if (!payload || !payload.data || payload.deviceId === DEVICE_ID) return false;
    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    if (cfg.lastSyncedAt && payload.updatedAt && payload.updatedAt <= cfg.lastSyncedAt) {
      return false;
    }
    applyingRemote = true;
    try {
      Object.entries(payload.data).forEach(([k, v]) => {
        if (SYNC_DATA_KEYS.includes(k) && typeof v === 'string') {
          LS.setItem(k, v);
        }
      });
      cfg.lastSyncedAt = payload.updatedAt || Date.now();
      safeSet(SYNC_CONFIG_KEY, cfg);
      lastPushedHash = JSON.stringify(payload.data);

      if (typeof goals !== 'undefined') goals = JSON.parse(LS.getItem('khatwati-goals-v1') || '[]');
      if (typeof window.render === 'function') window.render();
      if (typeof window.drawBooks === 'function') window.drawBooks();
      paintExamsCountdownShading();
      updateLiveHeaderBtn();
    } finally {
      setTimeout(() => { applyingRemote = false; }, 100);
    }
    return true;
  }

  async function pushLiveNow(force = false) {
    if (applyingRemote) return false;
    const code = ensureLiveSyncCode();
    const payload = buildLivePayload();
    const currentHash = JSON.stringify(payload.data);
    if (!force && currentHash === lastPushedHash) return true;
    lastPushedHash = currentHash;

    const cfg = safeGet(SYNC_CONFIG_KEY, {});
    cfg.lastSyncedAt = payload.updatedAt;
    safeSet(SYNC_CONFIG_KEY, cfg);
    updateLiveHeaderBtn();

    // Broadcast instantly to other tabs/windows on the same device
    try {
      if (window._khatwatiBC) window._khatwatiBC.postMessage(payload);
    } catch {}

    // Push live to cloud channel
    try {
      const topic = 'khatwati-sync-' + encodeURIComponent(code.replace(/[^a-z0-9_-]/gi, ''));
      const res = await fetch(`https://ntfy.sh/${topic}`, {
        method: 'POST',
        body: JSON.stringify(payload)
      });
      return res.ok;
    } catch {
      return false;
    }
  }

  async function pullLiveNow() {
    const code = ensureLiveSyncCode();
    try {
      const topic = 'khatwati-sync-' + encodeURIComponent(code.replace(/[^a-z0-9_-]/gi, ''));
      const res = await fetch(`https://ntfy.sh/${topic}/json?poll=1&since=all`);
      if (res.ok) {
        const text = await res.text();
        const lines = text.trim().split('\n').filter(Boolean);
        if (lines.length > 0) {
          const lastMsg = JSON.parse(lines[lines.length - 1]);
          const payload = JSON.parse(lastMsg.message);
          if (payload && payload.data) {
            return applyLivePayload(payload);
          }
        }
      }
    } catch {}
    return false;
  }

  function startRealTimeStream() {
    const code = ensureLiveSyncCode();
    if (liveEventSource) {
      try { liveEventSource.close(); } catch {}
      liveEventSource = null;
    }
    if (typeof window.EventSource !== 'function') return;
    try {
      const topic = 'khatwati-sync-' + encodeURIComponent(code.replace(/[^a-z0-9_-]/gi, ''));
      liveEventSource = new EventSource(`https://ntfy.sh/${topic}/sse`);
      liveEventSource.onmessage = e => {
        try {
          const msg = JSON.parse(e.data);
          if (msg && msg.message) {
            const payload = JSON.parse(msg.message);
            applyLivePayload(payload);
          }
        } catch {}
      };
    } catch {}
  }

  // Same-device BroadcastChannel for 0ms instant cross-tab sync
  try {
    if (typeof BroadcastChannel === 'function') {
      window._khatwatiBC = new BroadcastChannel('khatwati_live_channel');
      window._khatwatiBC.onmessage = e => {
        if (e.data && e.data.data) applyLivePayload(e.data);
      };
    }
  } catch {}

  // Intercept localStorage.setItem so ANY change anywhere in the app automatically triggers direct live sync!
  try {
    const origSetItem = LS.setItem.bind(LS);
    let livePushTimer = null;
    LS.setItem = function(key, val) {
      origSetItem(key, val);
      if (!applyingRemote && SYNC_DATA_KEYS.includes(key)) {
        clearTimeout(livePushTimer);
        livePushTimer = setTimeout(() => {
          pushLiveNow(false);
        }, 600);
      }
    };
  } catch {}

  function updateLiveHeaderBtn() {
    const btn = document.getElementById('v46CloudSyncBtn');
    if (!btn) return;
    const code = ensureLiveSyncCode();
    btn.classList.add('synced', 'live-active');
    btn.innerHTML = `<span class="v46-sync-dot"></span>⚡ ${tx('مباشر', 'Live')}`;
    btn.title = tx(`المزامنة المباشرة مفعّلة تلقائياً (${code})`, `Live Sync Active (${code})`);
    btn.onclick = openDirectLiveSyncModal;
  }

  function openDirectLiveSyncModal() {
    document.getElementById('v46SyncModalOverlay')?.remove();
    const code = ensureLiveSyncCode();
    const baseUrl = location.href.split('#')[0].split('?')[0];
    const directUrl = `${baseUrl}?sync=${encodeURIComponent(code)}`;

    document.body.insertAdjacentHTML('beforeend', `
      <div class="overlay show" id="v46SyncModalOverlay">
        <div class="dialog" style="max-width:420px">
          <div class="dialog-head">
            <h3>⚡ ${tx('المزامنة المباشرة التلقائية', 'Direct Live Sync')}</h3>
            <button type="button" class="close" id="v46CloseSyncModal">×</button>
          </div>

          <div class="v47-live-sync-banner">
            <span>🟢 <strong>${tx('المزامنة المباشرة شغّالة تلقائياً', 'Live Sync is active automatically')}</strong></span>
            <span class="v35-tag" style="font-family:monospace;direction:ltr">${code}</span>
          </div>

          <div class="v46-sync-box">
            <strong style="font-size:13.5px;display:block;margin-bottom:4px">📲 ${tx('افتح نفس حسابك بأي جهاز أو متصفح بضغطة وحدة:', 'Open your live-synced app anywhere in 1 tap:')}</strong>
            <p style="margin:0 0 10px;font-size:12px;color:var(--muted);line-height:1.55">
              ${tx('أي تغيير تسويه هنا ينحفظ ويتزامن تلقائياً باللحظة بدون ما تضغط أي زر. بس انسخ هذا الرابط المباشر وافتحه بأي مكان ثاني (أو اكتب نفس الرمز):', 'Every change syncs automatically in real time without pressing any button. Just copy this direct link or enter the same code on your other device:')}
            </p>
            <button type="button" class="btn" id="v47CopyDirectLinkBtn" style="width:100%;margin-bottom:10px">
              🔗 ${tx('نسخ رابط الفتح والمزامنة المباشرة', 'Copy Direct Live-Sync Link')}
            </button>
            <div style="display:flex;gap:7px;align-items:center">
              <input type="text" id="v46SyncCodeInput" class="field v46-sync-code-input" value="${code}" style="margin:0;flex:1" aria-label="رمز المزامنة المباشرة">
              <button type="button" class="v35-pill active" id="v47ChangeLiveCodeBtn" style="padding:11px 14px;white-space:nowrap">
                ✓ ${tx('ربط الرمز', 'Link Code')}
              </button>
            </div>
          </div>
        </div>
      </div>
    `);

    document.getElementById('v46CloseSyncModal').onclick = () => document.getElementById('v46SyncModalOverlay')?.remove();
    document.getElementById('v46SyncModalOverlay').onclick = e => { if (e.target.id === 'v46SyncModalOverlay') e.currentTarget.remove(); };

    document.getElementById('v47CopyDirectLinkBtn').onclick = () => {
      pushLiveNow(true);
      window.khatwatiCopyFallback(directUrl, tx('⚡ تم نسخ الرابط المباشر! بمجرد فتحه بأي مكان راح يتزامن وياك تلقائياً ولحظياً', '⚡ Direct Live-Sync link copied! Open it anywhere for automatic real-time sync'));
    };

    document.getElementById('v47ChangeLiveCodeBtn').onclick = async () => {
      const nextCode = document.getElementById('v46SyncCodeInput').value.trim().toLowerCase();
      if (!nextCode || nextCode.length < 3) {
        window.khatwatiNotice(tx('اكتب رمز من 3 حروف أو أرقام على الأقل', 'Enter at least 3 characters'));
        return;
      }
      const cfg = safeGet(SYNC_CONFIG_KEY, {});
      cfg.syncCode = nextCode;
      cfg.lastSyncedAt = 0;
      safeSet(SYNC_CONFIG_KEY, cfg);
      updateLiveHeaderBtn();
      startRealTimeStream();
      const pulled = await pullLiveNow();
      if (!pulled) await pushLiveNow(true);
      document.getElementById('v46SyncModalOverlay')?.remove();
      window.khatwatiNotice(tx(`⚡ تم الربط المباشر بالرمز (${nextCode}) — المزامنة الآن تلقائية بالكامل!`, `⚡ Linked to (${nextCode}) — Live Sync is now automatic!`));
    };
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) pullLiveNow();
  });

  function syncAllV47() {
    ensureLiveSyncCode();
    updateLiveHeaderBtn();
    paintExamsCountdownShading();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV47);

  syncAllV47();
  pullLiveNow();
  startRealTimeStream();
})();
</script>

<script id="v49-pro-features-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };

  // =========================================================================
  // 1. Live Exam Countdown (Hours:Minutes:Seconds) + Smart Study Breakdown
  // =========================================================================
  const EXAM_KEY = 'khatwati-exams-v1';
  const EXAM_STUDY_KEY = 'khatwati-exam-study-v1';

  function upgradeExamFormWithStudyBreakdown() {
    const form = document.getElementById('examQuickForm');
    if (!form || document.getElementById('v48ExamUnitsInput')) return;
    const submitBtn = form.querySelector('button[type="submit"]');
    if (!submitBtn) return;

    submitBtn.insertAdjacentHTML('beforebegin', `
      <input type="number" id="v48ExamUnitsInput" class="v35-search-input" style="max-width:145px" min="1" max="500" placeholder="${tx('عدد الفصول/الوحدات', 'Chapters/Units')}">
    `);

    form.addEventListener('submit', () => {
      const unitsVal = Number(document.getElementById('v48ExamUnitsInput')?.value) || 0;
      if (unitsVal > 0) {
        setTimeout(() => {
          const exams = safeGet(EXAM_KEY, []);
          const lastExam = exams[exams.length - 1];
          if (lastExam) {
            const store = safeGet(EXAM_STUDY_KEY, {});
            store[lastExam.id] = { totalUnits: unitsVal, doneUnits: 0 };
            safeSet(EXAM_STUDY_KEY, store);
            const inp = document.getElementById('v48ExamUnitsInput');
            if (inp) inp.value = '';
            updateLiveExamsCountdownAndBreakdown();
          }
        }, 30);
      }
    });
  }

  function updateLiveExamsCountdownAndBreakdown() {
    const listEl = document.getElementById('examCountdownList');
    if (!listEl) return;
    const exams = safeGet(EXAM_KEY, []).sort((a, b) => a.date.localeCompare(b.date));
    const studyStore = safeGet(EXAM_STUDY_KEY, {});
    const items = listEl.querySelectorAll('.v35-exam-item');
    const now = new Date();

    items.forEach((itemEl, idx) => {
      const ex = exams[idx];
      if (!ex) return;

      const targetTime = new Date(ex.date + 'T09:00:00');
      const diffMs = targetTime - now;
      const todayMidnight = new Date(); todayMidnight.setHours(0,0,0,0);
      const dueMidnight = new Date(ex.date + 'T00:00:00');
      const diffDays = Math.ceil((dueMidnight - todayMidnight) / 86400000);

      let liveClockStr = '';
      if (diffMs > 0) {
        const totalSecs = Math.floor(diffMs / 1000);
        const d = Math.floor(totalSecs / 86400);
        const h = Math.floor((totalSecs % 86400) / 3600);
        const m = Math.floor((totalSecs % 3600) / 60);
        const s = totalSecs % 60;
        const hms = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        liveClockStr = d > 0 ? `${d}d · ${hms}` : `⚡ ${hms}`;
      } else {
        liveClockStr = tx('حان الموعد 🎯', 'Due now 🎯');
      }

      const firstCol = itemEl.querySelector('div:first-child');
      if (firstCol) {
        let clockEl = firstCol.querySelector('.v48-exam-live-clock');
        if (!clockEl) {
          clockEl = document.createElement('span');
          clockEl.className = 'v48-exam-live-clock';
          firstCol.appendChild(clockEl);
        }
        clockEl.textContent = `⏱️ ${liveClockStr}`;
      }

      itemEl.classList.toggle('v48-exam-urgent-pulse', diffDays >= 0 && diffDays <= 2);

      const st = studyStore[ex.id] || { totalUnits: 10, doneUnits: 0 };
      const leftUnits = Math.max(0, st.totalUnits - st.doneUnits);
      const daysLeftForStudy = Math.max(1, diffDays);
      const dailyUnitsNeeded = leftUnits > 0 ? Math.ceil(leftUnits / daysLeftForStudy) : 0;
      const unitPct = st.totalUnits > 0 ? Math.min(100, Math.round((st.doneUnits / st.totalUnits) * 100)) : 0;

      let planRow = itemEl.querySelector('.v48-exam-plan-row');
      if (!planRow) {
        itemEl.style.flexDirection = 'column';
        itemEl.style.alignItems = 'stretch';
        if (!itemEl.querySelector('.v48-exam-top-wrap')) {
          const topWrap = document.createElement('div');
          topWrap.className = 'v48-exam-top-wrap';
          topWrap.style.cssText = 'display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%';
          while (itemEl.firstChild) {
            topWrap.appendChild(itemEl.firstChild);
          }
          itemEl.appendChild(topWrap);
        }
        planRow = document.createElement('div');
        planRow.className = 'v48-exam-plan-row';
        itemEl.appendChild(planRow);
      }

      const desiredSummary = leftUnits === 0
        ? `🎉 ${tx('أكملت مراجعة كل الفصول!', 'All chapters reviewed!')} (${st.doneUnits}/${st.totalUnits})`
        : `🧠 ${tx('خطة المراجعة:', 'Study plan:')} <strong>${dailyUnitsNeeded} ${tx('فصل/يوم', 'ch/day')}</strong> (${tx('المنجز', 'Done')} ${st.doneUnits}/${st.totalUnits})`;

      if (planRow.dataset.lastState !== `${st.doneUnits}/${st.totalUnits}/${dailyUnitsNeeded}`) {
        planRow.dataset.lastState = `${st.doneUnits}/${st.totalUnits}/${dailyUnitsNeeded}`;
        planRow.innerHTML = `
          <span>${desiredSummary}</span>
          <div style="display:flex;gap:5px;align-items:center">
            <button type="button" class="v48-exam-step-btn v46-shaded-btn" data-exam-unit-plus="${ex.id}" style="--v46-fill:${unitPct}%">
              ＋ ${tx('أنجزت فصل', '+1 Ch')} (${unitPct}%)
            </button>
            <button type="button" class="iconbtn" data-exam-unit-edit="${ex.id}" style="font-size:12px;padding:3px 6px" title="${tx('تحديد عدد الفصول', 'Set total chapters')}">⚙️</button>
          </div>
        `;
        const plusBtn = planRow.querySelector('[data-exam-unit-plus]');
        if (plusBtn) {
          plusBtn.onclick = () => {
            const curStore = safeGet(EXAM_STUDY_KEY, {});
            const item = curStore[ex.id] || { totalUnits: 10, doneUnits: 0 };
            item.doneUnits = (item.doneUnits + 1) % (item.totalUnits + 1);
            curStore[ex.id] = item;
            safeSet(EXAM_STUDY_KEY, curStore);
            updateLiveExamsCountdownAndBreakdown();
          };
        }
        const editBtn = planRow.querySelector('[data-exam-unit-edit]');
        if (editBtn) {
          editBtn.onclick = () => {
            const curStore = safeGet(EXAM_STUDY_KEY, {});
            const item = curStore[ex.id] || { totalUnits: 10, doneUnits: 0 };
            window.khatwatiPrompt(
              tx(`حدد إجمالي عدد الفصول/المحاضرات لامتحان «${ex.title}»:`, `Total chapters/units for "${ex.title}":`),
              String(item.totalUnits),
              val => {
                const n = Math.max(1, Math.min(500, parseInt(val, 10)));
                if (Number.isNaN(n)) return;
                item.totalUnits = n;
                item.doneUnits = Math.min(item.doneUnits, n);
                curStore[ex.id] = item;
                safeSet(EXAM_STUDY_KEY, curStore);
                updateLiveExamsCountdownAndBreakdown();
              }
            );
          };
        }
      }
    });
  }

  setInterval(updateLiveExamsCountdownAndBreakdown, 1000);

  // =========================================================================
  // 2. iPhone-Style 4-Digit PIN Privacy Lock (🔒 قفل التطبيق السريع)
  // =========================================================================
  const PIN_KEY = 'khatwati-pin-lock-v1';

  function installPinLockHeaderBtn() {
    const topRight = document.querySelector('.top > div:last-child');
    if (!topRight || document.getElementById('v48PinLockBtn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'v48PinLockBtn';
    btn.className = 'v48-lock-btn';
    btn.onclick = openPinLockSettingsOrLock;
    topRight.prepend(btn);
    updatePinLockBtnUI();
  }

  function updatePinLockBtnUI() {
    const btn = document.getElementById('v48PinLockBtn');
    if (!btn) return;
    const pin = LS.getItem(PIN_KEY);
    btn.classList.toggle('locked-enabled', !!pin);
    btn.textContent = pin ? '🔒' : '🔓';
    btn.title = pin ? tx('قفل التطبيق الآن أو إدارة الرمز السري', 'Lock app now or manage PIN') : tx('تفعيل قفل التطبيق برمز سري (PIN)', 'Set 4-digit PIN lock');
    btn.setAttribute('aria-label', btn.title);
  }

  function openPinLockSettingsOrLock() {
    const existingPin = LS.getItem(PIN_KEY);
    if (!existingPin) {
      window.khatwatiPrompt(
        tx('🔒 إعداد رمز قفل سريع (4 أرقام) لحماية أهدافك وملاحظاتك:', '🔒 Set a 4-digit PIN to protect your goals & notes:'),
        '',
        val => {
          const clean = String(val || '').trim();
          if (!/^\d{4}$/.test(clean)) {
            window.khatwatiNotice(tx('يرجى إدخال 4 أرقام بالضبط (مثلاً 1234)', 'Please enter exactly 4 digits (e.g. 1234)'));
            return;
          }
          LS.setItem(PIN_KEY, clean);
          updatePinLockBtnUI();
          window.khatwatiNotice(tx('🔒 تم تفعيل قفل التطبيق! اضغط على 🔒 بأي وقت لقفل الشاشة', '🔒 PIN lock enabled! Tap 🔒 anytime to lock'));
        }
      );
    } else {
      showPinLockOverlay(true);
    }
  }

  function showPinLockOverlay() {
    const savedPin = LS.getItem(PIN_KEY);
    if (!savedPin || document.getElementById('v48LockScreenOverlay')) return;

    let entered = '';
    document.body.insertAdjacentHTML('beforeend', `
      <div id="v48LockScreenOverlay">
        <div style="font-size:38px;margin-bottom:8px">🔒</div>
        <h3 style="margin:0 0 4px;font-size:20px">${tx('تطبيق خطوتي مقفل', 'Khatwati is Locked')}</h3>
        <p id="v48PinPromptText" style="margin:0;font-size:13px;opacity:0.8">${tx('أدخل رمز القفل المكون من 4 أرقام للمتابعة', 'Enter your 4-digit PIN to unlock')}</p>
        <div class="v48-pin-dots" id="v48PinDots">
          <span class="v48-pin-dot"></span>
          <span class="v48-pin-dot"></span>
          <span class="v48-pin-dot"></span>
          <span class="v48-pin-dot"></span>
        </div>
        <div class="v48-pin-pad">
          ${[1,2,3,4,5,6,7,8,9,'reset',0,'del'].map(k => {
            if (k === 'reset') return `<button type="button" class="v48-pin-key" data-pin-key="off" style="font-size:12px" title="${tx('إلغاء القفل بعد الإدخال', 'Disable PIN')}">إلغاء</button>`;
            if (k === 'del') return `<button type="button" class="v48-pin-key" data-pin-key="del" style="font-size:18px">⌫</button>`;
            return `<button type="button" class="v48-pin-key" data-pin-key="${k}">${k}</button>`;
          }).join('')}
        </div>
      </div>
    `);

    const overlay = document.getElementById('v48LockScreenOverlay');
    let disableAfterUnlock = false;

    const paintDots = () => {
      overlay.querySelectorAll('.v48-pin-dot').forEach((d, idx) => {
        d.classList.toggle('filled', idx < entered.length);
      });
    };

    overlay.querySelectorAll('[data-pin-key]').forEach(btn => {
      btn.onclick = () => {
        const k = btn.dataset.pinKey;
        if (k === 'del') {
          entered = entered.slice(0, -1);
          paintDots();
          return;
        }
        if (k === 'off') {
          disableAfterUnlock = true;
          document.getElementById('v48PinPromptText').textContent = tx('أدخل رمزك الحالي لإلغاء قفل التطبيق نهائياً', 'Enter current PIN to disable lock');
          return;
        }
        if (entered.length < 4) {
          entered += k;
          paintDots();
          if (entered.length === 4) {
            setTimeout(() => {
              if (entered === savedPin) {
                if (disableAfterUnlock) {
                  LS.removeItem(PIN_KEY);
                  updatePinLockBtnUI();
                  window.khatwatiNotice(tx('🔓 تم إلغاء رمز القفل السري', '🔓 PIN lock disabled'));
                }
                overlay.remove();
              } else {
                entered = '';
                paintDots();
                document.getElementById('v48PinPromptText').textContent = tx('❌ الرمز غير صحيح، حاول مرة ثانية', '❌ Incorrect PIN, try again');
              }
            }, 120);
          }
        }
      };
    });
  }

  function syncAllV49() {
    installPinLockHeaderBtn();
    updatePinLockBtnUI();
    upgradeExamFormWithStudyBreakdown();
    updateLiveExamsCountdownAndBreakdown();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV49);

  syncAllV49();
  if (LS.getItem(PIN_KEY)) {
    showPinLockOverlay();
  }
})();

    [111,'المسد','مكية',5],[112,'الإخلاص','مكية',4],[113,'الفلق','مكية',5],[114,'الناس','مكية',6]
  ];

  KhatwatiV50.saveMemorizedAyah = function(surahNum, ayahNum, verseText, customSurahLabel) {
    const meta = ALL_114_META.find(x => x[0] === Number(surahNum)) || [surahNum, 'سورة ' + surahNum, 'مكية', 0];
    const list = safeGet(MEMORIZED_KEY, []);
    const key = `${surahNum}:${ayahNum}`;
    if (!list.some(x => x.key === key)) {
      list.unshift({
        key,
        surah: Number(surahNum),
        surahName: customSurahLabel || ('سورة ' + meta[1]),
        ayah: Number(ayahNum),
        text: verseText || '',
        date: new Date().toISOString().slice(0, 10)
      });
      safeSet(MEMORIZED_KEY, list);
    }
    return list.length;
  };

  // Hook Daily Ayah "✓ قرأتها (الآية التالية)" (#v41MarkAyahReadBtn) so completing Daily Ayah automatically saves it to Memorized Verses tab!
  document.addEventListener('click', e => {
    const btn = e.target?.closest?.('#v41MarkAyahReadBtn, .v41-read-btn');
    if (!btn) return;
    try {
      const banner = document.getElementById('v37DailyQuoteBanner');
      const verseText = banner?.querySelector('#v37QuoteText')?.textContent?.replace(/^[﴿\s]+|[﴾\s]+$/g, '').trim() || '';
      const tagText = banner?.querySelector('.v41-ayah-surah-tag')?.textContent?.trim() || 'سورة الشرح · الآية ٥';
      // Parse surah name and ayah number from tagText (e.g., "سورة العصر · الآية ١-٣")
      let matchedSurah = 94;
      ALL_114_META.forEach(([num, name]) => {
        if (tagText.includes(name)) matchedSurah = num;
      });
      const digitMap = {'٠':0,'١':1,'٢':2,'٣':3,'٤':4,'٥':5,'٦':6,'٧':7,'٨':8,'٩':9};
      const normTag = tagText.replace(/[٠-٩]/g, d => digitMap[d]);
      const ayahMatch = normTag.match(/(\d+)/);
      const matchedAyah = ayahMatch ? Number(ayahMatch[1]) : 1;
      const surahLabel = tagText.split('·')[0].trim() || ('سورة ' + matchedSurah);

      const totalSaved = KhatwatiV50.saveMemorizedAyah(matchedSurah, matchedAyah, verseText, surahLabel);
      setTimeout(() => {
        window.khatwatiNotice(`🌟 تقبّل الله! انحفظت الآية في تبويب «الآيات المحفوظة» بالمصحف (مجموع حفظك: ${toArDigits(totalSaved)} آية)`);
      }, 60);
    } catch {}
  }, true);

  // Override window.renderFullQuranTabV46 with 10-Verses-Per-Page Pagination + Memorized Verses Sub-Tab!
  const SURAH_CACHE_V2 = 'khatwati-surah-cache-v2';
  function isSurahComplete(num) {
    const meta = ALL_114_META.find(x => x[0] === num);
    const entry = window.KhatwatiFullSurahs?.[num];
    if (!meta || !entry || !Array.isArray(entry.verses) || entry.isPartial) return false;
    return entry.verses.length >= meta[3];
  }

  async function ensureCompleteSurahLoaded(surahNum) {
    if (isSurahComplete(surahNum)) return window.KhatwatiFullSurahs[surahNum];
    const meta = ALL_114_META.find(x => x[0] === surahNum) || [surahNum, 'سورة ' + surahNum, 'مكية', 0];
    const saveLoadedSurah = verses => {
      const cleanVerses = verses.map((v, idx) => {
        let t = String(v || '').trim();
        if (idx === 0 && surahNum !== 1 && surahNum !== 9) {
          t = t.replace(/^بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ\s*/, '').trim();
        }
        return t;
      });
      const obj = { number: surahNum, name: 'سورة ' + meta[1], type: meta[2], bismillah: surahNum !== 1 && surahNum !== 9, verses: cleanVerses, isPartial: false };
      window.KhatwatiFullSurahs[surahNum] = obj;
      const cache = safeGet(SURAH_CACHE_V2, {});
      cache[surahNum] = obj;
      safeSet(SURAH_CACHE_V2, cache);
      return obj;
    };
    try {
      const r1 = await fetch(`https://cdn.jsdelivr.net/npm/quran-json@3.1.2/dist/chapters/${surahNum}.json`);
      if (r1.ok) {
        const d1 = await r1.json();
        if (Array.isArray(d1.verses) && d1.verses.length >= meta[3]) return saveLoadedSurah(d1.verses.map(v => v.text));
      }
    } catch {}
    try {
      const r2 = await fetch(`https://api.alquran.cloud/v1/surah/${surahNum}`);
      if (r2.ok) {
        const d2 = await r2.json();
        const ayahs = d2?.data?.ayahs || [];
        if (ayahs.length >= meta[3]) return saveLoadedSurah(ayahs.map(a => a.text));
      }
    } catch {}
    return window.KhatwatiFullSurahs?.[surahNum] || null;
  }

          <div id="v50MemorizedListBox" dir="rtl">

    container.innerHTML = `

        <h2>📖 ${tx('المصحف الشريف (١٠ آيات لكل صفحة)', 'Noble Quran (10 Verses/Page)')}</h2>
        <button type="button" class="v35-pill" id="v41BackToGoalsBtn">↩ ${tx('العودة للأهداف', 'Back to Goals')}</button>
      </div>

        ${(activePageV50 === 1 && activeSurahV50 !== 1 && activeSurahV50 !== 9) ? `<div class="v41-bismillah-line" lang="ar" dir="rtl">بِسْمِ اللَّهِ الرَّحْمَٰنِ الرَّحِيمِ</div>` : ''}

        <div class="v41-verses-container" id="v46VersesBox" lang="ar" dir="rtl">

  // =========================================================================

  const STUDY_MODE_PREF_KEY = 'khatwati-study-timer-mode-v50'; // 'countdown' | 'stopwatch'

        </button>
      </div>
      <div class="v50-custom-time-bar" id="v50CustomTimeBar" style="${currentMode === 'stopwatch' ? 'display:none' : ''}">
        <span style="font-size:12px;color:var(--muted);font-weight:600">${tx('تحديد الوقت (دقيقة):', 'Custom mins:')}</span>
        <input type="number" id="v50CustomMinInput" class="v50-custom-min-input" min="1" max="300" value="${curMin}" aria-label="دقائق المؤقت التنازلي">
        <button type="button" class="v35-pill active" id="v50ApplyCustomMinBtn" style="padding:6px 12px;font-size:12px">
          ✓ ${tx('ضبط الوقت', 'Set Time')}
        </button>
      </div>
    `);

    const applyCountdownMinutes = (mins) => {
      const m = Math.max(1, Math.min(300, Number(mins) || 25));
      LS.setItem('khatwati-study-duration-v1', String(m));
      const inp = document.getElementById('v50CustomMinInput');
      if (inp) inp.value = String(m);
      const t = safeGet(STUDY_TIMER_KEY, {}) || {};
      t.mode = 'countdown';
      t.plannedMinutes = m;
      t.remainingSec = m * 60;
      t.running = false;
      delete t.endAt;
      safeSet(STUDY_TIMER_KEY, t);
      const valEl = document.getElementById('studyTimerValue');
      if (valEl) valEl.textContent = `${String(m).padStart(2,'0')}:00`;
      if (window.v46PaintCountdowns) window.v46PaintCountdowns();
    };

    document.getElementById('v50ApplyCustomMinBtn').onclick = () => {
      const val = document.getElementById('v50CustomMinInput')?.value;
      applyCountdownMinutes(val);
      window.khatwatiNotice(tx(`⏳ تم ضبط المؤقت التنازلي على ${val} دقيقة`, `⏳ Countdown set to ${val} min`));
    };

    card.querySelectorAll('[data-study-preset]').forEach(btn => {
      btn.addEventListener('click', () => {
        const inp = document.getElementById('v50CustomMinInput');
        if (inp) inp.value = btn.dataset.studyPreset;
      });
    });

    card.querySelectorAll('[data-v50-mode]').forEach(btn => {
      btn.onclick = () => {
        const mode = btn.dataset.v50Mode;
        LS.setItem(STUDY_MODE_PREF_KEY, mode);
        card.querySelectorAll('[data-v50-mode]').forEach(b => b.classList.toggle('active', b.dataset.v50Mode === mode));
        const customBar = document.getElementById('v50CustomTimeBar');
        const presetsBar = card.querySelector('.v43-study-presets');
        if (customBar) customBar.style.display = mode === 'countdown' ? 'flex' : 'none';
        if (presetsBar) presetsBar.style.display = mode === 'countdown' ? 'flex' : 'none';

        clearInterval(stopwatchInterval);
        const t = safeGet(STUDY_TIMER_KEY, {}) || {};
        t.mode = mode;
        t.running = false;
        if (mode === 'stopwatch') {
          t.elapsedSec = 0;
          t.accSec = 0;
          t.swStartAt = null;
          safeSet(STUDY_TIMER_KEY, t);
          const valEl = document.getElementById('studyTimerValue');
          if (valEl) valEl.textContent = '00:00';
          const toggleBtn = document.getElementById('studyTimerToggle');
          if (toggleBtn) toggleBtn.textContent = tx('▶ ابدأ المؤقت التصاعدي', '▶ Start Stopwatch');
        } else {
          const m = Number(document.getElementById('v50CustomMinInput')?.value) || 25;
          applyCountdownMinutes(m);
        }
      };
    });

    const toggleBtn = document.getElementById('studyTimerToggle');
    const stopBtn = document.getElementById('studyTimerStop');

    if (false && toggleBtn) {
      toggleBtn.addEventListener('click', e => {
        const mode = LS.getItem(STUDY_MODE_PREF_KEY) || 'countdown';
        if (mode !== 'stopwatch') return;
        e.stopImmediatePropagation();
        e.preventDefault();

        const t = safeGet(STUDY_TIMER_KEY, {}) || {};
        t.mode = 'stopwatch';
        if (t.running) {
          t.elapsedSec = Math.max(0, Math.floor((Date.now() - (t.swStartAt || Date.now())) / 1000) + (Number(t.accSec) || 0));
          t.accSec = t.elapsedSec;
          t.running = false;
          clearInterval(stopwatchInterval);
        } else {
          t.accSec = Number(t.accSec) || 0;
          t.swStartAt = Date.now();
          t.running = true;
          startStopwatchLoop();
        }
        safeSet(STUDY_TIMER_KEY, t);
        paintStopwatchFace();
      }, true);
    }

    if (stopBtn) {
      stopBtn.addEventListener('click', e => {
        const mode = LS.getItem(STUDY_MODE_PREF_KEY) || 'countdown';
        if (mode !== 'stopwatch') return;
        e.stopImmediatePropagation();
        e.preventDefault();

        clearInterval(stopwatchInterval);
        const t = safeGet(STUDY_TIMER_KEY, {}) || {};
        const totalSec = t.running
          ? Math.max(0, Math.floor((Date.now() - (t.swStartAt || Date.now())) / 1000) + (Number(t.accSec) || 0))
          : (Number(t.accSec) || 0);
        const minsLogged = Math.max(1, Math.round(totalSec / 60));

        const plans = safeGet('khatwati-study-v1', []);
        const p = plans.find(x => x.id === t.planId) || plans[0];
        if (p) {
          p.studyHistory = Array.isArray(p.studyHistory) ? p.studyHistory : [];
          p.studyHistory.push({ date: new Date().toISOString().slice(0, 10), minutes: minsLogged });
          safeSet('khatwati-study-v1', plans);
        }
        LS.removeItem(STUDY_TIMER_KEY);
        overlay.hidden = true;
        if (window.khatwatiCelebrate) window.khatwatiCelebrate();
        window.khatwatiNotice(tx(`🎉 عاشت ايدك! تم تسجيل ${minsLogged} دقيقة دراسة بالمؤقت التصاعدي`, `🎉 Logged ${minsLogged} min of study!`));
      }, true);
    }
  }

  function paintStopwatchFace() {
    const mode = LS.getItem(STUDY_MODE_PREF_KEY) || 'countdown';
    if (mode !== 'stopwatch') return;
    const t = safeGet(STUDY_TIMER_KEY, {}) || {};
    const totalSec = t.running
      ? Math.max(0, Math.floor((Date.now() - (t.swStartAt || Date.now())) / 1000) + (Number(t.accSec) || 0))
      : (Number(t.accSec) || 0);
    const hrs = Math.floor(totalSec / 3600);
    const mins = Math.floor((totalSec % 3600) / 60);
    const secs = totalSec % 60;
    const valEl = document.getElementById('studyTimerValue');
    if (valEl) {
      valEl.textContent = hrs > 0
        ? `${String(hrs).padStart(2,'0')}:${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`
        : `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}`;
    }
    const faceEl = document.getElementById('studyTimerFace');
    if (faceEl) faceEl.style.setProperty('--study-progress', '0deg');
    const toggleBtn = document.getElementById('studyTimerToggle');
    if (toggleBtn) {
      toggleBtn.classList.remove('v46-shaded-btn', 'v46-timer-running');
      toggleBtn.style.removeProperty('--v46-fill');
      toggleBtn.textContent = t.running
        ? `${tx('⏸ إيقاف مؤقت', '⏸ Pause')}`
        : (totalSec > 0 ? `${tx('▶ استئناف التصاعدي', '▶ Resume')}` : `${tx('▶ ابدأ المؤقت التصاعدي', '▶ Start Stopwatch')}`);
    }
  }

  function startStopwatchLoop() {
    clearInterval(stopwatchInterval);
    stopwatchInterval = setInterval(paintStopwatchFace, 500);
  }

  // =========================================================================
  // [Item 3] Authentic iOS Passcode Keypad Lock Screen
  // =========================================================================
  const PIN_KEY = 'khatwati-pin-lock-v1';
  const IOS_KEYPAD_LETTERS = {
    1: '', 2: 'ABC', 3: 'DEF',
    4: 'GHI', 5: 'JKL', 6: 'MNO',
    7: 'PQRS', 8: 'TUV', 9: 'WXYZ', 0: ''
  };

  KhatwatiV50.openIosPinScreen = function(mode = 'unlock') {
    document.getElementById('v48LockScreenOverlay')?.remove();
    const savedPin = LS.getItem(PIN_KEY);
    if (mode === 'unlock' && !savedPin) return;

    let entered = '';
    let isSettingNew = (mode === 'setup' || !savedPin);
    let disableMode = false;

    document.body.insertAdjacentHTML('beforeend', `
      <div id="v48LockScreenOverlay">
        <svg class="v50-ios-lock-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <div class="v50-ios-lock-title" id="v50IosLockTitle">
          ${isSettingNew ? tx('تعيين رمز دخول جديد', 'Set New Passcode') : tx('أدخل رمز الدخول', 'Enter Passcode')}
        </div>
        <div class="v50-ios-lock-sub" id="v50IosLockSub">
          ${isSettingNew ? tx('اختر رمزاً من ٤ أرقام لقفل خطوتي', 'Choose a 4-digit passcode') : tx('تطبيق خطوتي محمي برمز القفل', 'Khatwati is protected by passcode')}
        </div>
        <div class="v50-ios-dots" id="v50IosDots">
          <span class="v50-ios-dot"></span>
          <span class="v50-ios-dot"></span>
          <span class="v50-ios-dot"></span>
          <span class="v50-ios-dot"></span>
        </div>
        <div class="v50-ios-keypad">
          ${[1,2,3,4,5,6,7,8,9].map(n => `
            <button type="button" class="v50-ios-key" data-ios-digit="${n}">
              <span class="v50-ios-key-num">${n}</span>
              <span class="v50-ios-key-abc">${IOS_KEYPAD_LETTERS[n]}</span>
            </button>
          `).join('')}
          <button type="button" class="v50-ios-text-key" id="v50IosLeftAction">
            ${isSettingNew ? tx('إلغاء', 'Cancel') : tx('إلغاء القفل', 'Turn Off')}
          </button>
          <button type="button" class="v50-ios-key" data-ios-digit="0">
            <span class="v50-ios-key-num">0</span>
            <span class="v50-ios-key-abc"></span>
          </button>
          <button type="button" class="v50-ios-text-key" id="v50IosDeleteBtn">
            ${tx('مسح', 'Delete')}
          </button>
        </div>
      </div>
    `);

    const overlay = document.getElementById('v48LockScreenOverlay');
    const dotsWrap = document.getElementById('v50IosDots');
    const paintDots = () => {
      dotsWrap.querySelectorAll('.v50-ios-dot').forEach((d, idx) => {
        d.classList.toggle('filled', idx < entered.length);
      });
    };

    document.getElementById('v50IosLeftAction').onclick = () => {
      if (isSettingNew) {
        overlay.remove();
      } else {
        disableMode = true;
        document.getElementById('v50IosLockTitle').textContent = tx('أدخل الرمز لإلغاء القفل', 'Enter Passcode to Turn Off');
        document.getElementById('v50IosLockSub').textContent = tx('سيتم إيقاف قفل التطبيق بعد إدخال رمزك الحالي', 'Passcode lock will be disabled');
      }
    };

    document.getElementById('v50IosDeleteBtn').onclick = () => {
      entered = entered.slice(0, -1);
      paintDots();
    };

    overlay.querySelectorAll('[data-ios-digit]').forEach(btn => {
      btn.onclick = () => {
        if (entered.length >= 4) return;
        entered += btn.dataset.iosDigit;
        paintDots();

        if (entered.length === 4) {
          setTimeout(() => {
            if (isSettingNew) {
              LS.setItem(PIN_KEY, entered);
              overlay.remove();
              window.khatwatiNotice(tx('🔒 تم تفعيل رمز الدخول بنجاح!', '🔒 Passcode enabled!'));
              KhatwatiV50.syncLockButton();
              return;
            }
            if (entered === savedPin) {
              if (disableMode) {
                LS.removeItem(PIN_KEY);
                window.khatwatiNotice(tx('🔓 تم إيقاف قفل التطبيق', '🔓 Passcode turned off'));
              }
              overlay.remove();
              KhatwatiV50.syncLockButton();
            } else {
              dotsWrap.classList.remove('shake');
              void dotsWrap.offsetWidth;
              dotsWrap.classList.add('shake');
              entered = '';
              paintDots();
              document.getElementById('v50IosLockSub').textContent = tx('رمز الدخول غير صحيح، حاول مرة أخرى', 'Incorrect Passcode, try again');
            }
          }, 110);
        }
      };
    });
  };

  KhatwatiV50.syncLockButton = function() {
    const lockBtn = document.getElementById('v48PinLockBtn');
    if (!lockBtn) return;
    const hasPin = !!LS.getItem(PIN_KEY);
    lockBtn.classList.toggle('locked-enabled', hasPin);
    lockBtn.textContent = hasPin ? '🔒' : '🔓';
    lockBtn.onclick = e => {
      e.stopPropagation();
      KhatwatiV50.openIosPinScreen(hasPin ? 'unlock' : 'setup');
    };
  };

  // =========================================================================
  // [Item 9] Top Settings Icon (⚙️) + Settings & Summary Combined View
  // =========================================================================
  KhatwatiV50.openSettingsAndSummaryView = function() {
    const statsBtn = document.querySelector('.view-btn[data-view="weekly"]');
    if (statsBtn) statsBtn.click();

    document.querySelectorAll('.view-switch .view-btn').forEach(b => b.classList.remove('active'));
    const topBtn = document.getElementById('v50SettingsTopBtn');
    if (topBtn) topBtn.classList.add('active');

    const weeklySec = document.getElementById('weeklySection');
    if (!weeklySec) return;
    weeklySec.hidden = false;

    let panel = document.getElementById('v50SettingsPanelCard');
    if (!panel) {
      panel = document.createElement('section');
      panel.id = 'v50SettingsPanelCard';
      weeklySec.prepend(panel);
    }

    const hasPin = !!LS.getItem(PIN_KEY);
    const isDark = document.body.classList.contains('dark-mode');
    const syncCfg = safeGet('khatwati-cloud-sync-v1', {});

    panel.innerHTML = `
      <div class="section-head" style="margin-bottom:8px">
        <h2>⚙️ ${tx('الإعدادات وتخصيص التطبيق', 'App Settings & Customization')}</h2>
        <button type="button" class="v35-pill" id="v50BackToGoalsFromSettings">↩ ${tx('العودة للأهداف', 'Back to Goals')}</button>
      </div>
      <p style="margin:0 0 10px;font-size:12.5px;color:var(--muted)">
        ${tx('تحكم بمظهر التطبيق، اللغة، حجم الخط، قفل الآيفون، والمزامنة المباشرة، وتابع ملخص إنجازاتك بالأسفل:', 'Customize theme, language, font size, iOS lock, and live sync, and view your full summary below:')}
      </p>
      <div class="v50-settings-grid">
        <div class="v50-setting-row">
          <div>
            <strong>🎨 ${tx('المظهر والوضع الليلي', 'Appearance & Dark Mode')}</strong>
            <small>${tx('التبديل بين الوضع النهاري والليلي وثيمات الألوان', 'Switch between Light/Dark mode and color themes')}</small>
          </div>
          <div style="display:flex;gap:6px;flex-wrap:wrap">
            <button type="button" class="v35-pill" id="v50ToggleDarkBtn">${isDark ? tx('☀️ نهاري', '☀️ Light Mode') : tx('🌙 ليلي', '🌙 Dark Mode')}</button>
            <button type="button" class="v35-pill active" id="v50OpenThemesBtn">🎨 ${tx('الثيمات', 'Themes')}</button>
          </div>
        </div>

        <div class="v50-setting-row">
          <div>
            <strong>🌐 ${tx('لغة التطبيق وحجم الخط', 'Language & Font Scale')}</strong>
            <small>${tx('تغيير لغة الواجهة وتكبير أو تصغير النصوص', 'Switch language or adjust UI text size')}</small>
          </div>
          <div style="display:flex;gap:6px;align-items:center">
            <button type="button" class="v35-pill" id="v50ToggleLangBtn">🌐 ${isEn() ? 'Switch to Arabic' : 'English'}</button>
            <button type="button" class="v35-pill" id="v50ScaleDownBtn">A-</button>
            <button type="button" class="v35-pill" id="v50ScaleUpBtn">A+</button>
          </div>
        </div>

        <div class="v50-setting-row">
          <div>
            <strong>🔒 ${tx('قفل التطبيق برمز الدخول (iOS Passcode)', 'iOS Passcode App Lock')}</strong>
            <small>${hasPin ? tx('القفل مفعّل حالياً (٤ أرقام)', 'Passcode lock is active (4 digits)') : tx('حماية أهدافك وملاحظاتك بلوحة أرقام الآيفون', 'Protect your app with an iOS-style keypad')}</small>
          </div>
          <button type="button" class="v35-pill ${hasPin ? 'active' : ''}" id="v50ManagePinBtn">
            ${hasPin ? tx('🔒 قفل الآن / تعديل', '🔒 Lock / Edit PIN') : tx('🔓 تعيين رمز قفل', '🔓 Set Passcode')}
          </button>
        </div>

        <div class="v50-setting-row">
          <div>
            <strong>⚡ ${tx('المزامنة المباشرة بين الأجهزة', 'Direct Live Sync')}</strong>
            <small>${tx('رمز قناتك المباشرة:', 'Live channel code:')} <code style="font-weight:700">${escHtml(syncCfg.syncCode || tx('تلقائي', 'Auto'))}</code></small>
          </div>
          <button type="button" class="v35-pill active" id="v50OpenSyncSettingsBtn">⚡ ${tx('إعدادات المزامنة', 'Sync Settings')}</button>
        </div>
      </div>
    `;

    document.getElementById('v50BackToGoalsFromSettings').onclick = () => {
      document.querySelector('.view-btn[data-view="goals"]')?.click();
    };
    document.getElementById('v50ToggleDarkBtn').onclick = () => {
      document.getElementById('darkModeBtn')?.click();
      setTimeout(KhatwatiV50.openSettingsAndSummaryView, 60);
    };
    document.getElementById('v50OpenThemesBtn').onclick = () => {
      document.getElementById('themeBtn')?.click();
    };
    document.getElementById('v50ToggleLangBtn').onclick = () => {
      document.getElementById('langBtn')?.click();
      setTimeout(KhatwatiV50.openSettingsAndSummaryView, 260);
    };
    document.getElementById('v50ScaleDownBtn').onclick = () => document.getElementById('sizeDown')?.click();
    document.getElementById('v50ScaleUpBtn').onclick = () => document.getElementById('sizeUp')?.click();
    document.getElementById('v50ManagePinBtn').onclick = () => {
      KhatwatiV50.openIosPinScreen(hasPin ? 'unlock' : 'setup');
    };
    document.getElementById('v50OpenSyncSettingsBtn').onclick = () => {
      document.getElementById('v46CloudSyncBtn')?.click();
    };

    window.scrollTo({ top: 0, behavior: 'instant' });
  };

  function installTopSettingsButton() {
    const topRight = document.querySelector('.top > div:last-child');
    if (!topRight || document.getElementById('v50SettingsTopBtn')) return;
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.id = 'v50SettingsTopBtn';
    btn.className = 'v50-top-settings-btn';
    btn.innerHTML = '⚙️';
    btn.title = tx('الإعدادات والملخص الشامل', 'Settings & Summary');
    btn.setAttribute('aria-label', btn.title);
    btn.onclick = () => {
      KhatwatiV50.openSettingsAndSummaryView();
    };
    topRight.prepend(btn);
  }

  document.addEventListener('click', e => {
    const vb = e.target?.closest?.('.view-btn');
    if (vb && vb.dataset.view !== 'weekly') {
      document.getElementById('v50SettingsTopBtn')?.classList.remove('active');
    }
  });

  function syncAllV50() {
    installTopSettingsButton();
    KhatwatiV50.syncLockButton();
    installDualStudyTimerStudio();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV50);

  syncAllV50();
})();
</script>
<style id="v51-upgrades-styles">
/* ============================================================================
   Khatwati v51 — 6-Point Precision Upgrade
   1. Remove All Level Banners (#v36LevelBanner)
   2. Remove Daily Companion Tools except Wellness (#v36WellnessSection)
   3. Bilingual Daily Summary Card (Arabic & English)
   4. Complete English Localization in Settings
   5. Screen Wake Lock (🔆) + Fullscreen Desk Clock / StandBy Mode (🖥️)
   6. Fix Study Session Themes (sage, warm, dim, midnight) & Remove Stopwatch Progressive Shading
   ============================================================================ */

/* [1] Completely remove Level Banners */
#v36LevelBanner, .v36-level-banner {
  display: none !important;
}

/* [2] Remove Daily Companion Tools wrapper header, tabs, Focus, Quick Tasks, and Tasbeeh — Keep ONLY Wellness! */
#v38GoalSubtools .v38-subtools-header,
#v38GoalSubtools #v38GoalSegBar,
#focusCard,
#v35QuickTasksCard,
#v37TasbeehCard {
  display: none !important;
}

  background: transparent !important;
  border: 0 !important;
  padding: 0 !important;
  box-shadow: none !important;
  margin-top: 14px !important;
}

  display: grid !important;
}

/* [6A] Fix Study Session Scene Themes (sage, warm, dim, midnight) so switching scenes changes the card & overlay */
#studyTimerOverlay .study-timer-dialog[data-scene="sage"],
#studyTimerOverlay .study-timer-dialog:not([data-scene]) {
  background: linear-gradient(165deg, color-mix(in srgb, var(--white) 95%, var(--green)), var(--paper)) !important;

  color: #493e32 !important;
  border-color: #d6c3a5 !important;
}
#studyTimerOverlay .study-timer-dialog[data-scene="warm"] .v50-custom-time-bar,
#studyTimerOverlay .study-timer-dialog[data-scene="warm"] .v50-timer-mode-switch {
  background: rgba(255, 250, 240, 0.75) !important;
  border-color: #d6c3a5 !important;

#studyTimerOverlay .study-timer-dialog[data-scene="dim"] {

#studyTimerOverlay .study-timer-dialog[data-scene="dim"] .v50-custom-time-bar,
#studyTimerOverlay .study-timer-dialog[data-scene="dim"] .v50-timer-mode-switch {

}

  color: #e5e9df !important;

}
#studyTimerOverlay .study-timer-dialog[data-scene="midnight"] {
  background: linear-gradient(165deg, #1e293b, #0f172a 70%, #090d16) !important;
  color: #f1f5f9 !important;
  border-color: #334155 !important;
}
#studyTimerOverlay .study-timer-dialog[data-scene="midnight"] .v50-custom-time-bar,
#studyTimerOverlay .study-timer-dialog[data-scene="midnight"] .v50-timer-mode-switch {
  background: rgba(15, 23, 42, 0.85) !important;
  border-color: #334155 !important;
  color: #f1f5f9 !important;
}
#studyTimerOverlay .study-timer-dialog[data-scene="midnight"] .v50-custom-min-input {
  background: #0f172a !important;
  color: #f1f5f9 !important;
  border-color: #475569 !important;
}
