<script>
const KEY='khatwati-goals-v1';let goals=JSON.parse(localStorage.getItem(KEY)||'[]'),active='daily';const labels={daily:'اليوم',weekly:'هذا الأسبوع',monthly:'هذا الشهر'};const dateKey=(d=new Date())=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;function periodKey(p,d=new Date()){let day=new Date(d);if(p==='daily')return dateKey(day);if(p==='monthly')return `${day.getFullYear()}-${String(day.getMonth()+1).padStart(2,'0')}`;let dow=(day.getDay()+6)%7;day.setDate(day.getDate()-dow);return 'week-'+dateKey(day)}function save(){localStorage.setItem(KEY,JSON.stringify(goals));render()}function count(g){return g.records?.[periodKey(g.period)]||0}function render(){const now=new Date();document.querySelector('#today').textContent=new Intl.DateTimeFormat('ar-IQ',{weekday:'long',day:'numeric',month:'long'}).format(now);const applicable=goals.filter(g=>g.period===active),done=applicable.filter(g=>count(g)>=g.target).length,progress=applicable.length?Math.round(done/applicable.length*100):0;const allPeriods=['daily','weekly','monthly'];document.querySelector('#summary').innerHTML=`<div class="card sum-main"><div class="sum-label">إنجازك ${labels[active]}</div><div class="sum-val">${progress}%</div><div class="sum-sub">${done} من ${applicable.length} أهداف مكتملة</div></div>${allPeriods.map(p=>{let arr=goals.filter(g=>g.period===p),n=arr.filter(g=>count(g)>=g.target).length;return `<div class="card"><div class="sum-icon">${p==='daily'?'☀️':p==='weekly'?'📅':'🌙'}</div><div class="sum-label">${labels[p]}</div><div class="sum-val">${n}<span style="font-size:15px;color:var(--muted);font-weight:500"> / ${arr.length}</span></div><div class="sum-sub" style="color:var(--muted)">أهداف مكتملة</div></div>`}).join('')}`;document.querySelector('#listTitle').textContent=`أهداف ${labels[active]}`;document.querySelector('#periodHint').textContent=active==='daily'?'تتجدد الأهداف كل يوم':active==='weekly'?'بداية الأسبوع يوم الاثنين':'تتجدد الأهداف مع بداية الشهر';const list=document.querySelector('#goalList');if(!applicable.length){list.innerHTML=`<div class="empty"><strong>ما عندك أهداف ${labels[active]} بعد</strong>أضف هدفك الأول وابدأ تتابع تقدمك.<br><button class="btn" style="margin-top:16px" onclick="openForm()">＋ أضف هدف</button></div>`;return}list.innerHTML=applicable.map(g=>{let n=count(g),pct=Math.min(100,Math.round(n/g.target*100)),isDone=n>=g.target;return `<article class="goal ${isDone?'done':''}"><button class="check" title="${isDone?'إلغاء الإنجاز':'تسجيل إنجاز'}" onclick="step('${g.id}',${isDone?-1:1})">${isDone?'✓':g.target===1?'○':'＋'}</button><div class="goal-info"><div class="goal-name">${esc(g.name)}</div><div class="goal-meta">${isDone?'أحسنت! كملت هدفك 🎉':g.target===1?'هدف بسيط، تگدر عليه':'كل مرة تسويها، سجّلها هنا'}</div></div><div class="goal-progress"><div class="bar"><i style="width:${pct}%"></i></div><span class="count">${n} / ${g.target}</span></div><div class="goal-actions"><button class="iconbtn" title="تعديل" onclick="editGoal('${g.id}')">✎</button><button class="iconbtn" title="حذف" onclick="deleteGoal('${g.id}')">⌫</button></div></article>`}).join('')};function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function step(id,delta){let g=goals.find(x=>x.id===id),k=periodKey(g.period),n=count(g);g.records=g.records||{};g.records[k]=Math.max(0,Math.min(g.target,n+delta));if(!g.records[k])delete g.records[k];save();if(delta>0&&g.records[k]>=g.target)toast('أحسنت! كملت هدفك 🎉')}function openForm(g=null){document.querySelector('#goalForm').reset();document.querySelector('#goalId').value=g?.id||'';document.querySelector('#name').value=g?.name||'';document.querySelector('#period').value=g?.period||active;document.querySelector('#target').value=g?.target||1;document.querySelector('#formTitle').textContent=g?'تعديل الهدف':'هدف جديد';document.querySelector('#overlay').classList.add('show');setTimeout(()=>document.querySelector('#name').focus(),50)}function editGoal(id){openForm(goals.find(g=>g.id===id))}function deleteGoal(id){window.khatwatiConfirm('تحذف هذا الهدف؟',()=>{goals=goals.filter(g=>g.id!==id);save();toast('تم حذف الهدف')})}function toast(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)}document.querySelector('#addBtn').onclick=()=>openForm();document.querySelector('#closeBtn').onclick=()=>document.querySelector('#overlay').classList.remove('show');document.querySelector('#overlay').onclick=e=>{if(e.target.id==='overlay')e.currentTarget.classList.remove('show')};document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{active=b.dataset.period;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});document.querySelector('#goalForm').onsubmit=e=>{e.preventDefault();let id=document.querySelector('#goalId').value,g=goals.find(x=>x.id===id),period=document.querySelector('#period').value,target=Number(document.querySelector('#target').value);if(g){g.name=document.querySelector('#name').value.trim();if(g.period!==period){g.period=period;g.records={}}g.target=target;for(let k in (g.records||{}))g.records[k]=Math.min(g.records[k],target)}else goals.push({id:crypto.randomUUID(),name:document.querySelector('#name').value.trim(),period,target,records:{}});document.querySelector('#overlay').classList.remove('show');active=period;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.period===active));save();toast('انحفظ هدفك بنجاح')};render();
</script>

let lang=localStorage.getItem('khatwati-language')||'ar';function tr(key){return (lang==='en'?EN:AR)[key]||key}function syncLanguage(){document.documentElement.lang=lang;document.documentElement.dir=lang==='ar'?'rtl':'ltr';document.title=lang==='en'?'Khatwati | Goals':'خطوتي | أهدافي';document.querySelector('[data-i18n="brand"]').textContent=tr('brand');document.querySelector('.eyebrow').textContent=tr('tagline');document.querySelector('.hero h1').textContent=tr('headline');document.querySelector('.hero p').textContent=tr('subtitle');document.querySelector('#addBtn').textContent=tr('add');document.querySelector('#langBtn').textContent=tr('language');document.querySelector('.footer-note').textContent=tr('saved');document.querySelector('.tabs').setAttribute('aria-label',lang==='en'?'Period':'الفترة');document.querySelectorAll('.tab').forEach(b=>b.textContent=tr(b.dataset.period));document.querySelector('#name').placeholder=tr('placeholder');document.querySelector('label[for="name"]').textContent=tr('whatGoal');document.querySelector('label[for="period"]').textContent=tr('repeat');document.querySelector('label[for="target"]').textContent=tr('target');document.querySelector('#period option[value="daily"]').textContent=tr('dailyOpt');document.querySelector('#period option[value="weekly"]').textContent=tr('weeklyOpt');document.querySelector('#period option[value="monthly"]').textContent=tr('monthlyOpt');document.querySelector('.submit').textContent=tr('saveGoal');document.querySelector('#closeBtn').setAttribute('aria-label',lang==='en'?'Close':'إغلاق');render();}
render=function(){const now=new Date();document.querySelector('#today').textContent=new Intl.DateTimeFormat(lang==='en'?'en-US':'ar-IQ',{weekday:'long',day:'numeric',month:'long'}).format(now);const applicable=goals.filter(g=>g.period===active),done=applicable.filter(g=>count(g)>=g.target).length,progress=applicable.length?Math.round(done/applicable.length*100):0;document.querySelector('#summary').innerHTML=`<div class="card sum-main"><div class="sum-label">${lang==='en'?'Your '+tr(active)+' progress':'إنجازك '+tr(active)}</div><div class="sum-val">${progress}%</div><div class="sum-sub">${done} ${lang==='en'?'of':'من'} ${applicable.length} ${tr('completed')}</div></div>${['daily','weekly','monthly'].map(p=>{let arr=goals.filter(g=>g.period===p),n=arr.filter(g=>count(g)>=g.target).length;return `<div class="card"><div class="sum-icon">${p==='daily'?'☀️':p==='weekly'?'📅':'🌙'}</div><div class="sum-label">${tr(p)}</div><div class="sum-val">${n}<span style="font-size:15px;color:var(--muted);font-weight:500"> / ${arr.length}</span></div><div class="sum-sub" style="color:var(--muted)">${tr('completed')}</div></div>`}).join('')}`;document.querySelector('#listTitle').textContent=tr(active+'Goals');document.querySelector('#periodHint').textContent=tr(active+'Hint');const list=document.querySelector('#goalList');if(!applicable.length){list.innerHTML=`<div class="empty"><strong>${tr('empty').replace('{period}',tr(active))}</strong>${tr('emptySub')}<br><button class="btn" style="margin-top:16px" onclick="openForm()">${tr('add')}</button></div>`;return}list.innerHTML=applicable.map(g=>{let n=count(g),pct=Math.min(100,Math.round(n/g.target*100)),isDone=n>=g.target;return `<article class="goal ${isDone?'done':''}"><button class="check" title="${isDone?tr('cancel'):tr('mark')}" onclick="step('${g.id}',${isDone?-1:1})">${isDone?'✓':g.target===1?'○':'＋'}</button><div class="goal-info"><div class="goal-name">${esc(g.name)}</div><div class="goal-meta">${isDone?tr('great'):g.target===1?t openForm=function(g=null){document.querySelector('#goalForm').reset();document.querySelector('#goalId').value=g?.id||'';document.querySelector('#name').value=g?.name||'';document.querySelector('#period').value=g?.period||active;document.querySelector('#target').value=g?.target||1;document.querySelector('#formTitle').textContent=tr(g?'editGoal':'newGoal');document.querySelector('#overlay').classList.add('show');setTimeout(()=>document.querySelector('#name').focus(),50)};deleteGoal=function(id){window.khatwatiConfirm(tr('deleteConfirm'),()=>{goals=goals.filter(g=>g.id!==id);save();toast(tr('deleted'))})};toast=function(t){let e=document.querySelector('#toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),2100)};document.querySelector('#langBtn').onclick=()=>{lang=lang==='ar'?'en':'ar';localStorage.setItem('khatwati-language',lang);syncLanguage()};const oldSubmit=document.querySelector('#goalForm').onsubmit;document.querySelector('#goalForm').onsubmit=e=>{oldSubmit(e);setTimeout(()=>{const e=document.querySelector('#toast');if(e)e.textContent=tr('savedToast')},0)};if('serviceWorker' in navigator && location.protocol!=='file:'){navigator.serviceWorker.register('./sw.js').then(r=>r.update()).catch(()=>{});navigator.serviceWorker.addEventListener('controllerchange',()=>{if(!sessionStorage.getItem('khatwati-sw-refresh')){sessionStorage.setItem('khatwati-sw-refresh','1');location.reload()}});setTimeout(()=>sessionStorage.removeItem('khatwati-sw-refresh'),5000)}syncLanguage();

}

  width: 24px;
  height: 24px;
  border-radius: 8px;
  border: 1.5px solid var(--green);
  background: transparent;
  color: #fff;
  display: grid;
  place-items: center;
  cursor: pointer;
  font-size: 13px;
  flex: none;
}
.v35-todo-item.done .v35-todo-check {
  background: var(--green);
}

/* Ambient Sound Bar in Focus & Study */
.v35-sound-bar {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-wrap: wrap;
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px dashed var(--line);
}
.v35-sound-label {
  font-size: 11px;
  color: var(--muted);
  font-weight: 600;
  margin-inline-end: 4px;
}
.v35-sound-btn {
  border: 1px solid var(--line);
  background: var(--paper);
  color: var(--muted);
  border-radius: 99px;
  padding: 4px 10px;
  font: 600 11px inherit;
  cursor: pointer;
  transition: .15s;
}
.v35-sound-btn.active {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}

/* Study Exam Countdown Card */
.v35-exam-card {
  background: var(--white);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px 18px;
  margin-bottom: 16px;
  box-shadow: var(--shadow);
}
.v35-exam-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
  gap: 10px;
  margin-top: 12px;
}
.v35-exam-item {
  padding: 12px 14px;
  border-radius: 14px;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
}
.v35-exam-days {
  font-weight: 700;
  font-size: 14px;
  padding: 5px 10px;
  border-radius: 10px;
  background: var(--badge-bg);
  color: var(--green);
  white-space: nowrap;
}
.v35-exam-days.soon {
  background: #fff3e0;
  color: #d35400;
}
.v35-exam-days.urgent {
  background: #fdece8;
  color: #c0392b;
}

/* Monthly Activity Heatmap */
.v35-heatmap-grid {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  gap: 6px;
  margin-top: 10px;
}
.v35-heat-cell {
  aspect-ratio: 1;
  border-radius: 9px;
  background: var(--paper);
  border: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  font-size: 11px;
  font-weight: 600;
  color: var(--muted);
  position: relative;
}
.v35-heat-cell.lvl-1 {
  background: color-mix(in srgb, var(--green) 24%, var(--paper));
  color: var(--ink);
}
.v35-heat-cell.lvl-2 {
  background: color-mix(in srgb, var(--green) 52%, var(--paper));
  color: #fff;
}
.v35-heat-cell.lvl-3 {
  background: var(--green);
  color: #fff;
  border-color: var(--green);
}

/* Custom In-App Dialogs (Confirm / Prompt / Notice) */
#khatwatiCustomModal {
  z-index: 2500 !important;
}
.v35-modal-actions {
  display: flex;
  gap: 10px;
  margin-top: 18px;
}
.v35-modal-actions .btn {
  flex: 1;
}
.v35-confetti {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 3000;
}
</style>
<script id="v35-upgrade-script">
(function(){
  const LS = window.localStorage;
  const isEn = () => { try { return LS.getItem('khatwati-language') === 'en'; } catch { return false; } };
  const tx = (ar, en) => isEn() ? en : ar;
  const safeGet = (k, fallback) => { try { const v = LS.getItem(k); return v ? JSON.parse(v) : fallback; } catch { return fallback; } };
  const safeSet = (k, v) => { try { LS.setItem(k, JSON.stringify(v)); } catch {} };
  const dateStr = (d = new Date()) => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;

  // 1. Custom Non-Blocking Modals (replaces alert, confirm, prompt)
  function ensureModalRoot() {
    let el = document.getElementById('khatwatiCustomModal');
    if (!el) {
      document.body.insertAdjacentHTML('beforeend', `
        <div class="overlay" id="khatwatiCustomModal" role="dialog" aria-modal="true">
          <div class="dialog" style="max-width:400px">
            <div class="dialog-head">
              <h3 id="kModalTitle" style="font-size:18px"></h3>
              <button type="button" class="close" id="kModalClose" aria-label="Close">×</button>
            </div>
            <p id="kModalMessage" style="margin:0 0 12px;font-size:14px;line-height:1.6;color:var(--ink)"></p>
            <textarea id="kModalInput" class="field" rows="3" style="display:none;resize:vertical"></textarea>
            <div class="v35-modal-actions">
              <button type="button" class="btn" id="kModalOk"></button>
              <button type="button" class="btn secondary" id="kModalCancel"></button>
            </div>
          </div>
        </div>
      `);
      el = document.getElementById('khatwatiCustomModal');
      el.addEventListener('click', e => { if (e.target === el) el.classList.remove('show'); });
      document.getElementById('kModalClose').onclick = () => el.classList.remove('show');
    }
    return el;
  }

  window.khatwatiNotice = function(msg) {
    const toastEl = document.getElementById('toast');
    if (toastEl) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      setTimeout(() => toastEl.classList.remove('show'), 3200);
    }
  };

  window.khatwatiConfirm = function(message, onConfirm) {
    const modal = ensureModalRoot();
    document.getElementById('kModalTitle').textContent = tx('تأكيد الإجراء', 'Confirm action');
    document.getElementById('kModalMessage').textContent = message;
    const input = document.getElementById('kModalInput');
    input.style.display = 'none';
    const okBtn = document.getElementById('kModalOk');
    const cancelBtn = document.getElementById('kModalCancel');
    okBtn.textContent = tx('نعم، متأكد', 'Yes, confirm');
    cancelBtn.textContent = tx('إلغاء', 'Cancel');
    cancelBtn.style.display = '';
    okBtn.onclick = () => { modal.classList.remove('show'); if (onConfirm) onConfirm(); };
    cancelBtn.onclick = () => modal.classList.remove('show');
    modal.classList.add('show');
  };

  window.khatwatiPrompt = function(title, initialValue, onSave) {
    const modal = ensureModalRoot();
    document.getElementById('kModalTitle').textContent = title;
    document.getElementById('kModalMessage').textContent = tx('تگدر تكتب ملاحظة أو تمسحها بأي وقت:', 'Add or update your note below:');
    const input = document.getElementById('kModalInput');
    input.style.display = 'block';
    input.value = initialValue || '';
    const okBtn = document.getElementById('kModalOk');
    const cancelBtn = document.getElementById('kModalCancel');
    okBtn.textContent = tx('حفظ الملاحظة', 'Save note');
    cancelBtn.textContent = tx('إلغاء', 'Cancel');
    cancelBtn.style.display = '';
    okBtn.onclick = () => { modal.classList.remove('show'); if (onSave) onSave(input.value); };
    cancelBtn.onclick = () => modal.classList.remove('show');
    modal.classList.add('show');
    setTimeout(() => input.focus(), 50);
  };

  window.khatwatiCopyFallback = function(text, successMsg) {
    try {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      ta.remove();
      window.khatwatiNotice(successMsg);
    } catch {
      window.khatwatiNotice(successMsg);
    }
  };

  // 2. Celebratory Confetti Effect
  window.khatwatiCelebrate = function() {
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    const canvas = document.createElement('canvas');
    canvas.className = 'v35-confetti';
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    document.body.appendChild(canvas);
    const ctx = canvas.getContext('2d');
    const colors = ['#28664c', '#85b878', '#e9a66e', '#f6d27b', '#528465', '#477a9c'];
    const pieces = Array.from({length: 42}, () => ({
      x: canvas.width / 2 + (Math.random() - 0.5) * 160,
      y: canvas.height * 0.45,
      vx: (Math.random() - 0.5) * 11,
      vy: -Math.random() * 10 - 4,
      size: Math.random() * 7 + 5,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 6.28,
      vrot: (Math.random() - 0.5) * 0.25
    }));
    let frame = 0;
    function tick() {
      frame++;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      pieces.forEach(p => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.38;
        p.rot += p.vrot;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size/2, -p.size/2, p.size, p.size * 0.65);
        ctx.restore();
      });
      if (frame < 55) requestAnimationFrame(tick);
      else canvas.remove();
    }
    requestAnimationFrame(tick);
  };

  // 3. Dark Mode Toggle
  const DARK_KEY = 'khatwati-dark-mode';
  function isDark() {
    try { return LS.getItem(DARK_KEY) === 'true'; } catch { return false; }
  }
  function applyDark(dark) {
    document.body.dataset.dark = dark ? 'true' : 'false';
    try { LS.setItem(DARK_KEY, dark ? 'true' : 'false'); } catch {}
    const btn = document.getElementById('darkModeBtn');
    if (btn) {
      btn.textContent = dark ? '☀️' : '🌙';
      const label = dark ? tx('الوضع النهاري', 'Light mode') : tx('الوضع الليلي', 'Dark mode');
      btn.title = label;
      btn.setAttribute('aria-label', label);
    }
  }
  function setupDarkToggle() {
    const themeBtn = document.getElementById('themeBtn');
    if (themeBtn && !document.getElementById('darkModeBtn')) {
      const btn = document.createElement('button');
      btn.id = 'darkModeBtn';
      btn.type = 'button';
      btn.className = 'dark-toggle-btn';
      btn.onclick = () => applyDark(!isDark());
      themeBtn.before(btn);
    }
    applyDark(isDark());
  }

  // 4. Goal Categories, Priority, Streak & Filter/Search Bar
  const META_KEY = 'khatwati-goal-meta-v1';
  let goalMeta = safeGet(META_KEY, {});
  let filterCat = 'all';
  let filterStatus = 'all';
  let searchQuery = '';

  const CATEGORIES = {
    habit: { icon: '🌱', ar: 'عادات', en: 'Habits' },
    study: { icon: '📖', ar: 'علم ودراسة', en: 'Study' },
    health: { icon: '🏃', ar: 'صحة', en: 'Health' },
    work: { icon: '💼', ar: 'عمل', en: 'Work' },
    personal: { icon: '✨', ar: 'شخصي', en: 'Personal' }
  };
  const PRIORITIES = {
    normal: { ar: 'عادية', en: 'Normal', cls: '' },
    med: { ar: 'متوسطة ⚡', en: 'Medium ⚡', cls: 'prio-med' },
    high: { ar: 'عالية 🔥', en: 'High 🔥', cls: 'prio-high' }
  };

  function injectGoalFormFields() {
    const form = document.getElementById('goalForm');
    if (!form || document.getElementById('goalCategory')) return;
    const row = form.querySelector('.row');
    if (!row) return;
    row.insertAdjacentHTML('afterend', `
      <div class="row" id="v35GoalMetaRow">
        <div>
          <label for="goalCategory" id="goalCategoryLabel">${tx('تصنيف الهدف', 'Category')}</label>
          <select class="field" id="goalCategory">
            ${Object.entries(CATEGORIES).map(([k, v]) => `<option value="${k}">${v.icon} ${isEn() ? v.en : v.ar}</option>`).join('')}
          </select>
        </div>
        <div>
          <label for="goalPriority" id="goalPriorityLabel">${tx('الأولوية', 'Priority')}</label>
          <select class="field" id="goalPriority">
            ${Object.entries(PRIORITIES).map(([k, v]) => `<option value="${k}">${isEn() ? v.en : v.ar}</option>`).join('')}
          </select>
        </div>
      </div>
    `);
  }

  function updateGoalFormLabels() {
    const catLbl = document.getElementById('goalCategoryLabel');
    const prioLbl = document.getElementById('goalPriorityLabel');
    const catSel = document.getElementById('goalCategory');
    const prioSel = document.getElementById('goalPriority');
    if (catLbl) catLbl.textContent = tx('تصنيف الهدف', 'Category');
    if (prioLbl) prioLbl.textContent = tx('الأولوية', 'Priority');
    if (catSel) {
      Array.from(catSel.options).forEach(opt => {
        const c = CATEGORIES[opt.value];
        if (c) opt.textContent = `${c.icon} ${isEn() ? c.en : c.ar}`;
      });
    }
    if (prioSel) {
      Array.from(prioSel.options).forEach(opt => {
        const p = PRIORITIES[opt.value];
        if (p) opt.textContent = isEn() ? p.en : p.ar;
      });
    }
  }

  // Hook openForm and goalForm submit to load/save category & priority
  const origOpenForm = window.openForm;
  if (typeof origOpenForm === 'function') {
    window.openForm = function(g = null) {
      injectGoalFormFields();
      updateGoalFormLabels();
      origOpenForm(g);
      const id = g?.id || '';
      const m = goalMeta[id] || { category: 'habit', priority: 'normal' };
      const catEl = document.getElementById('goalCategory');
      const prioEl = document.getElementById('goalPriority');
      if (catEl) catEl.value = m.category || 'habit';
      if (prioEl) prioEl.value = m.priority || 'normal';
    };
  }

  const goalFormEl = document.getElementById('goalForm');
  if (goalFormEl) {
    goalFormEl.addEventListener('submit', () => {
      setTimeout(() => {
        try {
          const allGoals = safeGet('khatwati-goals-v1', []);
          const idInput = document.getElementById('goalId')?.value;
          const targetGoal = idInput ? allGoals.find(x => x.id === idInput) : allGoals[allGoals.length - 1];
          if (targetGoal) {
            goalMeta[targetGoal.id] = {
              category: document.getElementById('goalCategory')?.value || 'habit',
              priority: document.getElementById('goalPriority')?.value || 'normal'
            };
            safeSet(META_KEY, goalMeta);
            enhanceGoalCards();
          }
        } catch {}
      }, 20);
    });
  }

  // Hook step() to celebrate when a goal reaches its target
  const origStep = window.step;
  if (typeof origStep === 'function') {
    window.step = function(id, delta) {
      origStep(id, delta);
      if (delta > 0) {
        try {
          const g = safeGet('khatwati-goals-v1', []).find(x => x.id === id);
          if (g && count(g) >= g.target) window.khatwatiCelebrate();
        } catch {}
      }
      if (window.khatwatiRunSyncNow) window.khatwatiRunSyncNow();
    };
  }

  function calcGoalStreak(g) {
    if (!g || g.period !== 'daily' || !g.records) return 0;
    let s = 0;
    const d = new Date();
    d.setHours(0,0,0,0);
    for (let i = 0; i < 365; i++) {
      const k = dateStr(d);
      if ((g.records[k] || 0) >= g.target) {
        s++;
        d.setDate(d.getDate() - 1);
      } else if (i === 0) {
        d.setDate(d.getDate() - 1);
      } else {
        break;
      }
    }
    return s;
  }

  function installFilterBar() {
    const goalSection = document.getElementById('goalSection');
    const goalList = document.getElementById('goalList');
    if (!goalSection || !goalList || document.getElementById('goalFilterBar')) return;
    goalList.insertAdjacentHTML('beforebegin', `
      <div class="v35-filter-bar" id="goalFilterBar">
        <div class="v35-search-wrap">
          <input type="search" id="goalSearchInput" class="v35-search-input" placeholder="${tx('🔍 ابحث عن هدف...', '🔍 Search goals...')}" aria-label="${tx('ابحث عن هدف', 'Search goals')}">
        </div>
        <div class="v35-pills" id="goalCatPills"></div>
        <select class="v35-pill" id="goalStatusSelect" aria-label="${tx('فلترة الحالة', 'Filter status')}">
          <option value="all">${tx('كل الحالات', 'All status')}</option>
          <option value="todo">${tx('قيد الإنجاز', 'In progress')}</option>
          <option value="done">${tx('مكتمل ✓', 'Completed ✓')}</option>
        </select>
      </div>
    `);
    document.getElementById('goalSearchInput').addEventListener('input', e => {
      searchQuery = e.target.value.trim().toLowerCase();
      applyGoalFilters();
    });
    document.getElementById('goalStatusSelect').addEventListener('change', e => {
      filterStatus = e.target.value;
      applyGoalFilters();
    });
    renderFilterPills();
  }

  function renderFilterPills() {
    const box = document.getElementById('goalCatPills');
    if (!box) return;
    const items = [['all', tx('الكل', 'All')], ...Object.entries(CATEGORIES).map(([k, v]) => [k, `${v.icon} ${isEn() ? v.en : v.ar}`])];
    box.innerHTML = items.map(([k, label]) => `<button type="button" class="v35-pill ${filterCat === k ? 'active' : ''}" data-cat="${k}">${label}</button>`).join('');
    box.querySelectorAll('button').forEach(b => {
      b.onclick = () => {
        filterCat = b.dataset.cat;
        renderFilterPills();
        applyGoalFilters();
      };
    });
    const searchEl = document.getElementById('goalSearchInput');
    if (searchEl) searchEl.placeholder = tx('🔍 ابحث عن هدف...', '🔍 Search goals...');
    const statusSel = document.getElementById('goalStatusSelect');
    if (statusSel && statusSel.options.length === 3) {
      statusSel.options[0].textContent = tx('كل الحالات', 'All status');
      statusSel.options[1].textContent = tx('قيد الإنجاز', 'In progress');
      statusSel.options[2].textContent = tx('مكتمل ✓', 'Completed ✓');
    }
  }

  function enhanceGoalCards() {
    installFilterBar();
    const allGoals = safeGet('khatwati-goals-v1', []);
    document.querySelectorAll('#goalList .goal').forEach(card => {
      const id = card.querySelector('.goal-actions button[onclick*="editGoal"]')?.getAttribute('onclick')?.match(/editGoal\('([^']+)'\)/)?.[1];
      if (!id) return;
      card.dataset.goalId = id;
      const g = allGoals.find(x => x.id === id);
      const m = goalMeta[id] || { category: 'habit', priority: 'normal' };
      const cat = CATEGORIES[m.category] || CATEGORIES.habit;
      const prio = PRIORITIES[m.priority] || PRIORITIES.normal;
      const streak = calcGoalStreak(g);
      const info = card.querySelector('.goal-info');
      if (info) {
        let badgeBox = info.querySelector('.v35-goal-badges');
        if (!badgeBox) {
          badgeBox = document.createElement('div');
          badgeBox.className = 'v35-goal-badges';
          const metaEl = info.querySelector('.goal-meta');
          if (metaEl) metaEl.after(badgeBox);
          else info.appendChild(badgeBox);
        }
        badgeBox.innerHTML = `
          <span class="v35-tag">${cat.icon} ${isEn() ? cat.en : cat.ar}</span>
          ${m.priority && m.priority !== 'normal' ? `<span class="v35-tag ${prio.cls}">${isEn() ? prio.en : prio.ar}</span>` : ''}
          ${streak > 0 ? `<span class="v35-tag streak-tag">🔥 ${streak} ${tx('يوم متتالي', 'day streak')}</span>` : ''}
        `;
      }
    });
    applyGoalFilters();
  }

  function applyGoalFilters() {
    document.querySelectorAll('#goalList .goal').forEach(card => {
      const id = card.dataset.goalId;
      const m = goalMeta[id] || { category: 'habit', priority: 'normal' };
      const name = (card.querySelector('.goal-name')?.textContent || '').toLowerCase();
      const isDone = card.classList.contains('done');
      const matchCat = filterCat === 'all' || m.category === filterCat;
      const matchStatus = filterStatus === 'all' || (filterStatus === 'done' ? isDone : !isDone);
      const matchSearch = !searchQuery || name.includes(searchQuery);
      card.style.display = (matchCat && matchStatus && matchSearch) ? '' : 'none';
    });
  }

  // 5. Quick Daily To-Do List (#quickTasksCard)
  const TODO_KEY = 'khatwati-todos-v1';
  function installQuickTasks() {
    const goalSection = document.getElementById('goalSection');
    if (!goalSection || document.getElementById('quickTasksCard')) return;
    goalSection.insertAdjacentHTML('beforeend', `
      <section class="v35-todo-card" id="quickTasksCard">
        <div class="v35-todo-head">
          <h3 id="todoCardTitle">⚡ ${tx('مهام اليوم السريعة', 'Quick Daily Tasks')}</h3>
          <button type="button" class="v35-pill" id="clearDoneTodos">${tx('مسح المكتمل', 'Clear completed')}</button>
        </div>
        <form class="v35-todo-form" id="todoQuickForm">
          <input type="text" id="todoQuickInput" class="v35-search-input" maxlength="80" placeholder="${tx('أضف مهمة سريعة لليوم (مثال: اتصال، مشوار، مراجعة)...', 'Add a quick task for today...')}" required>
          <button type="submit" class="btn" id="todoAddBtn" style="padding:8px 15px">＋ ${tx('إضافة', 'Add')}</button>
        </form>
        <div class="v35-todo-list" id="todoQuickList"></div>
      </section>
    `);
    document.getElementById('todoQuickForm').addEventListener('submit', e => {
      e.preventDefault();
      const input = document.getElementById('todoQuickInput');
      const text = input.value.trim();
      if (!text) return;
      const todos = safeGet(TODO_KEY, []);
      todos.unshift({ id: 'todo-' + Date.now(), text, done: false });
      safeSet(TODO_KEY, todos);
      input.value = '';
      renderQuickTasks();
    });
    document.getElementById('clearDoneTodos').addEventListener('click', () => {
      const todos = safeGet(TODO_KEY, []).filter(t => !t.done);
      safeSet(TODO_KEY, todos);
      renderQuickTasks();
    });
    renderQuickTasks();
  }

  function renderQuickTasks() {
    const listEl = document.getElementById('todoQuickList');
    if (!listEl) return;
    const titleEl = document.getElementById('todoCardTitle');
    if (titleEl) titleEl.textContent = '⚡ ' + tx('مهام اليوم السريعة', 'Quick Daily Tasks');
    const clearBtn = document.getElementById('clearDoneTodos');
    if (clearBtn) clearBtn.textContent = tx('مسح المكتمل', 'Clear completed');
    const input = document.getElementById('todoQuickInput');
    if (input) input.placeholder = tx('أضف مهمة سريعة لليوم (مثال: اتصال، مشوار، مراجعة)...', 'Add a quick task for today...');
    const addBtn = document.getElementById('todoAddBtn');
    if (addBtn) addBtn.textContent = '＋ ' + tx('إضافة', 'Add');

    const todos = safeGet(TODO_KEY, []);
    if (!todos.length) {
      listEl.innerHTML = `<div style="font-size:12px;color:var(--muted);text-align:center;padding:8px 0">${tx('ما عندك مهام سريعة حالياً — سجّل أي شغلة يومية خفيفة هنا ✨', 'No quick tasks right now — jot down any small daily errands here ✨')}</div>`;
      return;
    }
    listEl.innerHTML = todos.map(t => `
      <div class="v35-todo-item ${t.done ? 'done' : ''}">
        <button type="button" class="v35-todo-check" data-todo-toggle="${t.id}" aria-label="${tx('تبديل حالة المهمة', 'Toggle task')}">${t.done ? '✓' : ''}</button>
        <span style="flex:1;font-size:13px">${t.text.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</span>
        <button type="button" class="iconbtn" data-todo-del="${t.id}" title="${tx('حذف', 'Delete')}" aria-label="${tx('حذف', 'Delete')}">⌫</button>
      </div>
    `).join('');
    listEl.querySelectorAll('[data-todo-toggle]').forEach(btn => {
      btn.onclick = () => {
        const all = safeGet(TODO_KEY, []);
        const item = all.find(x => x.id === btn.dataset.todoToggle);
        if (item) {
          item.done = !item.done;
          safeSet(TODO_KEY, all);
          renderQuickTasks();
        }
      };
    });
    listEl.querySelectorAll('[data-todo-del]').forEach(btn => {
      btn.onclick = () => {
        const all = safeGet(TODO_KEY, []).filter(x => x.id !== btn.dataset.todoDel);
        safeSet(TODO_KEY, all);
        renderQuickTasks();
      };
    });
  }

  // 6. Synthesized Offline Web Audio Ambient Sounds (Rain, Waves, Forest Wind) + 5-min Break
  let audioCtx = null;
  let activeSoundNode = null;
  let activeSoundMode = 'off';

  let cachedNoiseBuffer = null;
  const stopAmbientSound = window.stopKhatwatiAmbientSound = function() {
    if (activeSoundNode) {
      try { activeSoundNode.onended = null; activeSoundNode.stop(0); } catch {}
      try { activeSoundNode.disconnect(); } catch {}
      activeSoundNode = null;
    }
    if (audioCtx && audioCtx.state === 'running') {
      try { audioCtx.suspend(); } catch {}
    }
    activeSoundMode = 'off';
    updateSoundButtons();
  }

  function playAmbientSound(mode) {
    if (mode === 'off' || mode === activeSoundMode) {
      stopAmbientSound();
      return;
    }
    stopAmbientSound();
    try {
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioContextClass) return;
      if (!audioCtx) audioCtx = new AudioContextClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (!cachedNoiseBuffer) {
        const bufferSize = audioCtx.sampleRate * 2;
        cachedNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = cachedNoiseBuffer.getChannelData(0);
        let lastOut = 0.0;
        for (let i = 0; i < bufferSize; i++) {
          const white = Math.random() * 2 - 1;
          data[i] = (lastOut + (0.02 * white)) / 1.02;
          lastOut = data[i];
          data[i] *= 2.8;
        }
      }

      const source = audioCtx.createBufferSource();
      source.buffer = cachedNoiseBuffer;
      source.loop = true;

      const filter = audioCtx.createBiquadFilter();
      const gain = audioCtx.createGain();

      if (mode === 'rain') {
        filter.type = 'bandpass';
        filter.frequency.value = 950;
        filter.Q.value = 0.7;
        gain.gain.value = 0.07;
      } else if (mode === 'waves') {
        filter.type = 'lowpass';
        filter.frequency.value = 320;
        gain.gain.value = 0.09;
      } else {
        filter.type = 'bandpass';
        filter.frequency.value = 520;
        filter.Q.value = 1.4;
        gain.gain.value = 0.06;
      }

      source.connect(filter);
      filter.connect(gain);
      gain.connect(audioCtx.destination);
      source.start(0);
      activeSoundNode = source;
      activeSoundMode = mode;
      updateSoundButtons();
    } catch {}
  }

  function updateSoundButtons() {
    document.querySelectorAll('[data-ambient-sound]').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.ambientSound === activeSoundMode);
    });
  }

  function buildSoundBarHTML() {
    return `
      <div class="v35-sound-bar">
        <span class="v35-sound-label">🎧 ${tx('أصوات التركيز:', 'Focus sound:')}</span>
        <button type="button" class="v35-sound-btn ${activeSoundMode==='rain'?'active':''}" data-ambient-sound="rain">🌧️ ${tx('مطر', 'Rain')}</button>
        <button type="button" class="v35-sound-btn ${activeSoundMode==='waves'?'active':''}" data-ambient-sound="waves">🌊 ${tx('أمواج', 'Waves')}</button>
        <button type="button" class="v35-sound-btn ${activeSoundMode==='wind'?'active':''}" data-ambient-sound="wind">🌲 ${tx('غابة', 'Forest')}</button>
        <button type="button" class="v35-sound-btn ${activeSoundMode==='off'?'active':''}" data-ambient-sound="off">🔕 ${tx('صامت', 'Mute')}</button>
      </div>
    `;
  }

  function decorateFocusAndStudyRoom() {
    const focusCard = document.getElementById('focusCard');
    if (focusCard && !focusCard.querySelector('.v35-sound-bar')) {
      const copy = focusCard.querySelector('.focus-copy');
      if (copy) copy.insertAdjacentHTML('beforeend', buildSoundBarHTML());
      const durSelect = document.getElementById('focusDuration');
      if (durSelect && !durSelect.querySelector('option[value="5"]')) {
        durSelect.insertAdjacentHTML('afterbegin', `<option value="5">5 ${tx('دقائق (استراحة ☕)', 'min (Break ☕)')}</option>`);
      }
    }
    const studyDialog = document.querySelector('#studyTimerOverlay .study-timer-dialog');
    if (studyDialog && !studyDialog.querySelector('.v35-sound-bar')) {
      const scenes = studyDialog.querySelector('.study-scenes');
      if (scenes) scenes.insertAdjacentHTML('afterend', buildSoundBarHTML());
    }
  }

  document.addEventListener('click', e => {
    const soundBtn = e.target.closest('[data-ambient-sound]');
    if (soundBtn) {
      playAmbientSound(soundBtn.dataset.ambientSound);
    }
  });

  // 7. Study Exam Countdown Card (#examCountdownCard)
  const EXAM_KEY = 'khatwati-exams-v1';
  function installExamCountdown() {
    const studySection = document.getElementById('studySection');
    if (!studySection || document.getElementById('examCountdownCard')) return;
    studySection.insertAdjacentHTML('beforeend', `
      <section class="v35-exam-card" id="examCountdownCard">
        <div class="v35-todo-head">
          <h3>⏳ ${tx('العداد التنازلي للامتحانات والمواعيد', 'Exams & Deadlines Countdown')}</h3>
        </div>
        <form class="v35-todo-form" id="examQuickForm" style="flex-wrap:wrap">
          <input type="text" id="examTitleInput" class="v35-search-input" style="flex:2 1 160px" maxlength="60" placeholder="${tx('اسم الامتحان أو التسليم...', 'Exam or project name...')}" required>
          <input type="date" id="examDateInput" class="v35-search-input" style="flex:1 1 130px" min="${dateStr()}" value="${dateStr(new Date(Date.now()+7*86400000))}" required aria-label="${tx('تاريخ الامتحان', 'Exam date')}">
          <button type="submit" class="btn" style="padding:8px 14px">＋ ${tx('أضف موعد', 'Add date')}</button>
        </form>
        <div class="v35-exam-list" id="examCountdownList"></div>
      </section>
    `);
    document.getElementById('examQuickForm').addEventListener('submit', e => {
      e.preventDefault();
      const title = document.getElementById('examTitleInput').value.trim();
      const date = document.getElementById('examDateInput').value;
      if (!title || !date) return;
      const exams = safeGet(EXAM_KEY, []);
      exams.push({ id: 'exam-' + Date.now(), title, date });
      exams.sort((a, b) => a.date.localeCompare(b.date));
      safeSet(EXAM_KEY, exams);
      document.getElementById('examTitleInput').value = '';
      renderExams();
    });
    renderExams();
  }

  function renderExams() {
    const listEl = document.getElementById('examCountdownList');
    if (!listEl) return;
    const exams = safeGet(EXAM_KEY, []);
    if (!exams.length) {
      listEl.innerHTML = `<div style="font-size:12px;color:var(--muted);grid-column:1/-1">${tx('أضف مواعيد امتحاناتك أو مشاريعك حتى تتابع الأيام المتبقية بوضوح.', 'Add upcoming exams or deadlines to track remaining days.')}</div>`;
      return;
    }
    const today = new Date();
    today.setHours(0,0,0,0);
    listEl.innerHTML = exams.map(ex => {
      const due = new Date(ex.date + 'T00:00:00');
      const days = Math.ceil((due - today) / 86400000);
      const cls = days <= 2 ? 'urgent' : days <= 7 ? 'soon' : '';
      const label = days < 0 ? tx('انتهى', 'Passed') : days === 0 ? tx('اليوم! 🎯', 'Today! 🎯') : `${days} ${tx('يوم', 'days')}`;
      return `
        <div class="v35-exam-item">
          <div>
            <strong style="font-size:13px;display:block">${ex.title.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</strong>
            <small style="font-size:11px;color:var(--muted)">${ex.date}</small>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <span class="v35-exam-days ${cls}">${label}</span>
            <button type="button" class="iconbtn" data-exam-del="${ex.id}" aria-label="${tx('حذف', 'Delete')}">⌫</button>
          </div>
        </div>
      `;
    }).join('');
    listEl.querySelectorAll('[data-exam-del]').forEach(btn => {
      btn.onclick = () => {
        const next = safeGet(EXAM_KEY, []).filter(x => x.id !== btn.dataset.examDel);
        safeSet(EXAM_KEY, next);
        renderExams();
      };
    });
  }

  // 8. Monthly Activity Heatmap (#monthlyHeatmapCard) & In-App Quick View Modal
  function installMonthlyHeatmap() {
    const grid = document.querySelector('#extraStats .extra-grid');
    if (!grid || document.getElementById('monthlyHeatmapCard')) return;
    grid.insertAdjacentHTML('beforeend', `
      <article id="monthlyHeatmapCard" class="weekly-card">
        <h3>🗓️ ${tx('خريطة الالتزام (آخر ٢٨ يوم)', '28-Day Consistency Heatmap')}</h3>
        <p class="weekly-detail">${tx('كل مربع يمثل نشاطك اليومي في الأهداف والقراءة والدراسة.', 'Each square shows your daily activity across goals, reading, and study.')}</p>
        <div class="v35-heatmap-grid" id="v35HeatmapGrid"></div>
      </article>
    `);
    renderMonthlyHeatmap();
  }

  function renderMonthlyHeatmap() {
    const box = document.getElementById('v35HeatmapGrid');
    if (!box) return;
    const goals = safeGet('khatwati-goals-v1', []);
    const books = safeGet('khatwati-books-v1', []);
    const study = safeGet('khatwati-study-v1', []);
    const days = Array.from({length: 28}, (_, i) => {
      const d = new Date();
      d.setHours(0,0,0,0);
      d.setDate(d.getDate() - (27 - i));
      return d;
    });
    box.innerHTML = days.map(d => {
      const k = dateStr(d);
      let score = 0;
      goals.forEach(g => { if (g.period === 'daily' && (g.records?.[k] || 0) >= g.target) score++; });
      books.forEach(b => { if ((b.history || []).some(h => h.date === k && h.delta > 0)) score++; });
      study.forEach(s => { if ((s.studyHistory || []).some(h => h.date === k && h.minutes > 0)) score++; });
      const lvl = score >= 3 ? 'lvl-3' : score === 2 ? 'lvl-2' : score === 1 ? 'lvl-1' : '';
      return `<div class="v35-heat-cell ${lvl}" title="${k}: ${score} ${tx('أنشطة', 'activities')}">${d.getDate()}</div>`;
    }).join('');
  }

  // Intercept .quick-link so it opens an interactive in-app iPhone Widget preview in Canvas & browser
  document.addEventListener('click', e => {
    const link = e.target.closest('a.quick-link');
    if (!link) return;
    e.preventDefault();
    let modal = document.getElementById('v35WidgetPreviewOverlay');
    if (modal) modal.remove();
    const goals = safeGet('khatwati-goals-v1', []).filter(g => g.period === 'daily');
    const books = safeGet('khatwati-books-v1', []);
    const todayK = dateStr();
    document.body.insertAdjacentHTML('beforeend', `
      <div class="overlay show" id="v35WidgetPreviewOverlay">
        <div class="dialog" style="max-width:420px">
          <div class="dialog-head">
            <h3>📱 ${tx('نظرة سريعة للآيفون', 'iPhone Quick View')}</h3>
            <button type="button" class="close" id="v35WidgetClose" aria-label="Close">×</button>
          </div>
          <p class="weekly-detail" style="margin-top:0">${tx('واجهة مصغّرة سريعة لمتابعة أهداف اليوم والقراءة:', 'Compact quick-glance view for today’s goals and reading:')}</p>
          <div style="background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px;margin-bottom:10px">
            <strong style="font-size:13px;display:block;margin-bottom:8px">🎯 ${tx('أهداف اليوم', 'Today’s Goals')} (${goals.filter(g=>(g.records?.[todayK]||0)>=g.target).length}/${goals.length})</strong>
            ${goals.length ? goals.map(g => {
              const n = g.records?.[todayK] || 0;
              return `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0;border-bottom:1px dashed var(--line)"><span>${g.name}</span><b>${n}/${g.target}</b></div>`;
            }).join('') : `<div style="font-size:12px;color:var(--muted)">${tx('ما عندك أهداف يومية بعد', 'No daily goals yet')}</div>`}
          </div>
          <div style="background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:12px">
            <strong style="font-size:13px;display:block;margin-bottom:8px">📚 ${tx('القراءة الحالية', 'Current Reading')}</strong>
            ${books.length ? books.map(b => `<div style="display:flex;justify-content:space-between;font-size:12px;padding:4px 0"><span>${b.title}</span><b>${Math.min(100,Math.round(b.current/b.total*100))}%</b></div>`).join('') : `<div style="font-size:12px;color:var(--muted)">${tx('ما عندك كتب مضافة بعد', 'No books added yet')}</div>`}
          </div>
        </div>
      </div>
    `);
    document.getElementById('v35WidgetClose').onclick = () => document.getElementById('v35WidgetPreviewOverlay')?.remove();
    document.getElementById('v35WidgetPreviewOverlay').onclick = ev => {
      if (ev.target.id === 'v35WidgetPreviewOverlay') ev.currentTarget.remove();
    };
  });

  function syncAllV35() {
    setupDarkToggle();
    injectGoalFormFields();
    updateGoalFormLabels();
    enhanceGoalCards();
    installQuickTasks();
    decorateFocusAndStudyRoom();
    installExamCountdown();
    installMonthlyHeatmap();
    renderMonthlyHeatmap();
  }

  window._khatwatiSyncFns = window._khatwatiSyncFns || [];
  window._khatwatiSyncFns.push(syncAllV35);

  document.addEventListener('click', e => {
    if (e.target.id === 'langBtn') {
      setTimeout(() => {
        document.getElementById('goalFilterBar')?.remove();
        document.getElementById('quickTasksCard')?.remove();
        document.getElementById('examCountdownCard')?.remove();
        document.getElementById('monthlyHeatmapCard')?.remove();
        document.querySelectorAll('.v35-sound-bar').forEach(el => el.remove());
        syncAllV35();
      }, 140);
    }
  });

  syncAllV35();
})();
</script>
